name: Windows AMD - Prueba 4 - Commits upstream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - AMD base + upstream optimizations
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout patches from workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _patch_source
          sparse-checkout: patches
          fetch-depth: 1
          submodules: false

      - name: Verify AMD base
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "4068f4ac886dcd25acc52b6e3fa3e3800dc576a9"
          $actual = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "Could not read source commit"
          }
          if ($actual -ne $expected) {
            throw "Unexpected source commit: $actual"
          }

          Write-Host "AMD base verified: $actual"

      - name: Apply lightweight diagnostics patch
        run: |
          $ErrorActionPreference = "Stop"
          $patch = "_patch_source/patches/KytyPS5_light_drain_stats.patch"

          if (-not (Test-Path $patch)) {
            throw "Missing patch: $patch"
          }

          git apply --ignore-whitespace --check $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Light diagnostics patch does not apply"
          }

          git apply --ignore-whitespace $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Light diagnostics patch application failed"
          }

      - name: Apply vertex metadata optimization
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError("Unexpected source: " + path)
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          header = "src/graphics/shader/shaderVertexMetadata.h"
          replace_once(header, "#include <array>", "#include <span>")
          replace_once(header,
              "std::array<ShaderSemantic, ShaderVertexInputInfo::RES_MAX> input_semantics {};",
              "std::span<const ShaderSemantic> input_semantics {};")
          replace_once(header,
              "// Copies the small AGC metadata subset used by the vertex path after validating every guest range.",
              "// Validates vertex metadata and borrows its semantics for immediate draw preparation.")

          source = "src/graphics/shader/shaderVertexMetadata.cpp"
          replace_once(source,
              "\tconst auto semantic_size =\n\t    static_cast<uint64_t>(data.num_input_semantics) * sizeof(ShaderSemantic);\n",
              "")
          replace_once(source,
              "std::memcpy(next.input_semantics.data(), data.input_semantics, semantic_size);",
              "next.input_semantics = {data.input_semantics, data.num_input_semantics};")

          print("Vertex metadata optimization applied")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Metadata adaptation failed"
          }

      - name: Apply pinned upstream optimizations
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "https://github.com/KytyPS5/KytyPS5.git"

          $commits = @(
            "a67a033ff88406707f47492a7cdcfef736973d66",
            "f3dc5ee4a9e0725b17bd3e0a4ad1bdbeb0afc8a9"
          )

          foreach ($commit in $commits) {
            git fetch --no-tags --depth=2 $repo $commit
            if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch $commit"
            }

            $patch = Join-Path $env:RUNNER_TEMP "$commit.patch"
            git diff --output=$patch "$commit^" $commit -- src
            if ($LASTEXITCODE -ne 0) {
              throw "Could not generate $commit patch"
            }

            git apply --check $patch
            if ($LASTEXITCODE -ne 0) {
              throw "Patch does not apply: $commit"
            }

            git apply $patch
            if ($LASTEXITCODE -ne 0) {
              throw "Patch application failed: $commit"
            }

            Write-Host "Applied upstream commit: $commit"
          }

      - name: Verify patched source
        run: |
          $ErrorActionPreference = "Stop"

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid source diff"
          }

          $config = Get-Content "src/common/emulatorConfig.h" -Raw
          if ($config -notmatch 'gpu_frames_ahead\s*=\s*0\s*;') {
            throw "Expected original gpu_frames_ahead = 0"
          }

          $stats = Get-Content "src/graphics/host_gpu/renderer/drainStats.cpp" -Raw
          if (-not $stats.Contains("KYTY_LIGHT_DRAIN_STATS")) {
            throw "Light diagnostics verification failed"
          }

          git diff --stat

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Install glslang
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            "User-Agent" = "GitHub-Actions-KytyPS5"
            "Accept" = "application/vnd.github+json"
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot" `
            -Headers $headers

          $asset = $release.assets | Where-Object {
            $_.name -match "(?i)windows" -and
            $_.name -match "(?i)(x64|x86_64|amd64)" -and
            $_.name -match "(?i)\.zip$"
          } | Select-Object -First 1

          if (-not $asset) {
            $asset = $release.assets | Where-Object {
              $_.name -match "(?i)windows" -and
              $_.name -match "(?i)\.zip$"
            } | Select-Object -First 1
          }

          if (-not $asset) {
            throw "No Windows glslang ZIP found"
          }

          $zip = "$env:RUNNER_TEMP/glslang.zip"
          $extract = "$env:RUNNER_TEMP/glslang"

          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $validator = Get-ChildItem $extract -Filter "glslangValidator.exe" -Recurse |
            Select-Object -First 1

          if (-not $validator) {
            $validator = Get-ChildItem $extract -Filter "glslang.exe" -Recurse |
              Select-Object -First 1
          }

          if (-not $validator) {
            throw "glslang executable missing"
          }

          if ($validator.Name -eq "glslang.exe") {
            Copy-Item $validator.FullName `
              (Join-Path $validator.Directory.FullName "glslangValidator.exe") -Force
          }

          Add-Content $env:GITHUB_PATH $validator.Directory.FullName

      - name: Verify glslang
        run: |
          glslangValidator --version
          if ($LASTEXITCODE -ne 0) {
            throw "glslang verification failed"
          }

      - name: Configure CMake
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed"
          }

      - name: Build KytyPS5 and tests
        run: |
          cmake `
            --build _Build/windows `
            --target launcher shader_vertex_metadata_tests memory_tracker_tests shader_cfg_tests `
            --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Test memory and shader paths
        run: |
          ctest --test-dir _Build/windows `
            -R '^(shader_vertex_metadata|memory_tracker|shader_cfg)$' `
            --output-on-failure `
            --no-tests=error

          if ($LASTEXITCODE -ne 0) {
            throw "Memory or shader tests failed"
          }

      - name: Install KytyPS5
        run: |
          cmake `
            --install _Build/windows `
            --prefix _Build/windows/install

          if ($LASTEXITCODE -ne 0) {
            throw "Install failed"
          }

      - name: Package launcher and build identity
        run: |
          $ErrorActionPreference = "Stop"
          $install = "_Build/windows/install"

          if (-not (Test-Path "$install/launcher.exe")) {
            throw "launcher.exe missing"
          }

          @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            'set KYTY_SPECULATE_DRAWS=1',
            'set KYTY_BDA_DIRTY_BOUNDS=0',
            'set KYTY_ORDERED_SUSPEND=0',
            'set KYTY_GPU_READBACK_WINDOW_KIB=',
            'set KYTY_LIGHT_DRAIN_STATS=1',
            'set KYTY_DEBUG_DRAW_PHASES=',
            'set KYTY_DEBUG_DRAW_STATS=',
            'set KYTY_DEBUG_SPEC_STATS=',
            'set KYTY_DEBUG_STREAM_STATS=',
            'set KYTY_DEBUG_UPLOADS=',
            'set KYTY_GPU_ZONES=',
            '"%~dp0launcher.exe" %*'
          ) | Set-Content "$install/Prueba-4.cmd" -Encoding ascii

          @(
            "Base AMD: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9",
            "Upstream: a67a033ff88406707f47492a7cdcfef736973d66",
            "Upstream: f3dc5ee4a9e0725b17bd3e0a4ad1bdbeb0afc8a9",
            "Vertex metadata adaptation e57c37f retained.",
            "Original readback and suspend; speculative draws enabled.",
            "Copy your working _Patches folder beside launcher.exe.",
            "Select THIS folder's kyty_emulator.exe in the launcher.",
            "Compare against the previous build with speculation enabled.",
            "No FPS improvement guaranteed."
          ) | Set-Content "$install/PRUEBA-4.txt" -Encoding ascii

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath "KytyPS5-Windows-AMD-Prueba-4-Upstream.zip" `
            -Force

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-AMD-Prueba-4-Upstream
          path: KytyPS5-Windows-AMD-Prueba-4-Upstream.zip
          if-no-files-found: error
          retention-days: 7
