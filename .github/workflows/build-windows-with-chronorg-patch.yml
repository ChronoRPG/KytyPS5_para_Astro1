name: Windows AMD - Prueba 9 - Operaciones de memoria

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout existing patches
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _patch_source
          sparse-checkout: patches
          fetch-depth: 1
          submodules: false

      - name: Verify AMD base
        run: |
          $ErrorActionPreference = "Stop"
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read source commit"
          }
          if ($actual -ne "4068f4ac886dcd25acc52b6e3fa3e3800dc576a9") {
            throw "Unexpected AMD source: $actual"
          }

      - name: Apply lightweight diagnostics patch
        run: |
          $ErrorActionPreference = "Stop"
          $patch = "_patch_source/patches/KytyPS5_light_drain_stats.patch"
          if (-not (Test-Path $patch)) {
            throw "Missing patch: $patch"
          }
          git apply --ignore-whitespace --check $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Light diagnostics patch does not apply"
          }
          git apply --ignore-whitespace $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Light diagnostics patch failed"
          }

      - name: Adapt vertex metadata optimization
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text(encoding="utf-8")
              if s.count(old)!=1:
                  raise RuntimeError("Unexpected source: "+path)
              p.write_text(s.replace(old,new),encoding="utf-8",newline="\n")
          h="src/graphics/shader/shaderVertexMetadata.h"
          replace_once(h,"#include <array>","#include <span>")
          replace_once(h,
              "std::array<ShaderSemantic, ShaderVertexInputInfo::RES_MAX> input_semantics {};",
              "std::span<const ShaderSemantic> input_semantics {};")
          replace_once(h,
              "// Copies the small AGC metadata subset used by the vertex path after validating every guest range.",
              "// Validates vertex metadata and borrows its semantics for immediate draw preparation.")
          c="src/graphics/shader/shaderVertexMetadata.cpp"
          replace_once(c,
              "\tconst auto semantic_size =\n\t    static_cast<uint64_t>(data.num_input_semantics) * sizeof(ShaderSemantic);\n",
              "")
          replace_once(c,
              "std::memcpy(next.input_semantics.data(), data.input_semantics, semantic_size);",
              "next.input_semantics = {data.input_semantics, data.num_input_semantics};")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Metadata adaptation failed"
          }

      - name: Apply pinned upstream optimizations
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "https://github.com/KytyPS5/KytyPS5.git"
          $commits = @(
            "a67a033ff88406707f47492a7cdcfef736973d66",
            "f3dc5ee4a9e0725b17bd3e0a4ad1bdbeb0afc8a9"
          )
          foreach ($commit in $commits) {
            git fetch --no-tags --depth=2 $repo $commit
            if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch $commit"
            }
            $patch = Join-Path $env:RUNNER_TEMP "$commit.patch"
            git diff --output=$patch "$commit^" $commit -- src
            if ($LASTEXITCODE -ne 0) {
              throw "Could not generate patch: $commit"
            }
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) {
              throw "Patch does not apply: $commit"
            }
            git apply $patch
            if ($LASTEXITCODE -ne 0) {
              throw "Patch failed: $commit"
            }
          }

      - name: Add address space diagnostics
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          header = r'''#pragma once
          #include "common/common.h"
          #include <array>
          #include <atomic>
          #include <chrono>
          #include <cstdint>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <mutex>
          #include <thread>
          #if KYTY_PLATFORM == KYTY_PLATFORM_WINDOWS
          #include <windows.h>
          #undef min
          #undef max
          #undef MemoryBarrier
          #endif

          namespace Libs::Graphics::AddressSpaceDiagnostics {
          inline bool Enabled() {
              static const bool enabled = [] {
                  const char* v = std::getenv("KYTY_ADDRESS_SPACE_DIAGNOSTICS");
                  return v && std::strcmp(v, "1") == 0;
              }();
              return enabled;
          }
          inline uint64_t Now() {
              return static_cast<uint64_t>(std::chrono::duration_cast<std::chrono::microseconds>(
                  std::chrono::steady_clock::now().time_since_epoch()).count());
          }
          inline uint32_t Tid() {
          #if KYTY_PLATFORM == KYTY_PLATFORM_WINDOWS
              return GetCurrentThreadId();
          #else
              return static_cast<uint32_t>(std::hash<std::thread::id>{}(std::this_thread::get_id()));
          #endif
          }
          struct Event {
              uint64_t time = 0, wait = 0, hold = 0;
              uint32_t tid = 0;
              const char* operation = "";
          };
          struct Queue {
              std::array<Event, 128> events {};
              std::atomic<uint64_t> read {0}, write {0}, dropped {0};
          };
          inline std::array<Queue, 128> queues {};
          inline std::atomic<unsigned> assigned {0};
          inline Queue* LocalQueue() {
              static thread_local const unsigned index = assigned.fetch_add(1, std::memory_order_relaxed);
              return index < queues.size() ? &queues[index] : nullptr;
          }
          inline void Publish(Queue* q, const Event& event) {
              if (!q) return;
              const auto w = q->write.load(std::memory_order_relaxed);
              if (w - q->read.load(std::memory_order_acquire) >= q->events.size()) {
                  q->dropped.fetch_add(1, std::memory_order_relaxed);
                  return;
              }
              q->events[w % q->events.size()] = event;
              q->write.store(w + 1, std::memory_order_release);
          }
          inline void Start() {
              if (!Enabled()) return;
              static const bool started = [] {
                  std::thread([] {
                      FILE* f = std::fopen("address-space-events.csv", "w");
                      if (!f) return;
                      std::fputs("steady_us,tid,operation,wait_us,hold_us,dropped\n", f);
                      std::fflush(f);
                      for (;;) {
                          std::this_thread::sleep_for(std::chrono::seconds(1));
                          for (auto& q : queues) {
                              auto r = q.read.load(std::memory_order_relaxed);
                              const auto w = q.write.load(std::memory_order_acquire);
                              while (r != w) {
                                  const auto e = q.events[r % q.events.size()];
                                  std::fprintf(f, "%llu,%u,%s,%llu,%llu,0\n",
                                      (unsigned long long)e.time, e.tid, e.operation,
                                      (unsigned long long)e.wait, (unsigned long long)e.hold);
                                  ++r;
                                  q.read.store(r, std::memory_order_release);
                              }
                              const auto dropped = q.dropped.exchange(0, std::memory_order_relaxed);
                              if (dropped) {
                                  std::fprintf(f, "%llu,0,dropped,0,0,%llu\n",
                                      (unsigned long long)Now(), (unsigned long long)dropped);
                              }
                          }
                          std::fflush(f);
                      }
                  }).detach();
                  return true;
              }();
              (void)started;
          }
          // Retains the original mutex. A separate thread writes the CSV.
          class Guard {
          public:
              Guard(std::mutex& mutex, const char* operation)
                  : enabled_(Enabled()), queue_(enabled_ ? LocalQueue() : nullptr),
                    operation_(operation), tid_(enabled_ ? Tid() : 0),
                    begin_(enabled_ ? Now() : 0), lock_(mutex),
                    acquired_(enabled_ ? Now() : 0) {}
              ~Guard() {
                  const auto released = enabled_ ? Now() : 0;
                  lock_.unlock();
                  if (enabled_) {
                      const auto wait = acquired_ - begin_;
                      const auto hold = released - acquired_;
                      if (wait >= 50000 || hold >= 50000) {
                          Publish(queue_, {released, wait, hold, tid_, operation_});
                      }
                  }
              }
              Guard(const Guard&) = delete;
              Guard& operator=(const Guard&) = delete;
          private:
              bool enabled_;
              Queue* queue_;
              const char* operation_;
              uint32_t tid_;
              uint64_t begin_;
              std::unique_lock<std::mutex> lock_;
              uint64_t acquired_;
          };
          }
          '''
          Path("src/graphics/host_gpu/addressSpaceDiagnostics.h").write_text(
              header,encoding="utf-8",newline="\n")
          p=Path("src/kernel/memory.cpp")
          s=p.read_text(encoding="utf-8")
          old='#include "common/assert.h"'
          if s.count(old)!=1:
              raise RuntimeError("Unexpected memory includes")
          s=s.replace(old,old+'\n#include "graphics/host_gpu/addressSpaceDiagnostics.h"')
          p.write_text(s,encoding="utf-8",newline="\n")

          p=Path("src/kernel/memoryAddressSpace.inc")
          s=p.read_text(encoding="utf-8")
          a=s.index("class GuestAddressSpace {")
          prefix,body=s[:a],s[a:]
          old="\t\tstd::lock_guard lock(m_mutex);"
          count=body.count(old)
          if count!=13:
              raise RuntimeError("Unexpected address-space lock count: "+str(count))
          body=body.replace(
              old,
              "\t\tLibs::Graphics::AddressSpaceDiagnostics::Guard lock(m_mutex, __func__);")
          old="\texplicit GuestAddressSpace(uint64_t backing_size) {"
          if body.count(old)!=1:
              raise RuntimeError("Unexpected address-space constructor")
          body=body.replace(
              old,
              old+"\n\t\tLibs::Graphics::AddressSpaceDiagnostics::Start();")
          p.write_text(prefix+body,encoding="utf-8",newline="\n")
          print("Instrumented "+str(count)+" address-space operations")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Address-space diagnostics adaptation failed"
          }

      - name: Verify patched source
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid source diff"
          }
          $config = Get-Content "src/common/emulatorConfig.h" -Raw
          if ($config -notmatch 'gpu_frames_ahead\s*=\s*0\s*;') {
            throw "Expected original gpu_frames_ahead = 0"
          }
          git diff --stat

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Install glslang
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            "User-Agent" = "GitHub-Actions-KytyPS5"
            "Accept" = "application/vnd.github+json"
          }
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot" `
            -Headers $headers
          $asset = $release.assets | Where-Object {
            $_.name -match "(?i)windows" -and
            $_.name -match "(?i)(x64|x86_64|amd64)" -and
            $_.name -match "(?i)\.zip$"
          } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object {
              $_.name -match "(?i)windows" -and
              $_.name -match "(?i)\.zip$"
            } | Select-Object -First 1
          }
          if (-not $asset) {
            throw "No Windows glslang ZIP found"
          }
          $zip = "$env:RUNNER_TEMP/glslang.zip"
          $extract = "$env:RUNNER_TEMP/glslang"
          Invoke-WebRequest -Uri $asset.browser_download_url `
            -Headers $headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $validator = Get-ChildItem $extract `
            -Filter "glslangValidator.exe" -Recurse |
            Select-Object -First 1
          if (-not $validator) {
            $validator = Get-ChildItem $extract `
              -Filter "glslang.exe" -Recurse |
              Select-Object -First 1
          }
          if (-not $validator) {
            throw "glslang executable missing"
          }
          if ($validator.Name -eq "glslang.exe") {
            Copy-Item $validator.FullName `
              (Join-Path $validator.Directory.FullName "glslangValidator.exe") `
              -Force
          }
          Add-Content $env:GITHUB_PATH $validator.Directory.FullName

      - name: Verify glslang
        run: |
          glslangValidator --version
          if ($LASTEXITCODE -ne 0) {
            throw "glslang verification failed"
          }

      - name: Configure CMake
        run: |
          cmake `
            -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed"
          }

      - name: Build KytyPS5
        run: |
          cmake `
            --build _Build/windows `
            --target launcher shader_vertex_metadata_tests memory_tracker_tests shader_cfg_tests virtual_memory_allocation_tests `
            --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Test memory and shader paths
        run: |
          ctest `
            --test-dir _Build/windows `
            -R '^(shader_vertex_metadata|memory_tracker|shader_cfg|virtual_memory_allocation)$' `
            --output-on-failure `
            --no-tests=error
          if ($LASTEXITCODE -ne 0) {
            throw "Memory or shader tests failed"
          }

      - name: Install KytyPS5
        run: |
          cmake --install _Build/windows `
            --prefix _Build/windows/install
          if ($LASTEXITCODE -ne 0) {
            throw "Install failed"
          }

      - name: Package launchers and symbols
        run: |
          $ErrorActionPreference = "Stop"
          $install = "_Build/windows/install"
          if (-not (Test-Path "$install/launcher.exe")) {
            throw "launcher.exe missing"
          }
          foreach ($mode in @(0, 1)) {
            $name = if ($mode -eq 1) {
              "Diagnostico-9.cmd"
            } else {
              "Comparacion.cmd"
            }
            @(
              '@echo off',
              'setlocal',
              'cd /d "%~dp0"',
              "set KYTY_ADDRESS_SPACE_DIAGNOSTICS=$mode",
              'set KYTY_TRACKING_DIAGNOSTICS=',
              'set KYTY_TRACKING_PAUSE=',
              'set KYTY_BDA_SLICE_FILTER=',
              'set KYTY_SPECULATE_DRAWS=1',
              'set KYTY_LIGHT_DRAIN_STATS=1',
              'set KYTY_DEBUG_QUEUES=',
              'set KYTY_DEBUG_SAMPLE_GPU=',
              'set KYTY_DEBUG_DUMP_THREADS=',
              'set KYTY_DEBUG_DRAW_PHASES=',
              'set KYTY_DEBUG_DRAW_STATS=',
              'set KYTY_DEBUG_SPEC_STATS=',
              'set KYTY_DEBUG_STREAM_STATS=',
              'set KYTY_DEBUG_UPLOADS=',
              'set KYTY_GPU_ZONES=',
              '"%~dp0launcher.exe" %*'
            ) | Set-Content "$install/$name" -Encoding ascii
          }
          $maps = Get-ChildItem "_Build/windows" `
            -Filter "kyty_emulator_*.map" -File
          if (-not $maps) {
            throw "Emulator map missing"
          }
          foreach ($map in $maps) {
            Copy-Item $map.FullName $install -Force
          }
          $pdb = "_Build/windows/kyty_emulator.pdb"
          if (-not (Test-Path $pdb)) {
            throw "Emulator PDB missing"
          }
          Copy-Item $pdb $install -Force

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "KytyPS5-Windows-AMD-Prueba-9-Memoria.zip"
          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath $zip `
            -Force `
            -ErrorAction Stop
          if (-not (Test-Path $zip)) {
            throw "Packaging failed: ZIP missing"
          }
          if ((Get-Item $zip).Length -eq 0) {
            throw "Packaging failed: ZIP empty"
          }

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-AMD-Prueba-9-Memoria
          path: KytyPS5-Windows-AMD-Prueba-9-Memoria.zip
          if-no-files-found: error
          retention-days: 7
