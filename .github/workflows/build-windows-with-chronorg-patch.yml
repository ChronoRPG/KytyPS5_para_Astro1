name: Build KytyPS5 Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KytyPS5 - Windows x64
    runs-on: windows-2022

    steps:

      # =========================================================
      # 1. Obtener EXACTAMENTE el commit solicitado
      # =========================================================
      - name: Checkout commit 4068f4a
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 0

      # =========================================================
      # 2. Aplicar patch personalizado ChronoRPG
      # =========================================================
      - name: Apply ChronoRPG 5900X patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patch = "patches/KytyPS5_ChronoRPG_5900X_step1.patch"

          if (-not (Test-Path $patch)) {
            Write-Error "ERROR: No se encontró el patch: $patch"
            exit 1
          }

          git apply --check $patch

          if ($LASTEXITCODE -ne 0) {
            Write-Error "ERROR: El patch NO se puede aplicar sobre el commit 4068f4a."
            exit 1
          }

          git apply $patch

          if ($LASTEXITCODE -ne 0) {
            Write-Error "ERROR: Falló la aplicación del patch."
            exit 1
          }

          Write-Host "PATCH APLICADO CORRECTAMENTE"
          git diff -- src/common/emulatorConfig.h

      # =========================================================
      # 3. Verificar modificación del patch
      # =========================================================
      - name: Verify ChronoRPG GPU modification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "src/common/emulatorConfig.h"

          if (-not (Test-Path $file)) {
            Write-Error "ERROR: No se encontró $file"
            exit 1
          }

          $content = Get-Content $file -Raw

          if (-not $content.Contains("gpu_frames_ahead            = 1;")) {
            Write-Error "ERROR: gpu_frames_ahead = 1 NO está aplicado."
            exit 1
          }

          Write-Host "GPU MODIFICATION VERIFIED"
          Write-Host "gpu_frames_ahead = 1"

      # =========================================================
      # 4. MSVC environment
      # =========================================================
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # =========================================================
      # 5. Clang
      # =========================================================
      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      # =========================================================
      # 6. Ninja
      # =========================================================
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # =========================================================
      # 7. Qt
      # =========================================================
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      # =========================================================
      # 8. Instalar glslangValidator
      # =========================================================
      - name: Install glslang
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $apiUrl = "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot"

          $headers = @{
            "User-Agent" = "GitHub-Actions-KytyPS5"
            "Accept"     = "application/vnd.github+json"
          }

          $release = Invoke-RestMethod `
            -Uri $apiUrl `
            -Headers $headers

          Write-Host "Release encontrada:"
          Write-Host $release.tag_name

          $asset = $release.assets |
            Where-Object {
              $_.name -match "(?i)windows" -and
              $_.name -match "(?i)(x64|x86_64|amd64)" -and
              $_.name -match "(?i)\.zip$"
            } |
            Select-Object -First 1

          if (-not $asset) {
            $asset = $release.assets |
              Where-Object {
                $_.name -match "(?i)windows" -and
                $_.name -match "(?i)\.zip$"
              } |
              Select-Object -First 1
          }

          if (-not $asset) {
            Write-Error "No se encontró ningún ZIP de Windows en el release main-tot."
            exit 1
          }

          Write-Host "Asset seleccionado:"
          Write-Host $asset.name

          $zip = "$env:RUNNER_TEMP\glslang.zip"
          $extract = "$env:RUNNER_TEMP\glslang"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -Headers @{
              "User-Agent" = "GitHub-Actions-KytyPS5"
            } `
            -OutFile $zip

          if (-not (Test-Path $zip)) {
            Write-Error "La descarga de glslang no produjo ningún archivo."
            exit 1
          }

          if (Test-Path $extract) {
            Remove-Item -Path $extract -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extract -Force | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $validator = Get-ChildItem `
            -Path $extract `
            -Filter "glslangValidator.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $validator) {
            $validator = Get-ChildItem `
              -Path $extract `
              -Filter "glslang.exe" `
              -Recurse |
              Select-Object -First 1
          }

          if (-not $validator) {
            Get-ChildItem `
              -Path $extract `
              -Recurse |
              Select-Object FullName

            Write-Error "No se encontró glslangValidator.exe ni glslang.exe."
            exit 1
          }

          $glslangBin = $validator.Directory.FullName

          if ($validator.Name -eq "glslang.exe") {
            $expected = Join-Path `
              $validator.Directory.FullName `
              "glslangValidator.exe"

            Copy-Item `
              -Path $validator.FullName `
              -Destination $expected `
              -Force
          }

          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $glslangBin

          $env:PATH = "$glslangBin;$env:PATH"

          Write-Host "glslang añadido al PATH correctamente."

      # =========================================================
      # 9. Verificar glslangValidator
      # =========================================================
      - name: Check glslangValidator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $command = Get-Command glslangValidator -ErrorAction Stop

          Write-Host "Ejecutable encontrado:"
          Write-Host $command.Source

          glslangValidator --version

      # =========================================================
      # 10. Verificar herramientas
      # =========================================================
      - name: Check build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --version

          Write-Host ""
          ninja --version

          Write-Host ""
          clang-cl --version

          Write-Host ""
          qmake --version

      # =========================================================
      # 11. Verificar commit base
      # =========================================================
      - name: Verify source commit
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD

          Write-Host "Current commit:"
          Write-Host $commit

          if ($commit -ne "4068f4ac886dcd25acc52b6e3fa3e3800dc576a9") {
            Write-Error "ERROR: No estamos en el commit solicitado."
            exit 1
          }

          Write-Host "Commit correcto."

      # =========================================================
      # 12. Mostrar submódulos
      # =========================================================
      - name: Verify submodules
        shell: pwsh
        run: |
          git submodule status

      # =========================================================
      # 13. Configurar CMake
      # =========================================================
      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      # =========================================================
      # 14. Compilar
      # =========================================================
      - name: Build KytyPS5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            --build _Build/windows `
            --target launcher `
            --parallel

      # =========================================================
      # 15. Instalar
      # =========================================================
      - name: Install KytyPS5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            --install _Build/windows `
            --prefix _Build/windows/install

      # =========================================================
      # 16. Buscar EXE
      # =========================================================
      - name: Find generated EXE files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $executables = Get-ChildItem `
            -Path "_Build/windows/install" `
            -Filter "*.exe" `
            -Recurse

          if (-not $executables) {
            Write-Error "No se encontró ningún archivo EXE."
            exit 1
          }

          $executables |
            Select-Object FullName, Length

      # =========================================================
      # 17. Crear ZIP
      # =========================================================
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath "KytyPS5-Windows-4068f4a.zip" `
            -Force

          Get-Item "KytyPS5-Windows-4068f4a.zip" |
            Select-Object FullName, Length

      # =========================================================
      # 18. Subir Artifact
      # =========================================================
      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-4068f4a
          path: KytyPS5-Windows-4068f4a.zip
          if-no-files-found: error
          retention-days: 7
