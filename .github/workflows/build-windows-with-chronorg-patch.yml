name: Windows AMD - Prueba 3 - Memoria

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - AMD base + BDA dirty bounds
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout patches from workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _patch_source
          sparse-checkout: patches
          fetch-depth: 1
          submodules: false

      - name: Verify AMD base
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "4068f4ac886dcd25acc52b6e3fa3e3800dc576a9"
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read source commit"
          }
          if ($actual -ne $expected) {
            throw "Unexpected source commit: $actual"
          }
          Write-Host "AMD base verified: $actual"

      - name: Apply lightweight diagnostics patch
        run: |
          $ErrorActionPreference = "Stop"
          $patch = "_patch_source/patches/KytyPS5_light_drain_stats.patch"

          if (-not (Test-Path $patch)) {
            throw "Missing patch: $patch"
          }

          git apply --ignore-whitespace --check $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Light diagnostics patch does not apply"
          }

          git apply --ignore-whitespace $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Light diagnostics patch application failed"
          }

      - name: Apply vertex metadata optimization
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError("Unexpected source: " + path)
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          header = "src/graphics/shader/shaderVertexMetadata.h"
          replace_once(header, "#include <array>", "#include <span>")
          replace_once(header,
              "std::array<ShaderSemantic, ShaderVertexInputInfo::RES_MAX> input_semantics {};",
              "std::span<const ShaderSemantic> input_semantics {};")
          replace_once(header,
              "// Copies the small AGC metadata subset used by the vertex path after validating every guest range.",
              "// Validates vertex metadata and borrows its semantics for immediate draw preparation.")

          source = "src/graphics/shader/shaderVertexMetadata.cpp"
          replace_once(source,
              "\tconst auto semantic_size =\n\t    static_cast<uint64_t>(data.num_input_semantics) * sizeof(ShaderSemantic);\n",
              "")
          replace_once(source,
              "std::memcpy(next.input_semantics.data(), data.input_semantics, semantic_size);",
              "next.input_semantics = {data.input_semantics, data.num_input_semantics};")

          print("Vertex metadata optimization applied")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Metadata adaptation failed"
          }

      - name: Apply BDA dirty bounds experiment
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          p = Path('src/graphics/host_gpu/renderer/cache/bufferCache.cpp')
          s = p.read_text(encoding='utf-8')

          old = '\t\t\t(void)SynchronizeBuffer(*buffer, owner_begin, owner_end - owner_begin, false, false);'
          new = '''\t\t\tstatic const bool narrow = [] {
          \t\t\t\tconst char* value = std::getenv("KYTY_BDA_DIRTY_BOUNDS");
          \t\t\t\treturn value != nullptr && std::strcmp(value, "1") == 0;
          \t\t\t}();
          \t\t\tconst auto bounds = narrow
          \t\t\t    ? BdaDirtyBounds(dirty, region_begin, cursor, owner_end, TRACKER_PAGE_SIZE)
          \t\t\t    : std::pair<uint64_t, uint64_t> {owner_begin, owner_end};
          \t\t\t(void)SynchronizeBuffer(*buffer, bounds.first, bounds.second - bounds.first, false, false);'''

          if s.count(old) != 1:
              raise RuntimeError('Unexpected SynchronizeDirtyOwners source')

          s = s.replace(old, new)
          include = '#include "common/alignment.h"'
          if s.count(include) != 1:
              raise RuntimeError('Unexpected includes')

          s = s.replace(include,
              include + '\n#include "graphics/host_gpu/renderer/cache/bdaDirtyBounds.h"')
          p.write_text(s, encoding='utf-8', newline='\n')

          header = '''#pragma once
          #include <algorithm>
          #include <cstddef>
          #include <cstdint>
          #include <utility>

          namespace Libs::Graphics {
          // Trim clean boundary pages while preserving one scan per owner.
          template <typename Bits>
          std::pair<uint64_t, uint64_t> BdaDirtyBounds(const Bits& dirty, uint64_t region,
                                                    uint64_t cursor, uint64_t owner_end,
                                                    uint64_t page_size) {
              const auto limit = static_cast<size_t>((owner_end - region + page_size - 1) / page_size);
              const auto last = dirty.LastRangeFrom(limit).second;
              const auto end = std::min(owner_end, region + last * page_size);
              return {cursor, end > cursor ? end : owner_end};
          }
          }
          '''
          Path('src/graphics/host_gpu/renderer/cache/bdaDirtyBounds.h').write_text(
              header, encoding='utf-8')

          test = '''#include "common/bitArray.h"
          #include "graphics/host_gpu/renderer/cache/bdaDirtyBounds.h"
          #include <algorithm>
          #include <cstdio>
          #include <cstdlib>

          int main() {
              unsigned long long state = 17;
              auto random = [&] {
                  state = state * 6364136223846793005ULL + 1;
                  return state;
              };
              constexpr uint64_t page = 16, region = 4096;

              for (int trial = 0; trial < 20000; ++trial) {
                  Common::BitArray<128> bits;
                  for (size_t i = 0; i < 128; ++i) {
                      if (random() % 7 == 0) bits.Set(i);
                  }

                  const uint64_t begin = region + random() % (128 * page);
                  const uint64_t end = begin + 1 + random() % (region + 128 * page - begin);
                  uint64_t cursor = end;

                  for (size_t i = 0; i < 128; ++i) {
                      const auto lo = region + i * page;
                      const auto hi = lo + page;
                      if (bits.Get(i) && lo < end && hi > begin) {
                          cursor = std::max(begin, lo);
                          break;
                      }
                  }

                  if (cursor == end) continue;
                  const auto bounds = Libs::Graphics::BdaDirtyBounds(
                      bits, region, cursor, end, page);

                  if (bounds.first < begin || bounds.second > end ||
                      bounds.first >= bounds.second) {
                      std::abort();
                  }

                  for (size_t i = 0; i < 128; ++i) {
                      const auto lo = std::max(begin, region + i * page);
                      const auto hi = std::min(end, region + (i + 1) * page);
                      if (bits.Get(i) && lo < hi &&
                          (bounds.first > lo || bounds.second < hi)) {
                          std::abort();
                      }
                  }
              }

              std::puts("BDA dirty bounds: 20000 randomized coverage cases passed");
          }
          '''
          Path('tests/BdaDirtyBoundsTests.cpp').write_text(test, encoding='utf-8')
          print('BDA bounds experiment applied; default off')
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "BDA adaptation failed"
          }

      - name: Verify patched source
        run: |
          $ErrorActionPreference = "Stop"

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid source diff"
          }

          $config = Get-Content "src/common/emulatorConfig.h" -Raw
          if ($config -notmatch 'gpu_frames_ahead\s*=\s*0\s*;') {
            throw "Expected original gpu_frames_ahead = 0"
          }

          $stats = Get-Content "src/graphics/host_gpu/renderer/drainStats.cpp" -Raw
          if (-not $stats.Contains("KYTY_LIGHT_DRAIN_STATS")) {
            throw "Light diagnostics verification failed"
          }

          git diff --stat

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Install glslang
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            "User-Agent" = "GitHub-Actions-KytyPS5"
            "Accept" = "application/vnd.github+json"
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot" `
            -Headers $headers

          $asset = $release.assets | Where-Object {
            $_.name -match "(?i)windows" -and
            $_.name -match "(?i)(x64|x86_64|amd64)" -and
            $_.name -match "(?i)\.zip$"
          } | Select-Object -First 1

          if (-not $asset) {
            $asset = $release.assets | Where-Object {
              $_.name -match "(?i)windows" -and
              $_.name -match "(?i)\.zip$"
            } | Select-Object -First 1
          }

          if (-not $asset) {
            throw "No Windows glslang ZIP found"
          }

          $zip = "$env:RUNNER_TEMP/glslang.zip"
          $extract = "$env:RUNNER_TEMP/glslang"
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $validator = Get-ChildItem $extract -Filter "glslangValidator.exe" -Recurse |
            Select-Object -First 1

          if (-not $validator) {
            $validator = Get-ChildItem $extract -Filter "glslang.exe" -Recurse |
              Select-Object -First 1
          }

          if (-not $validator) {
            throw "glslang executable missing"
          }

          if ($validator.Name -eq "glslang.exe") {
            Copy-Item $validator.FullName `
              (Join-Path $validator.Directory.FullName "glslangValidator.exe") -Force
          }

          Add-Content $env:GITHUB_PATH $validator.Directory.FullName

      - name: Verify glslang
        run: |
          glslangValidator --version
          if ($LASTEXITCODE -ne 0) {
            throw "glslang verification failed"
          }

      - name: Configure CMake
        run: |
          $ErrorActionPreference = "Stop"
          cmake `
            -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed"
          }

      - name: Build KytyPS5
        run: |
          cmake `
            --build _Build/windows `
            --target launcher shader_vertex_metadata_tests `
            --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Test vertex metadata
        run: |
          ctest --test-dir _Build/windows `
            -R '^shader_vertex_metadata$' `
            --output-on-failure `
            --no-tests=error

          if ($LASTEXITCODE -ne 0) {
            throw "Vertex metadata tests failed"
          }

      - name: Test BDA dirty bounds
        run: |
          clang-cl /nologo /std:c++20 /EHsc /Isrc `
            tests/BdaDirtyBoundsTests.cpp `
            /Fe:_Build/windows/bda_bounds_tests.exe

          if ($LASTEXITCODE -ne 0) {
            throw "Bounds test compilation failed"
          }

          & "_Build/windows/bda_bounds_tests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Bounds coverage tests failed"
          }

      - name: Install KytyPS5
        run: |
          cmake `
            --install _Build/windows `
            --prefix _Build/windows/install

          if ($LASTEXITCODE -ne 0) {
            throw "Install failed"
          }

      - name: Package comparison launchers
        run: |
          $ErrorActionPreference = "Stop"
          $install = "_Build/windows/install"
          if (-not (Test-Path "$install/launcher.exe")) {
            throw "launcher.exe missing"
          }

          foreach ($mode in @(0, 1)) {
            $name = if ($mode -eq 1) {
              "Prueba-3.cmd"
            } else {
              "Comparacion.cmd"
            }

            @(
              '@echo off',
              'setlocal',
              'cd /d "%~dp0"',
              "set KYTY_BDA_DIRTY_BOUNDS=$mode",
              'set KYTY_ORDERED_SUSPEND=0',
              'set KYTY_GPU_READBACK_WINDOW_KIB=',
              'set KYTY_LIGHT_DRAIN_STATS=1',
              'set KYTY_DEBUG_DRAW_PHASES=',
              'set KYTY_DEBUG_DRAW_STATS=',
              'set KYTY_DEBUG_SPEC_STATS=',
              'set KYTY_DEBUG_STREAM_STATS=',
              'set KYTY_DEBUG_UPLOADS=',
              'set KYTY_GPU_ZONES=',
              '"%~dp0launcher.exe" %*'
            ) | Set-Content "$install/$name" -Encoding ascii
          }

          @(
            "Base AMD: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9",
            "Metadata optimization retained; original suspend and readback.",
            "Prueba-3.cmd: trim clean BDA owner boundary pages.",
            "Comparacion.cmd: original BDA owner range.",
            "Copy _Patches from the working build; select THIS interpreter.",
            "Close emulator and launcher completely before switching mode.",
            "Keep identical settings in both modes; no guaranteed FPS gain."
          ) | Set-Content "$install/PRUEBA-3.txt" -Encoding ascii

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath "KytyPS5-Windows-AMD-Prueba-3-Memoria.zip" `
            -Force

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-AMD-Prueba-3-Memoria
          path: KytyPS5-Windows-AMD-Prueba-3-Memoria.zip
          if-no-files-found: error
          retention-days: 7
