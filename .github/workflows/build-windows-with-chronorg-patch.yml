name: Windows AMD 4068f4a - Readback experimental

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - AMD base + readback + light diagnostics
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout patches from workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _patch_source
          sparse-checkout: patches
          fetch-depth: 1
          submodules: false

      - name: Verify AMD base
        run: |
          $ErrorActionPreference = "Stop"

          $expected = "4068f4ac886dcd25acc52b6e3fa3e3800dc576a9"
          $actual = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "Could not read source commit"
          }

          if ($actual -ne $expected) {
            throw "Unexpected source commit: $actual"
          }

          Write-Host "AMD base verified: $actual"

      - name: Apply readback patch
        run: |
          $ErrorActionPreference = "Stop"

          $patch = "_patch_source/patches/KytyPS5_5900X_readback_experimental.patch"

          if (-not (Test-Path $patch)) {
            throw "Missing patch: $patch"
          }

          git apply --ignore-whitespace --check $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Readback patch does not apply to AMD base"
          }

          git apply --ignore-whitespace $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Readback patch application failed"
          }

          Write-Host "Readback patch applied"

      - name: Apply lightweight diagnostics patch
        run: |
          $ErrorActionPreference = "Stop"

          $patch = "_patch_source/patches/KytyPS5_light_drain_stats.patch"

          if (-not (Test-Path $patch)) {
            throw "Missing patch: $patch"
          }

          git apply --ignore-whitespace --check $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Light diagnostics patch does not apply to AMD base"
          }

          git apply --ignore-whitespace $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Light diagnostics patch application failed"
          }

          Write-Host "Light diagnostics patch applied"

      - name: Verify patched source
        run: |
          $ErrorActionPreference = "Stop"

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid source diff"
          }

          $config = Get-Content "src/common/emulatorConfig.h" -Raw

          if ($config -notmatch 'gpu_frames_ahead\s*=\s*0\s*;') {
            throw "Expected original gpu_frames_ahead = 0"
          }

          $bufferSource = Get-Content `
            "src/graphics/host_gpu/renderer/cache/bufferCache.cpp" -Raw

          if (-not $bufferSource.Contains("KYTY_GPU_READBACK_WINDOW_KIB")) {
            throw "Readback patch verification failed"
          }

          $statsSource = Get-Content `
            "src/graphics/host_gpu/renderer/drainStats.cpp" -Raw

          if (-not $statsSource.Contains("KYTY_LIGHT_DRAIN_STATS")) {
            throw "Light diagnostics patch verification failed"
          }

          git diff --stat

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Install glslang
        run: |
          $ErrorActionPreference = "Stop"

          $apiUrl = "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot"

          $headers = @{
            "User-Agent" = "GitHub-Actions-KytyPS5"
            "Accept" = "application/vnd.github+json"
          }

          $release = Invoke-RestMethod `
            -Uri $apiUrl `
            -Headers $headers

          $asset = $release.assets |
            Where-Object {
              $_.name -match "(?i)windows" -and
              $_.name -match "(?i)(x64|x86_64|amd64)" -and
              $_.name -match "(?i)\.zip$"
            } |
            Select-Object -First 1

          if (-not $asset) {
            $asset = $release.assets |
              Where-Object {
                $_.name -match "(?i)windows" -and
                $_.name -match "(?i)\.zip$"
              } |
              Select-Object -First 1
          }

          if (-not $asset) {
            throw "No Windows glslang ZIP found"
          }

          $zip = "$env:RUNNER_TEMP\glslang.zip"
          $extract = "$env:RUNNER_TEMP\glslang"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -Headers $headers `
            -OutFile $zip

          if (Test-Path $extract) {
            Remove-Item -Path $extract -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            -Force | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $validator = Get-ChildItem `
            -Path $extract `
            -Filter "glslangValidator.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $validator) {
            $validator = Get-ChildItem `
              -Path $extract `
              -Filter "glslang.exe" `
              -Recurse |
              Select-Object -First 1
          }

          if (-not $validator) {
            throw "glslang executable not found"
          }

          $glslangBin = $validator.Directory.FullName

          if ($validator.Name -eq "glslang.exe") {
            Copy-Item `
              -Path $validator.FullName `
              -Destination (Join-Path $glslangBin "glslangValidator.exe") `
              -Force
          }

          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $glslangBin

          Write-Host "glslang installed: $glslangBin"

      - name: Verify glslang
        run: |
          glslangValidator --version

          if ($LASTEXITCODE -ne 0) {
            throw "glslang verification failed"
          }

      - name: Configure CMake
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed"
          }

      - name: Build KytyPS5
        run: |
          cmake `
            --build _Build/windows `
            --target launcher `
            --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Install KytyPS5
        run: |
          cmake `
            --install _Build/windows `
            --prefix _Build/windows/install

          if ($LASTEXITCODE -ne 0) {
            throw "Install failed"
          }

      - name: Package test launchers
        run: |
          $ErrorActionPreference = "Stop"

          $install = "_Build/windows/install"

          if (-not (Test-Path "$install/launcher.exe")) {
            throw "launcher.exe missing from install directory"
          }

          $clearDiagnostics = @(
            'set KYTY_DEBUG_DRAW_PHASES=',
            'set KYTY_DEBUG_DRAW_STATS=',
            'set KYTY_DEBUG_SPEC_STATS=',
            'set KYTY_DEBUG_STREAM_STATS=',
            'set KYTY_DEBUG_UPLOADS=',
            'set KYTY_GPU_ZONES='
          )

          foreach ($kib in @(512, 64, 4)) {
            $lines = @(
              '@echo off',
              'setlocal',
              'cd /d "%~dp0"',
              "set KYTY_GPU_READBACK_WINDOW_KIB=$kib",
              'set KYTY_LIGHT_DRAIN_STATS=1'
            )

            $lines += $clearDiagnostics
            $lines += '"%~dp0launcher.exe" %*'

            Set-Content `
              -Path "$install/Readback-$kib.cmd" `
              -Value $lines `
              -Encoding ascii
          }

          $lightLauncher = @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            'set KYTY_GPU_READBACK_WINDOW_KIB=64',
            'set KYTY_LIGHT_DRAIN_STATS=1'
          )

          $lightLauncher += $clearDiagnostics
          $lightLauncher += '"%~dp0launcher.exe" %*'

          Set-Content `
            -Path "$install/Diagnostico-Ligero.cmd" `
            -Value $lightLauncher `
            -Encoding ascii

          @(
            "Source base: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9",
            "Patch revision: $env:GITHUB_SHA",
            "gpu_frames_ahead remains 0.",
            "",
            "Readback-512.cmd: original readback window",
            "Readback-64.cmd: experimental 64 KiB window",
            "Readback-4.cmd: experimental 4 KiB window",
            "Diagnostico-Ligero.cmd: 64 KiB + light diagnostics mode",
            "",
            "All CMD launchers enable light diagnostics mode.",
            "This mode only has an effect when drain-stats is enabled.",
            "",
            "For normal play: drain-stats = 0 in kyty_settings.ini",
            "For measurements: drain-stats = 5 in kyty_settings.ini",
            "The settings file belongs beside kyty_emulator.exe.",
            "",
            "Close all emulator processes before switching tests.",
            "No FPS improvement is guaranteed."
          ) | Set-Content `
            -Path "$install/READBACK-TEST.txt" `
            -Encoding ascii

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath "KytyPS5-Windows-AMD-4068f4a-Readback-Light.zip" `
            -Force

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-AMD-4068f4a-Readback-Light
          path: KytyPS5-Windows-AMD-4068f4a-Readback-Light.zip
          if-no-files-found: error
          retention-days: 7
