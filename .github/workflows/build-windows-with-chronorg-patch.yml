name: Windows AMD - Prueba 8 - Protecciones

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout existing patches
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _patch_source
          sparse-checkout: patches
          fetch-depth: 1
          submodules: false

      - name: Verify AMD base
        run: |
          $ErrorActionPreference = "Stop"
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read source commit"
          }
          if ($actual -ne "4068f4ac886dcd25acc52b6e3fa3e3800dc576a9") {
            throw "Unexpected AMD source: $actual"
          }

      - name: Apply lightweight diagnostics patch
        run: |
          $ErrorActionPreference = "Stop"
          $patch = "_patch_source/patches/KytyPS5_light_drain_stats.patch"
          if (-not (Test-Path $patch)) {
            throw "Missing patch: $patch"
          }
          git apply --ignore-whitespace --check $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Light diagnostics patch does not apply"
          }
          git apply --ignore-whitespace $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Light diagnostics patch failed"
          }

      - name: Adapt vertex metadata optimization
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text(encoding="utf-8")
              if s.count(old)!=1:
                  raise RuntimeError("Unexpected source: "+path)
              p.write_text(s.replace(old,new),encoding="utf-8",newline="\n")
          h="src/graphics/shader/shaderVertexMetadata.h"
          replace_once(h,"#include <array>","#include <span>")
          replace_once(h,
              "std::array<ShaderSemantic, ShaderVertexInputInfo::RES_MAX> input_semantics {};",
              "std::span<const ShaderSemantic> input_semantics {};")
          replace_once(h,
              "// Copies the small AGC metadata subset used by the vertex path after validating every guest range.",
              "// Validates vertex metadata and borrows its semantics for immediate draw preparation.")
          c="src/graphics/shader/shaderVertexMetadata.cpp"
          replace_once(c,
              "\tconst auto semantic_size =\n\t    static_cast<uint64_t>(data.num_input_semantics) * sizeof(ShaderSemantic);\n",
              "")
          replace_once(c,
              "std::memcpy(next.input_semantics.data(), data.input_semantics, semantic_size);",
              "next.input_semantics = {data.input_semantics, data.num_input_semantics};")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Metadata adaptation failed"
          }

      - name: Apply pinned upstream optimizations
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "https://github.com/KytyPS5/KytyPS5.git"
          $commits = @(
            "a67a033ff88406707f47492a7cdcfef736973d66",
            "f3dc5ee4a9e0725b17bd3e0a4ad1bdbeb0afc8a9"
          )
          foreach ($commit in $commits) {
            git fetch --no-tags --depth=2 $repo $commit
            if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch $commit"
            }
            $patch = Join-Path $env:RUNNER_TEMP "$commit.patch"
            git diff --output=$patch "$commit^" $commit -- src
            if ($LASTEXITCODE -ne 0) {
              throw "Could not generate patch: $commit"
            }
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) {
              throw "Patch does not apply: $commit"
            }
            git apply $patch
            if ($LASTEXITCODE -ne 0) {
              throw "Patch failed: $commit"
            }
          }

      - name: Add protection diagnostics
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          header = r'''#pragma once
          #include <chrono>
          #include <cstdint>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>

          namespace Libs::Graphics::TrackingDiagnostics {
          inline bool Enabled() {
              static const bool enabled = [] {
                  const char* v = std::getenv("KYTY_TRACKING_DIAGNOSTICS");
                  return v != nullptr && std::strcmp(v, "1") == 0;
              }();
              return enabled;
          }
          inline uint64_t Now() {
              return static_cast<uint64_t>(std::chrono::duration_cast<std::chrono::microseconds>(
                  std::chrono::steady_clock::now().time_since_epoch()).count());
          }

          enum class Metric { RegionProtection, PageWatcherLock, AddressSpaceLock, AddressSpaceWork, VirtualProtect, Count };
          struct Counter { uint64_t calls = 0, total = 0, maximum = 0; };
          inline thread_local Counter counters[static_cast<unsigned>(Metric::Count)] {};
          class Scope {
          public:
              explicit Scope(Metric metric) : metric_(metric), active_(Enabled()), start_(active_ ? Now() : 0) {}
              ~Scope() { Finish(); }
              void Finish() {
                  if (!active_) return;
                  active_ = false;
                  const auto elapsed = Now() - start_;
                  auto& c = counters[static_cast<unsigned>(metric_)];
                  ++c.calls; c.total += elapsed;
                  if (elapsed > c.maximum) c.maximum = elapsed;
              }
          private:
              Metric metric_;
              bool active_;
              uint64_t start_;
          };
          // Invoked after releasing the tracking lock.
          inline void ReportProtection(uint32_t tid) {
              struct Output { FILE* file = nullptr; uint64_t bucket = 0; bool opened = false; };
              static thread_local Output o;
              const auto now = Now();
              const auto bucket = now / 5000000;
              if (!o.opened) {
                  o.opened = true; o.bucket = bucket;
                  char path[96];
                  std::snprintf(path, sizeof(path), "protection-times-%u.csv", tid);
                  o.file = std::fopen(path, "w");
                  if (o.file) {
                      std::fputs("steady_us,tid,metric,calls,total_us,max_us\n", o.file);
                      std::fflush(o.file);
                  }
              }
              if (bucket == o.bucket) return;
              const char* names[] = {"region_protection", "page_watcher_lock", "address_space_lock",
                                     "address_space_work", "virtual_protect"};
              for (unsigned i = 0; i < static_cast<unsigned>(Metric::Count); ++i) {
                  const auto& c = counters[i];
                  if (o.file && c.calls != 0) {
                      std::fprintf(o.file, "%llu,%u,%s,%llu,%llu,%llu\n",
                          (unsigned long long)now, tid, names[i], (unsigned long long)c.calls,
                          (unsigned long long)c.total, (unsigned long long)c.maximum);
                  }
                  counters[i] = {};
              }
              if (o.file) std::fflush(o.file);
              o.bucket = bucket;
          }

          inline void Record(uint32_t tid, bool contended, uint64_t wait, uint64_t hold,
                             uint32_t owner, const void* lock) {
              ReportProtection(tid);
              struct Totals {
                  FILE* file = nullptr;
                  uint64_t bucket = 0, calls = 0, collisions = 0, wait_sum = 0, hold_sum = 0;
                  uint64_t max_wait = 0, max_hold = 0;
                  uint32_t max_owner = 0;
                  const void* max_lock = nullptr;
                  bool opened = false;
              };
              static thread_local Totals t;
              const auto now = Now();
              const auto bucket = now / 5000000;
              if (!t.opened) {
                  t.opened = true;
                  char path[96];
                  std::snprintf(path, sizeof(path), "tracking-waits-%u.csv", tid);
                  t.file = std::fopen(path, "w");
                  if (t.file) {
                      std::fputs("steady_us,tid,calls,contended,wait_us,hold_us,max_wait_us,max_hold_us,observed_owner_tid,lock_address\n", t.file);
                      std::fflush(t.file);
                  }
                  t.bucket = bucket;
              }
              if (bucket != t.bucket) {
                  if (t.file) {
                      std::fprintf(t.file, "%llu,%u,%llu,%llu,%llu,%llu,%llu,%llu,%u,%p\n",
                          (unsigned long long)now, tid, (unsigned long long)t.calls,
                          (unsigned long long)t.collisions, (unsigned long long)t.wait_sum,
                          (unsigned long long)t.hold_sum, (unsigned long long)t.max_wait,
                          (unsigned long long)t.max_hold, t.max_owner, t.max_lock);
                      std::fflush(t.file);
                  }
                  t.calls = t.collisions = t.wait_sum = t.hold_sum = t.max_wait = t.max_hold = 0;
                  t.max_owner = 0; t.max_lock = nullptr; t.bucket = bucket;
              }
              ++t.calls;
              t.collisions += contended ? 1 : 0;
              t.wait_sum += wait; t.hold_sum += hold;
              if (wait > t.max_wait) { t.max_wait = wait; t.max_owner = owner; t.max_lock = lock; }
              if (hold > t.max_hold) { t.max_hold = hold; }
          }
          }
          '''
          Path('src/graphics/host_gpu/trackingDiagnostics.h').write_text(header,encoding='utf-8',newline='\n')
          changes = [
              ('src/graphics/host_gpu/regionManager.h', '#include <algorithm>', '#include "graphics/host_gpu/trackingDiagnostics.h"\n\n#include <algorithm>'),
              ('src/graphics/host_gpu/regionManager.h', '\t\tconst auto thread = CurrentThread();', '\t\tconst auto thread = CurrentThread();\n\t\tconst bool diagnostic = TrackingDiagnostics::Enabled();\n\t\tuint64_t start = 0;\n\t\tuint32_t observed_owner = 0;\n\t\tbool contended = false;'),
              ('src/graphics/host_gpu/regionManager.h', '\t\twhile (m_lock.test_and_set(std::memory_order_acquire)) {', '\t\twhile (m_lock.test_and_set(std::memory_order_acquire)) {\n\t\t\tif (diagnostic && !contended) {\n\t\t\t\tcontended = true;\n\t\t\t\tstart = TrackingDiagnostics::Now();\n\t\t\t\tobserved_owner = m_owner.load(std::memory_order_relaxed);\n\t\t\t}'),
              ('src/graphics/host_gpu/regionManager.h', '\t\tm_owner.store(thread, std::memory_order_relaxed);', '\t\tm_owner.store(thread, std::memory_order_relaxed);\n\t\tif (diagnostic) {\n\t\t\tm_diag_start = TrackingDiagnostics::Now();\n\t\t\tm_diag_wait = contended ? m_diag_start - start : 0;\n\t\t\tm_diag_owner = observed_owner;\n\t\t\tm_diag_contended = contended;\n\t\t}'),
              ('src/graphics/host_gpu/regionManager.h', '\t\tm_owner.store(0, std::memory_order_relaxed);\n\t\tm_lock.clear(std::memory_order_release);', '\t\tconst bool diagnostic = TrackingDiagnostics::Enabled();\n\t\tconst auto wait = diagnostic ? m_diag_wait : 0;\n\t\tconst auto hold = diagnostic ? TrackingDiagnostics::Now() - m_diag_start : 0;\n\t\tconst auto owner = diagnostic ? m_diag_owner : 0;\n\t\tconst auto contended = diagnostic && m_diag_contended;\n\t\tm_owner.store(0, std::memory_order_relaxed);\n\t\tm_lock.clear(std::memory_order_release);\n\t\tif (diagnostic) {\n\t\t\tTrackingDiagnostics::Record(CurrentThread(), contended, wait, hold, owner, this);\n\t\t}'),
              ('src/graphics/host_gpu/regionManager.h', '\tstd::atomic_flag     m_lock = ATOMIC_FLAG_INIT;', '\tuint64_t m_diag_start = 0, m_diag_wait = 0;\n\tuint32_t m_diag_owner = 0;\n\tbool m_diag_contended = false;\n\tstd::atomic_flag     m_lock = ATOMIC_FLAG_INIT;'),
              ('src/graphics/host_gpu/renderer/threadSampler.cpp', '\t\tstd::fprintf(file, "# tid=%lu name=%s\\n", id, name.empty() ? "-" : name.c_str());', '\t\tFILETIME created {}, exited {}, kernel {}, user {};\n\t\tuint64_t kernel_us = 0, user_us = 0;\n\t\tHANDLE cpu_thread = OpenThread(THREAD_QUERY_LIMITED_INFORMATION, FALSE, id);\n\t\tif (cpu_thread) {\n\t\t\tif (GetThreadTimes(cpu_thread, &created, &exited, &kernel, &user)) {\n\t\t\t\tkernel_us = ((uint64_t{kernel.dwHighDateTime} << 32) | kernel.dwLowDateTime) / 10;\n\t\t\t\tuser_us = ((uint64_t{user.dwHighDateTime} << 32) | user.dwLowDateTime) / 10;\n\t\t\t}\n\t\t\tCloseHandle(cpu_thread);\n\t\t}\n\t\tconst auto steady_us = std::chrono::duration_cast<std::chrono::microseconds>(\n\t\t    std::chrono::steady_clock::now().time_since_epoch()).count();\n\t\tstd::fprintf(file, "# tid=%lu name=%s kernel_us=%llu user_us=%llu steady_us=%llu\\n",\n\t\t             id, name.empty() ? "-" : name.c_str(),\n\t\t             (unsigned long long)kernel_us, (unsigned long long)user_us,\n\t\t             (unsigned long long)steady_us);'),
              ('src/kernel/pthread.cpp', '\tthread->host_thread_id = os_thread_id;', '\tthread->host_thread_id = os_thread_id;\n#if KYTY_PLATFORM == KYTY_PLATFORM_WINDOWS\n\twchar_t diagnostic_name[96];\n\tstd::swprintf(diagnostic_name, 96, L"Guest-%u", static_cast<unsigned>(thread->unique_id));\n\tSetThreadDescription(GetCurrentThread(), diagnostic_name);\n#endif'),
              ('src/kernel/pthread.cpp', '#include <cstring>', '#include <cstring>\n#include <cwchar>'),
              ('src/graphics/host_gpu/regionManager.h', '\tvoid UpdateProtection() {', '\tvoid UpdateProtection() {\n\t\tTrackingDiagnostics::Scope diagnostic_scope(TrackingDiagnostics::Metric::RegionProtection);'),
              ('src/graphics/host_gpu/pageManager.cpp', '#include "common/alignment.h"', '#include "common/alignment.h"\n#include "graphics/host_gpu/trackingDiagnostics.h"'),
              ('src/graphics/host_gpu/pageManager.cpp', '\t\tSpinGuard lock(region.lock);\n\t\tauto      perms', '\t\tTrackingDiagnostics::Scope diagnostic_wait(TrackingDiagnostics::Metric::PageWatcherLock);\n\t\tSpinGuard lock(region.lock);\n\t\tdiagnostic_wait.Finish();\n\t\tauto      perms'),
              ('src/kernel/memory.cpp', '#include "common/assert.h"', '#include "common/assert.h"\n#include "graphics/host_gpu/trackingDiagnostics.h"'),
              ('src/kernel/memoryAddressSpace.inc', '\tbool ProtectTransient(uint64_t vaddr, uint64_t size, VirtualMemory::Mode mode) {\n\t\tif (size == 0 || UINT64_MAX - vaddr < size) {\n\t\t\treturn false;\n\t\t}\n\n\t\tstd::lock_guard lock(m_mutex);\n\t\treturn ProtectMappedUnlocked(vaddr, size, mode);\n\t}', '\tbool ProtectTransient(uint64_t vaddr, uint64_t size, VirtualMemory::Mode mode) {\n\t\tif (size == 0 || UINT64_MAX - vaddr < size) {\n\t\t\treturn false;\n\t\t}\n\t\tLibs::Graphics::TrackingDiagnostics::Scope diagnostic_wait(\n\t\t    Libs::Graphics::TrackingDiagnostics::Metric::AddressSpaceLock);\n\t\tstd::lock_guard lock(m_mutex);\n\t\tdiagnostic_wait.Finish();\n\t\tLibs::Graphics::TrackingDiagnostics::Scope diagnostic_work(\n\t\t    Libs::Graphics::TrackingDiagnostics::Metric::AddressSpaceWork);\n\t\treturn ProtectMappedUnlocked(vaddr, size, mode);\n\t}'),
              ('src/common/platform/sysWindowsVirtual.cpp', '#include "common/assert.h"', '#include "common/assert.h"\n#include "graphics/host_gpu/trackingDiagnostics.h"'),
              ('src/common/platform/sysWindowsVirtual.cpp', 'bool Protect(uint64_t address, uint64_t size, Mode mode) {', 'bool Protect(uint64_t address, uint64_t size, Mode mode) {\n\tLibs::Graphics::TrackingDiagnostics::Scope diagnostic_scope(\n\t    Libs::Graphics::TrackingDiagnostics::Metric::VirtualProtect);'),
          ]
          for path, old, new in changes:
              p=Path(path)
              s=p.read_text(encoding="utf-8")
              if s.count(old)!=1:
                  raise RuntimeError("Unexpected diagnostic source: "+path+" / "+old[:70])
              p.write_text(s.replace(old,new),encoding="utf-8",newline="\n")
          print("Protection and tracking diagnostics installed")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Protection diagnostics adaptation failed"
          }

      - name: Verify patched source
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid source diff"
          }
          $config = Get-Content "src/common/emulatorConfig.h" -Raw
          if ($config -notmatch 'gpu_frames_ahead\s*=\s*0\s*;') {
            throw "Expected original gpu_frames_ahead = 0"
          }
          git diff --stat

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Install glslang
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            "User-Agent" = "GitHub-Actions-KytyPS5"
            "Accept" = "application/vnd.github+json"
          }
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot" `
            -Headers $headers
          $asset = $release.assets | Where-Object {
            $_.name -match "(?i)windows" -and
            $_.name -match "(?i)(x64|x86_64|amd64)" -and
            $_.name -match "(?i)\.zip$"
          } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object {
              $_.name -match "(?i)windows" -and
              $_.name -match "(?i)\.zip$"
            } | Select-Object -First 1
          }
          if (-not $asset) {
            throw "No Windows glslang ZIP found"
          }
          $zip = "$env:RUNNER_TEMP/glslang.zip"
          $extract = "$env:RUNNER_TEMP/glslang"
          Invoke-WebRequest -Uri $asset.browser_download_url `
            -Headers $headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $validator = Get-ChildItem $extract `
            -Filter "glslangValidator.exe" -Recurse |
            Select-Object -First 1
          if (-not $validator) {
            $validator = Get-ChildItem $extract `
              -Filter "glslang.exe" -Recurse |
              Select-Object -First 1
          }
          if (-not $validator) {
            throw "glslang executable missing"
          }
          if ($validator.Name -eq "glslang.exe") {
            Copy-Item $validator.FullName `
              (Join-Path $validator.Directory.FullName "glslangValidator.exe") `
              -Force
          }
          Add-Content $env:GITHUB_PATH $validator.Directory.FullName

      - name: Verify glslang
        run: |
          glslangValidator --version
          if ($LASTEXITCODE -ne 0) {
            throw "glslang verification failed"
          }

      - name: Configure CMake
        run: |
          cmake `
            -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed"
          }

      - name: Build KytyPS5
        run: |
          cmake `
            --build _Build/windows `
            --target launcher shader_vertex_metadata_tests memory_tracker_tests shader_cfg_tests `
            --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Test memory and shader paths
        run: |
          ctest `
            --test-dir _Build/windows `
            -R '^(shader_vertex_metadata|memory_tracker|shader_cfg)$' `
            --output-on-failure `
            --no-tests=error
          if ($LASTEXITCODE -ne 0) {
            throw "Memory or shader tests failed"
          }

      - name: Install KytyPS5
        run: |
          cmake --install _Build/windows `
            --prefix _Build/windows/install
          if ($LASTEXITCODE -ne 0) {
            throw "Install failed"
          }

      - name: Package launchers and symbols
        run: |
          $ErrorActionPreference = "Stop"
          $install = "_Build/windows/install"
          if (-not (Test-Path "$install/launcher.exe")) {
            throw "launcher.exe missing"
          }
          foreach ($mode in @(0, 1)) {
            $name = if ($mode -eq 1) {
              "Diagnostico-8.cmd"
            } else {
              "Comparacion.cmd"
            }
            @(
              '@echo off',
              'setlocal',
              'cd /d "%~dp0"',
              "set KYTY_TRACKING_DIAGNOSTICS=$mode",
              'set KYTY_TRACKING_PAUSE=',
              'set KYTY_BDA_SLICE_FILTER=',
              'set KYTY_SPECULATE_DRAWS=1',
              'set KYTY_LIGHT_DRAIN_STATS=1',
              'set KYTY_DEBUG_QUEUES=',
              'set KYTY_DEBUG_SAMPLE_GPU=',
              'set KYTY_DEBUG_DUMP_THREADS=',
              'set KYTY_DEBUG_DRAW_PHASES=',
              'set KYTY_DEBUG_DRAW_STATS=',
              'set KYTY_DEBUG_SPEC_STATS=',
              'set KYTY_DEBUG_STREAM_STATS=',
              'set KYTY_DEBUG_UPLOADS=',
              'set KYTY_GPU_ZONES=',
              '"%~dp0launcher.exe" %*'
            ) | Set-Content "$install/$name" -Encoding ascii
          }
          $maps = Get-ChildItem "_Build/windows" `
            -Filter "kyty_emulator_*.map" -File
          if (-not $maps) {
            throw "Emulator map missing"
          }
          foreach ($map in $maps) {
            Copy-Item $map.FullName $install -Force
          }
          $pdb = "_Build/windows/kyty_emulator.pdb"
          if (-not (Test-Path $pdb)) {
            throw "Emulator PDB missing"
          }
          Copy-Item $pdb $install -Force

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "KytyPS5-Windows-AMD-Prueba-8-Protecciones.zip"
          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath $zip `
            -Force `
            -ErrorAction Stop
          if (-not (Test-Path $zip)) {
            throw "Packaging failed: ZIP missing"
          }
          if ((Get-Item $zip).Length -eq 0) {
            throw "Packaging failed: ZIP empty"
          }

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-AMD-Prueba-8-Protecciones
          path: KytyPS5-Windows-AMD-Prueba-8-Protecciones.zip
          if-no-files-found: error
          retention-days: 7
