name: Windows AMD - Diagnostico 55 - Tiempo de buffers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - Buffers 55
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      KYTY_FLAGS_51: /clang:-ffp-contract=off
      KYTY_PROFILE_51: Generica

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout pinned working diagnostic 20
        uses: actions/checkout@v4
        with:
          ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
          path: _patch_source
          sparse-checkout: |
            patches
            .github/workflows
          fetch-depth: 1
          submodules: false

      - name: Read working diagnostic 51 from this commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _workflow51
          sparse-checkout: .github/workflows/build-windows-amd-occlusion-observation.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          submodules: false

      - name: Setup fixed Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin Python executable and install YAML parser
        run: |
          $ErrorActionPreference = "Stop"
          $pythonExe = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          if (-not $pythonExe) { throw "Python executable missing" }
          "KYTY_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $pythonExe -m pip install PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
          & $pythonExe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Python YAML verification failed" }

      - name: Create runner for existing plain-text workflow
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import subprocess
          import sys
          import yaml
          source=Path("_workflow51/.github/workflows/build-windows-amd-occlusion-observation.yml")
          if not source.is_file():
              raise RuntimeError("Keep the working build-windows-amd-occlusion-observation.yml in this repository")
          workflow=yaml.safe_load(source.read_text(encoding="utf-8"))
          steps=workflow["jobs"]["build"]["steps"]
          name=sys.argv[1]
          selected=[s for s in steps if s.get("name")==name]
          if len(selected)!=1 or "run" not in selected[0]:
              raise RuntimeError("Missing or ambiguous diagnostic 51 step: "+name)
          script=selected[0]["run"]
          if name=="Install optional occlusion observation" and ("zlib" in script or "base64" in script):
              raise RuntimeError("Diagnostic 51 must be the working plain-text version")
          if name=="Package launchers and symbols":
              script=script.replace("Diagnostico-51.cmd","Diagnostico-55.cmd").replace("Comparacion-51.cmd","Comparacion-55.cmd").replace("DIAGNOSTICO-51.txt","DIAGNOSTICO-55.txt")
          path=Path("_run_saved51.ps1")
          path.write_text('$ErrorActionPreference = "Stop"\n'+script,encoding="utf-8")
          print("Reusing validated 51 step:",name,flush=True)
          subprocess.run(["pwsh","-NoProfile","-File",str(path.resolve())],check=True)
          '@ | Set-Content "_run_saved51.py" -Encoding utf8
          & $env:KYTY_PYTHON -m py_compile _run_saved51.py
          if ($LASTEXITCODE -ne 0) { throw "Saved workflow runner invalid" }

      - name: Reproduce working AMD source and retained optimizations
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON _run_saved51.py "Reproduce working AMD source and retained optimizations"
          if ($LASTEXITCODE -ne 0) { throw "Saved diagnostic 51 source step failed" }

      - name: Install optional occlusion observation
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON _run_saved51.py "Install optional occlusion observation"
          if ($LASTEXITCODE -ne 0) { throw "Saved diagnostic 51 installation failed" }

      - name: Install sampled buffer timing
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import subprocess
          import sys
          files={}
          files['patches/adapt_buffer_timing55.py']=r"""from pathlib import Path
          p=Path('src/graphics/host_gpu/renderer/pipeline/descriptors.cpp')
          s=p.read_text()
          def replace(old,new):
           global s
           if s.count(old)!=1:raise RuntimeError('Unexpected buffer55 boundary: '+old[:100])
           s=s.replace(old,new)
          replace('#include <xxhash.h>','#include <xxhash.h>\n#include "BufferTiming55.h"')
          replace('uint32_t slot, uint32_t& buffer_offset) {','uint32_t slot, uint32_t& buffer_offset) {\n    BufferTiming55::Scope timer55(2, static_cast<unsigned>(stage));')
          replace('\tauto [buffer, offset] = context.GetBufferCache().ObtainBuffer','    BufferTiming55::Scope obtain55(3, static_cast<unsigned>(stage));\n\tauto [buffer, offset] = context.GetBufferCache().ObtainBuffer')
          replace('\tobtain_probe.reset();','    obtain55.Stop();\n\tobtain_probe.reset();')
          for name,part in [('FindBuffers',0),('RebindBuffers',1)]:
           start=s.index('void RenderExecutor::'+name+'(PreparedBindings& prepared) {')
           end=s.index('\n}',start)+2
           body=s[start:end]
           line=next(x for x in body.splitlines() if 'const auto& program ' in x)
           new=body.replace(line,line+'\n    BufferTiming55::Scope timer55('+str(part)+', static_cast<unsigned>(program.stage), program.info.buffers.size());')
           replace(body,new)
          header=Path(__file__).resolve().parent.parent/'experiments/buffer55/BufferTiming55.h'
          if not header.is_file():raise RuntimeError('Missing BufferTiming55.h')
          p.write_text(s,newline='\n')
          (p.parent/'BufferTiming55.h').write_text(header.read_text(),newline='\n')
          print('buffer55: sampled CPU durations; original buffer operations preserved')
          """
          files['experiments/buffer55/BufferTiming55.h']=r"""#pragma once
          #include <array>
          #include <chrono>
          #include <cinttypes>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          namespace BufferTiming55 {
          using Clock=std::chrono::steady_clock;
          inline bool Enabled(){static const bool on=[]{const char* v=std::getenv("KYTY_BUFFER_TIMING55");const bool enabled=v&&std::strcmp(v,"1")==0;if(enabled)std::puts("buffer55: sampled CPU timings ON; rotating 1/64 calls");return enabled;}();return on;}
          struct Metric {uint64_t calls=0,samples=0,ns=0,max_ns=0,slots=0;};
          struct State {std::array<Metric,36> metrics{};std::array<uint64_t,36> sequence{};Clock::time_point last=Clock::now();};
          inline thread_local State state;
          inline void Report(Clock::time_point now){
           const double elapsed=std::chrono::duration<double>(now-state.last).count();
           if(elapsed<5.0)return;
           std::printf("buffer55-interval: seconds=%.6f thread-local nested-times-do-not-add\n",elapsed);
           const char* names[]={"find","rebind","native","obtain"};
           for(unsigned i=0;i<36;++i){const auto& m=state.metrics[i];if(!m.calls)continue;
            const double mean=m.samples?double(m.ns)/double(m.samples):0.0;
            std::printf("buffer55-time: stage=%u part=%s calls=%" PRIu64 " samples=%" PRIu64
             " slots=%" PRIu64 " sampled-ms=%.6f mean-us=%.6f max-us=%.6f estimated-ms=%.6f\n",
             i/4,names[i%4],m.calls,m.samples,m.slots,double(m.ns)/1e6,mean/1e3,double(m.max_ns)/1e3,mean*double(m.calls)/1e6);
           }
           std::fflush(stdout);state.metrics={};state.last=Clock::now();
          }
          class Scope {
           unsigned index=0;bool active=false,root=false;Clock::time_point start{};
          public:
           Scope(unsigned part,unsigned stage,uint64_t slots=1):root(part<2){
            if(!Enabled()||part>=4||stage>=9)return;
            index=stage*4+part;auto& m=state.metrics[index];++m.calls;m.slots+=slots;
            const auto n=state.sequence[index]++;
            active=(n&63)==((n>>6)&63);
            if(active)start=Clock::now();
           }
           Scope(const Scope&)=delete;Scope& operator=(const Scope&)=delete;
           void Stop(){if(!active)return;const auto now=Clock::now();
            const auto ns=uint64_t(std::chrono::duration_cast<std::chrono::nanoseconds>(now-start).count());
            auto& m=state.metrics[index];++m.samples;m.ns+=ns;if(ns>m.max_ns)m.max_ns=ns;
            active=false;if(root)Report(now);
           }
           ~Scope(){Stop();}
          };
          }
          """
          root=Path("_buffer55")
          for name,text in files.items():
              p=root/name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(text,encoding="utf-8",newline="\n")
          subprocess.run([sys.executable,str(root/"patches/adapt_buffer_timing55.py")],check=True)
          '@ | & $env:KYTY_PYTHON -
          if ($LASTEXITCODE -ne 0) { throw "Buffer 55 adaptation failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Invalid source diff" }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Test isolated query components on Windows
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON _run_saved51.py "Test isolated query components on Windows"
          if ($LASTEXITCODE -ne 0) { throw "Isolated component tests failed" }

      - name: Build and test using pinned working workflow
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON _run_saved51.py "Build and test using pinned working workflow"
          if ($LASTEXITCODE -ne 0) { throw "Build or tests failed" }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package launchers and symbols
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON _run_saved51.py "Package launchers and symbols"
          if ($LASTEXITCODE -ne 0) { throw "Launcher packaging failed" }

      - name: Configure diagnostic 55 launchers
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          root=Path("_Build/windows/install")
          for name,on in [("Diagnostico-55.cmd",True),("Comparacion-55.cmd",False)]:
              p=root/name
              s=p.read_text()
              if "KYTY_OCCLUSION_PROBE" not in s:
                  raise RuntimeError("Unexpected launcher: "+name)
              s=s.replace("set KYTY_OCCLUSION_PROBE=1","set KYTY_OCCLUSION_PROBE=0")
              s=s.replace("set KYTY_OCCLUSION_PROBE=0", "set KYTY_OCCLUSION_PROBE=0\nset KYTY_BUFFER_TIMING55="+str(int(on)))
              p.write_text(s,newline="\r\n")
          (root/"DIAGNOSTICO-55.txt").write_text(
              "Buffer CPU timing ON only in Diagnostico-55.cmd. No occlusion observation.\n"
              "Warm up one minute; heavy 60 seconds, light 60 seconds.\n"
              "Send complete console. Nested times must not be added.\n"
              "Estimates use rotating 1/64 samples.\n",
              encoding="utf-8")
          '@ | & $env:KYTY_PYTHON -
          if ($LASTEXITCODE -ne 0) { throw "Launcher 55 setup failed" }

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "KytyPS5-Diagnostico-55.zip"
          Compress-Archive -Path "_Build/windows/install/*" -DestinationPath $zip -Force -ErrorAction Stop
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
              throw "Packaging failed: missing or empty ZIP"
          }

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Diagnostico-55
          path: KytyPS5-Diagnostico-55.zip
          if-no-files-found: error
          retention-days: 7
