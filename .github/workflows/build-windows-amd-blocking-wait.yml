name: Windows AMD - Prueba 41 - Recorrido compacto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - Prueba 41
    runs-on: windows-2022

    env:
      KYTY_FLAGS_41: /clang:-ffp-contract=off
      KYTY_PROFILE_41: Generica

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout pinned working diagnostic 20
        uses: actions/checkout@v4
        with:
          ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
          path: _patch_source
          sparse-checkout: |
            patches
            .github/workflows
          fetch-depth: 1
          submodules: false

      - name: Setup fixed Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin Python executable and install YAML parser
        run: |
          $ErrorActionPreference = "Stop"
          $pythonExe = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          if (-not $pythonExe) { throw "Python executable missing" }
          "KYTY_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $pythonExe -m pip install PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
          & $pythonExe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Python YAML verification failed" }

      - name: Reproduce working AMD source and retained optimizations
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON -m pip install PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
          @'
          from pathlib import Path
          import subprocess
          import yaml
          baseline = Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml")
          steps = yaml.safe_load(baseline.read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
          started = False
          finished = False
          for index, step in enumerate(steps):
              if step.get("name") == "Setup MSVC environment":
                  finished = True
                  break
              if step.get("name") == "Verify AMD base":
                  started = True
              if not started:
                  continue
              if "uses" in step or "run" not in step:
                  raise RuntimeError("Unexpected baseline preparation step")
              script = Path(f"_prepare41_{index}.ps1")
              script.write_text('$ErrorActionPreference = "Stop"\n' + step["run"], encoding="utf-8")
              print("Preparing:", step["name"], flush=True)
              subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
          if not started or not finished:
              raise RuntimeError("Baseline preparation boundaries missing")
          '@ | & $env:KYTY_PYTHON -
          if ($LASTEXITCODE -ne 0) { throw "Baseline preparation failed" }

      - name: Add optional compact flat traversal and regression tests
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          def replace(path,old,new):
              p=Path(path);s=p.read_text(encoding='utf-8')
              if s.count(old)!=1:
                  raise RuntimeError('Unexpected compact-flat boundary: '+path)
              p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')

          header='src/graphics/shader/recompiler/ir/passes/CompactFlat41.h'
          Path(header).write_text(r'''#pragma once
          #include <cstdlib>
          #include <cstring>
          namespace Libs::Graphics::ShaderRecompiler::IR {
          inline bool CompactFlat41Enabled() {
              static const bool enabled=[] {
                  const auto* v=std::getenv("KYTY_COMPACT_FLAT_41");
                  return v!=nullptr && std::strcmp(v,"1")==0;
              }();
              return enabled;
          }
          }
          ''',encoding='utf-8')

          p='src/graphics/shader/recompiler/ir/ShaderIR.h'
          replace(p,'\tstd::vector<uint8_t>                 in_run; // Per srt_reads entry; empty without runs.',
          '''\tstd::vector<uint8_t>                 in_run; // Per srt_reads entry; empty without runs.
              // Original-order slots left after batched runs; immutable once compiled.
              std::vector<uint32_t>                scalar_slots41;''')

          p='src/graphics/shader/recompiler/ir/passes/SrtWalker.cpp'
          f=Path(p)
          f.write_text('#include "graphics/shader/recompiler/ir/passes/CompactFlat41.h"\n#include <atomic>\n#include <cstdio>\n'+f.read_text(encoding='utf-8'),encoding='utf-8')
          replace(p,'\tBuildFlatRuns(program, *compiled);',r'''
              BuildFlatRuns(program, *compiled);
              if (CompactFlat41Enabled() && !compiled->flat_runs.empty()) {
                  for (uint32_t slot=0;slot<program.srt_reads.size();++slot) {
                      if (compiled->in_run[slot]==0u) compiled->scalar_slots41.push_back(slot);
                  }
                  static std::atomic<uint32_t> reports41 {0};
                  if (reports41.fetch_add(1,std::memory_order_relaxed)<12u ||
                      program.shader_hash==0x3b809f9d156a95ddull || program.shader_hash==0xf112e0ba527945adull) {
                      std::printf("flat41-plan: shader=%016llx slots=%llu batched=%llu residual=%llu\n",
                          static_cast<unsigned long long>(program.shader_hash),
                          static_cast<unsigned long long>(program.srt_reads.size()),
                          static_cast<unsigned long long>(program.srt_reads.size()-compiled->scalar_slots41.size()),
                          static_cast<unsigned long long>(compiled->scalar_slots41.size()));
                      std::fflush(stdout);
                  }
              }''')

          old=r'''\tfor (uint32_t slot = 0; slot < m_program.srt_reads.size(); slot++) {
          \t\tif (runs && m_compiled.in_run[slot] != 0u) {
          \t\t\tcontinue;
          \t\t}
          \t\tconst auto offset = m_program.srt_reads[slot].flat_offset;
          \t\tconst bool clean  = m_clean_flat_slots && offset < m_compiled.clean_slots.size() &&
          \t\t                   m_compiled.clean_slots[offset] != 0u;
          \t\tif (clean &&
          \t\t    (m_clean_evaluator == nullptr || m_runtime.read_specialization_memory == nullptr)) {
          \t\t\treturn false;
          \t\t}
          \t\tauto& evaluator = clean ? *m_clean_evaluator : *this;
          \t\tif (offset >= flat.size() || !evaluator.Evaluate(m_compiled.slots[slot], flat[offset])) {
          \t\t\treturn false;
          \t\t}
          \t}'''
          old=old.replace('\\t','\t')
          new=r'''
              const auto refresh_slot41=[&](uint32_t slot) {
                  const auto offset=m_program.srt_reads[slot].flat_offset;
                  const bool clean=m_clean_flat_slots && offset<m_compiled.clean_slots.size() &&
                                   m_compiled.clean_slots[offset]!=0u;
                  if (clean && (m_clean_evaluator==nullptr || m_runtime.read_specialization_memory==nullptr)) return false;
                  auto& evaluator=clean ? *m_clean_evaluator : *this;
                  return offset<flat.size() && evaluator.Evaluate(m_compiled.slots[slot],flat[offset]);
              };
              if (runs && CompactFlat41Enabled()) {
                  for (const auto slot:m_compiled.scalar_slots41) {
                      if (!refresh_slot41(slot)) return false;
                  }
              } else {
                  for (uint32_t slot=0;slot<m_program.srt_reads.size();++slot) {
                      if (runs && m_compiled.in_run[slot]!=0u) continue;
                      if (!refresh_slot41(slot)) return false;
                  }
              }'''
          replace(p,old,new)

          p='src/graphics/guest_gpu/graphicsRun.cpp'
          f=Path(p)
          f.write_text('#include "graphics/shader/recompiler/ir/passes/CompactFlat41.h"\n'+f.read_text(encoding='utf-8'),encoding='utf-8')
          replace(p,'\tg_gpu_thread = true;',r'''
              g_gpu_thread = true;
              std::printf("flat41: compact residual-slot traversal %s\n",
                  ShaderRecompiler::IR::CompactFlat41Enabled() ? "ON" : "OFF");
              std::fflush(stdout);''')

          p='tests/ResourceMaterializationTests.cpp'
          f=Path(p)
          f.write_text('#include "graphics/shader/recompiler/ir/passes/CompactFlat41.h"\n'+f.read_text(encoding='utf-8'),encoding='utf-8')
          tests=r'''
          void TestCompactFlat41() {
              using namespace Libs::Graphics::ShaderRecompiler::IR;
              SetResourceMaterializationVerification(true);
              // A clean scalar slot remains outside the ordinary four-dword run.
              auto plan=MemoPlan(MemoPlanExtra::None,false);
              // Encode adjacent dwords as instruction offsets with one shared dynamic offset.
              for (uint32_t slot=0;slot<plan.srt_reads.size();++slot) {
                  auto* raw=plan.srt_reads[slot].value.TryInstruction();
                  auto flags=raw->Flags<MemoryFlags>();
                  auto memory=plan.memory_info[flags.index];
                  memory.offset=slot*4u;
                  flags.index=static_cast<uint32_t>(plan.memory_info.size());
                  plan.memory_info.push_back(memory);
                  raw->SetFlags(flags);
                  raw->SetArg(1,Value(0u));
              }
              plan.clean_flat_slots.assign(plan.srt_reads.size(),0u);
              plan.clean_flat_slots[4]=1u;
              MemoFixture f;
              const auto& compiled=CompileResourcePlan(plan);
              Check(!compiled.flat_runs.empty(),"compact-flat fixture has no batched run");
              if (CompactFlat41Enabled()) {
                  Check(compiled.scalar_slots41==std::vector<uint32_t>{4u},
                        "compact traversal lost or reordered a residual clean slot");
              }
              for (uint32_t i=0;i<128u;++i) {
                  f.memory.words[0]^=0x100u;
                  f.memory.words[4]=i;
                  Check(f.Refresh(plan) && f.snapshot.flattened_srt[4]==i,
                        "compact traversal lost fresh input data");
              }
              f.memory.reject_strict=true;
              Check(!f.Refresh(plan),"compact traversal ignored a rejected clean slot");
              f.memory.reject_strict=false;
              // A rejected broad read must fall back to the original dword reads.
              const auto exact=+[](void* data,uint64_t address,std::span<uint32_t> values) {
                  return values.size()==1u && TableMemory::Read(data,address,values);
              };
              const SrtRuntime rt {.user_data=f.user_data,.read_memory=exact,.userdata=&f.memory,
                  .read_specialization_memory=TableMemory::StrictRead};
              Check(MaterializeResources(plan,rt,f.snapshot,f.specialization),
                    "compact traversal broke grouped-read fallback");
              SetFlatRunReads(false);
              auto scalar=MemoPlan(MemoPlanExtra::None,false);
              Check(CompileResourcePlan(scalar).flat_runs.empty() && f.Refresh(scalar),
                    "compact traversal broke a plan without runs");
              SetFlatRunReads(true);
              std::puts("CompactFlat41: residual slots, fresh inputs, clean rejection and fallback passed");
          }
          '''
          replace(p,'int main() {',tests+'\nint main() {\n  TestCompactFlat41();')
          print('Compact flat traversal 41 installed',flush=True)
          '@ | & $env:KYTY_PYTHON -
          if ($LASTEXITCODE -ne 0) { throw "Compact flat adaptation failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Invalid source diff" }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Build and test using pinned working workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Pinned Python YAML verification failed" }
          @'
          from pathlib import Path
          import subprocess
          import os
          import yaml
          steps = yaml.safe_load(Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml").read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
          started = False
          finished = False
          for index, step in enumerate(steps):
              if step.get("name") == "Package launchers and symbols":
                  finished = True
                  break
              if step.get("name") == "Install glslang":
                  started = True
              if not started:
                  continue
              if "uses" in step or "run" not in step:
                  raise RuntimeError("Unexpected build step")
              if step["name"] == "Configure CMake":
                  flags = os.environ["KYTY_FLAGS_41"]
                  args = ["cmake", "-S", ".", "-B", "_Build/windows", "-G", "Ninja",
                          "-DCMAKE_BUILD_TYPE=Release", "-DCMAKE_C_COMPILER=clang-cl",
                          "-DCMAKE_CXX_COMPILER=clang-cl",
                          "-DCMAKE_PREFIX_PATH=" + os.environ["QT_ROOT_DIR"],
                          "-DCMAKE_C_FLAGS_INIT=" + flags, "-DCMAKE_CXX_FLAGS_INIT=" + flags,
                          "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"]
                  print("Configuring profile:", os.environ["KYTY_PROFILE_41"], flags, flush=True)
                  subprocess.run(args, check=True)
                  cache = Path("_Build/windows/CMakeCache.txt").read_text(encoding="utf-8")
                  cpp_flags = next((line.split("=", 1)[1] for line in cache.splitlines()
                                    if line.startswith("CMAKE_CXX_FLAGS:STRING=")), None)
                  if cpp_flags is None or "/ehsc" not in cpp_flags.lower():
                      raise RuntimeError("CMake lost /EHsc: C++ exceptions must remain enabled")
                  if not all(option in cpp_flags for option in flags.split()):
                      raise RuntimeError("Selected CPU flags are missing from CMAKE_CXX_FLAGS")
                  print("Verified C++ flags:", cpp_flags, flush=True)
                  continue
              script = Path(f"_build41_{index}.ps1")
              source = step["run"]
              if step["name"] == "Install glslang":
                  api_call = '$release = Invoke-RestMethod -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot" -Headers $headers'
                  if source.count(api_call) != 1:
                      raise RuntimeError("Unexpected glslang API call")
                  authenticated = '\n'.join([
                      'if (-not $env:GH_TOKEN) { throw "GitHub Actions token missing" }',
                      '$apiHeaders = $headers.Clone()',
                      '$apiHeaders["Authorization"] = "Bearer $env:GH_TOKEN"',
                      '$apiHeaders["X-GitHub-Api-Version"] = "2022-11-28"',
                      api_call.replace('-Headers $headers', '-Headers $apiHeaders'),
                  ])
                  source = source.replace(api_call, authenticated)
              script.write_text('$ErrorActionPreference = "Stop"\n' + source, encoding="utf-8")
              print("Running:", step["name"], flush=True)
              path_file = Path(os.environ["GITHUB_PATH"])
              entries = path_file.read_text(encoding="utf-8-sig").splitlines() if path_file.exists() else []
              os.environ["PATH"] = os.pathsep.join(entries + [os.environ["PATH"]])
              if step["name"] == "Test memory and shader paths":
                  for mode in ("0", "1"):
                      os.environ["KYTY_COMPACT_FLAT_41"] = mode
                      subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
              else:
                  subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
          if not started or not finished:
              raise RuntimeError("Build boundaries missing")
          '@ | & $env:KYTY_PYTHON -
          if ($LASTEXITCODE -ne 0) { throw "Build or tests failed" }

      - name: Package launchers and symbols
        run: |
          $ErrorActionPreference = "Stop"
          $install = "_Build/windows/install"
          if (-not (Test-Path "$install/launcher.exe")) { throw "launcher.exe missing" }
          foreach ($mode in @(0, 1)) {
              $name = if ($mode -eq 1) { "Prueba-41.cmd" } else { "Comparacion-41.cmd" }
              @(
                  '@echo off',
                  'setlocal',
                  'cd /d "%~dp0"',
                  "set KYTY_COMPACT_FLAT_41=$mode",
                  'set KYTY_REDUNDANT_SOURCES_38=0',
                  'set KYTY_RESOURCE_COSTS_37=0',
                  'set KYTY_FROZEN_DIAGNOSTIC_36=0',
                  'set KYTY_DESCRIPTOR_MEMO_35=0',
                  'set KYTY_DESCRIPTOR_STATS_35=0',
                  'set KYTY_DESCRIPTOR_RECIPES_34=0',
                  'set KYTY_TRACKING_PAUSE=',
                  'set KYTY_BDA_SLICE_FILTER=',
                  'set KYTY_TRACKING_DIAGNOSTICS=',
                  'set KYTY_ADDRESS_SPACE_DIAGNOSTICS=',
                  'set KYTY_TRACKING_BLOCKING_WAIT=1',
                  'set KYTY_SHARED_SAMPLER_SNAPSHOTS=1',
                  'set KYTY_DIRECT_COLOR_METADATA=1',
                  'set KYTY_RECORD_THREAD=0',
                  'set KYTY_IMAGE_SPECIALIZATION_CACHE=',
                  'set KYTY_DEBUG_NO_PIXEL_TARGETS=0',
                  'set KYTY_DEBUG_SHADER_CPU=0',
                  'set KYTY_RESOURCE_BLOCKS_32=0',
                  'set KYTY_HOST_PRIORITY_26=0',
                  'set KYTY_REFRESH_DIAGNOSTIC_27=0',
                  'set KYTY_SRT_ALIASES_32=0',
                  'set KYTY_DIRECT_FLAT_31=0',
                  'set KYTY_DIRECT_INPUTS_29=0',
                  'set KYTY_ACTIVE_MASK_VIEW_28=0',
                  'set KYTY_DEBUG_QUEUES=',
                  'set KYTY_SRT_STATS=',
                  'set KYTY_DEBUG_SRT_RUNS=',
                  'set KYTY_VERIFY_SRT=',
                  'set KYTY_VERIFY_SPEC=',
                  'set KYTY_VERIFY_SPEC_READS=',
                  'set KYTY_SPECULATE_DRAWS=0',
                  'set KYTY_LIGHT_DRAIN_STATS=1',
                  'set KYTY_DEBUG_SAMPLE_GPU=',
                  'set KYTY_DEBUG_DUMP_THREADS=',
                  'set KYTY_DEBUG_DRAW_PHASES=',
                  'set KYTY_DEBUG_DRAW_STATS=',
                  'set KYTY_DEBUG_SPEC_STATS=',
                  'set KYTY_DEBUG_STREAM_STATS=',
                  'set KYTY_DEBUG_UPLOADS=',
                  'set KYTY_GPU_ZONES=',
                  '"%~dp0launcher.exe" %*'
              ) | Set-Content "$install/$name" -Encoding ascii
          }
          $maps = Get-ChildItem "_Build/windows" -Filter "kyty_emulator_*.map" -File
          if (-not $maps) { throw "Emulator map missing" }
          foreach ($map in $maps) { Copy-Item $map.FullName $install -Force }
          $pdb = "_Build/windows/kyty_emulator.pdb"
          if (-not (Test-Path $pdb)) { throw "Emulator PDB missing" }
          Copy-Item $pdb $install -Force
          @(
              "AMD base: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9",
              "Prueba-41.cmd: optional compact traversal; original reads retained.",
              "Comparacion-41.cmd: same executable, compact traversal OFF.",
              "Compare the same heavy view for 60 seconds in each mode.",
              "AMD CPU patch OFF; shader validation OFF; red-zone protection ON.",
              "Copy your working _Patches and select THIS interpreter.",
              "Warm up, then remain in the fixed heavy view for 60 seconds.",
              "Copy Prueba-41 console including flat41 and flat41-plan lines.",
              "Close emulator and launcher completely before changing mode."
          ) | Set-Content "$install/PRUEBA-41.txt" -Encoding ascii

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "KytyPS5-Prueba-41.zip"
          Compress-Archive -Path "_Build/windows/install/*" -DestinationPath $zip -Force -ErrorAction Stop
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
              throw "Packaging failed: missing or empty ZIP"
          }

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Prueba-41
          path: KytyPS5-Prueba-41.zip
          if-no-files-found: error
          retention-days: 7
