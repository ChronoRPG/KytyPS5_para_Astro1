name: Windows AMD - Prueba 47 - Direcciones preparadas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - Prueba 47
    runs-on: windows-2022
    env:
      KYTY_FLAGS_47: /clang:-ffp-contract=off
      KYTY_PROFILE_47: Generica
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout pinned working diagnostic 20
        uses: actions/checkout@v4
        with:
          ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
          path: _patch_source
          sparse-checkout: |-
            patches
            .github/workflows
          fetch-depth: 1
          submodules: false

      - name: Setup fixed Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin Python executable and install YAML parser
        run: |
          $ErrorActionPreference = "Stop"
          $pythonExe = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          if (-not $pythonExe) { throw "Python executable missing" }
          "KYTY_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $pythonExe -m pip install PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
          & $pythonExe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Python YAML verification failed" }

      - name: Reproduce working AMD source and retained optimizations
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON -m pip install PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
          @'
          from pathlib import Path
          import subprocess
          import yaml
          baseline = Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml")
          steps = yaml.safe_load(baseline.read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
          started = False
          finished = False
          for index, step in enumerate(steps):
              if step.get("name") == "Setup MSVC environment":
                  finished = True
                  break
              if step.get("name") == "Verify AMD base":
                  started = True
              if not started:
                  continue
              if "uses" in step or "run" not in step:
                  raise RuntimeError("Unexpected baseline preparation step")
              script = Path(f"_prepare47_{index}.ps1")
              script.write_text('$ErrorActionPreference = "Stop"\n' + step["run"], encoding="utf-8")
              print("Preparing:", step["name"], flush=True)
              subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
          if not started or not finished:
              raise RuntimeError("Baseline preparation boundaries missing")
          '@ | & $env:KYTY_PYTHON -
          if ($LASTEXITCODE -ne 0) { throw "Baseline preparation failed" }

      - name: Prepare direct address operands and tests
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          def replace(path,old,new):
           p=Path(path);s=p.read_text(encoding='utf-8')
           if s.count(old)!=1:raise RuntimeError('Unexpected address47 boundary: '+path)
           p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')

          p='src/graphics/shader/recompiler/ir/ShaderIR.h'
          replace(p,'\t\tLogicalNot,','\t\tLogicalNot,\n        DirectAddress47,')
          replace(p,'\tstd::vector<ResourceNode>            nodes;', '''    struct AddressInput47 {
                  uint64_t constant=0;
                  uint32_t user_index=0;
                  uint8_t kind=0; // 0 constant, 1 user data, 2 shader base
              };
              std::vector<std::array<AddressInput47,3>> addresses47;
          \tstd::vector<ResourceNode>            nodes;''')

          p='src/graphics/shader/recompiler/ir/passes/SrtWalker.h'
          replace(p,'\tbool EvaluateRawRead(const ResourceNode& node, uint64_t& result);','\tbool EvaluateRawRead(const ResourceNode& node, uint64_t& result);\n    bool AddressInputs47(const ResourceNode& node,uint64_t& low,uint64_t& high,uint64_t& offset);')

          p='src/graphics/shader/recompiler/ir/passes/SrtWalker.cpp'
          replace(p,'\tprogram.compiled = std::move(compiled);',r'''
              // Lower only side-effect-free address operands, after all plan analyses and flat-run construction.
              const auto* mode47=std::getenv("KYTY_DIRECT_ADDRESSES_47");
              if (mode47!=nullptr && std::strcmp(mode47,"1")==0) {
                  uint32_t lowered=0;
                  for (auto& node:compiled->nodes) {
                      if (node.op!=NodeOp::RawAddress) continue;
                      std::array<CompiledResourcePlan::AddressInput47,3> inputs {};
                      bool valid=true;
                      for (uint32_t operand=0;operand<3u && valid;++operand) {
                          auto index=node.args[operand];
                          uint32_t steps=0;
                          while (index<compiled->nodes.size() && compiled->nodes[index].op==NodeOp::Forward && steps++<compiled->nodes.size())
                              index=compiled->nodes[index].args[0];
                          if (index>=compiled->nodes.size() || steps>compiled->nodes.size()) {valid=false;break;}
                          const auto& leaf=compiled->nodes[index];
                          auto& input=inputs[operand];
                          if (leaf.op==NodeOp::Const) input.constant=leaf.imm;
                          else if (leaf.op==NodeOp::UserData) {input.kind=1;input.user_index=leaf.aux;}
                          else if (leaf.op==NodeOp::ShaderBase) input.kind=2;
                          else valid=false;
                      }
                      if (!valid) continue;
                      node.aux=static_cast<uint32_t>(compiled->addresses47.size());
                      compiled->addresses47.push_back(inputs);
                      node.op=NodeOp::DirectAddress47;
                      ++lowered;
                  }
                  if (program.shader_hash==0x3b809f9d156a95ddull || program.shader_hash==0xf112e0ba527945adull) {
                      static thread_local uint32_t printed=0;
                      if (printed++<16u) {
                          std::printf("address47-plan: shader=%016llx lowered=%u\n",static_cast<unsigned long long>(program.shader_hash),lowered);
                          std::fflush(stdout);
                      }
                  }
              }
          \tprogram.compiled = std::move(compiled);'''.replace('\\tprogram','\tprogram'))

          needle='bool SrtEvaluator::EvaluateRawRead(const ResourceNode& node, uint64_t& result) {'
          replace(p,needle,r'''bool SrtEvaluator::AddressInputs47(const ResourceNode& node,uint64_t& low,uint64_t& high,uint64_t& offset) {
              if (node.op!=NodeOp::DirectAddress47)
                  return EvaluateWide(node.args[0],low) && EvaluateWide(node.args[1],high) && EvaluateWide(node.args[2],offset);
              const auto& inputs=m_compiled.addresses47[node.aux];
              std::array<uint64_t*,3> values {&low,&high,&offset};
              for (uint32_t i=0;i<3u;++i) {
                  const auto& input=inputs[i];
                  if (input.kind==1u) {
                      if (input.user_index>=m_runtime.user_data.size()) return false;
                      *values[i]=m_runtime.user_data[input.user_index];
                  } else if (input.kind==2u) *values[i]=m_runtime.shader_base;
                  else *values[i]=input.constant;
              }
              return true;
          }

          ''' + needle)

          old='\tif (!EvaluateWide(node.args[0], low) || !EvaluateWide(node.args[1], high) ||\n\t    !EvaluateWide(node.args[2], offset)) {'
          s=Path(p).read_text()
          assert s.count(old)==2
          s=s.replace(old,'\tif (!AddressInputs47(node,low,high,offset)) {')
          Path(p).write_text(s)
          replace(p,'\t\tcase NodeOp::RawAddress:\n\t\tcase NodeOp::RawBuffer: return EvaluateRawRead(node, result);','\t\tcase NodeOp::DirectAddress47:\n\t\tcase NodeOp::RawAddress:\n\t\tcase NodeOp::RawBuffer: return EvaluateRawRead(node, result);')
          f=Path(p)
          f.write_text('#include <cstdlib>\n#include <cstring>\n#include <cstdio>\n'+f.read_text())

          p='src/graphics/guest_gpu/graphicsRun.cpp'
          replace(p,'\tg_gpu_thread = true;',r'''    g_gpu_thread = true;
              const auto* mode47=std::getenv("KYTY_DIRECT_ADDRESSES_47");
              std::printf("address47: direct address operands %s\n",mode47!=nullptr && std::strcmp(mode47,"1")==0 ? "ON" : "OFF");
              std::fflush(stdout);''')
          f=Path(p)
          f.write_text('#include <cstdlib>\n#include <cstring>\n'+f.read_text())

          for filename in [
              'src/graphics/shader/recompiler/ir/ShaderIR.h',
              'src/graphics/shader/recompiler/ir/passes/SrtWalker.h',
              'src/graphics/shader/recompiler/ir/passes/SrtWalker.cpp',
              'src/graphics/guest_gpu/graphicsRun.cpp',
          ]:
           f=Path(filename)
           f.write_text('\n'.join(x.rstrip(' \t') for x in f.read_text().splitlines())+'\n')

          print('Address47 adaptation installed')

          p='tests/ResourceMaterializationTests.cpp'
          f=Path(p)
          f.write_text('#include "graphics/shader/recompiler/ir/passes/SrtWalker.h"\n#include <cstdlib>\n#include <cstring>\n'+f.read_text())
          replace(p,'  std::puts("ResourceMaterializationTests: all cases passed");',r'''
            {
              using namespace Libs::Graphics::ShaderRecompiler::IR;
              auto plan=MemoPlan(MemoPlanExtra::DynamicRead,true);
              const auto& compiled=CompileResourcePlan(plan);
              const auto* mode=std::getenv("KYTY_DIRECT_ADDRESSES_47");
              const bool enabled=mode!=nullptr && std::strcmp(mode,"1")==0;
              Check(enabled ? !compiled.addresses47.empty() : compiled.addresses47.empty(),"address47 tested path missing");
              MemoFixture fixture;
              for (uint32_t epoch=0;epoch<256u;++epoch) {
                fixture.memory.words[0]=0x1000u+epoch;
                fixture.user_data[3]=(epoch&1u)!=0u ? 4u : 8u;
                Check(fixture.Refresh(plan),"address47 fresh operand refresh failed");
                Check(fixture.snapshot.buffers[0].dwords[0]==fixture.memory.words[0],"address47 reused old memory");
              }
              fixture.user_data[1]=0xffffu;
              Check(!fixture.Refresh(plan),"address47 ignored rejected address read");
              std::puts("Address47: fresh memory, changing operands and rejected reader passed");
            }
            std::puts("ResourceMaterializationTests: all cases passed");''')
          f=Path(p)
          f.write_text('\n'.join(x.rstrip(' \t') for x in f.read_text().splitlines())+'\n')

          '@ | & $env:KYTY_PYTHON -
          if ($LASTEXITCODE -ne 0) { throw "Address 47 adaptation failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Invalid source diff" }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Build and test using pinned working workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Pinned Python YAML verification failed" }
          @'
          from pathlib import Path
          import subprocess
          import os
          import yaml
          steps = yaml.safe_load(Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml").read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
          started = False
          finished = False
          for index, step in enumerate(steps):
              if step.get("name") == "Package launchers and symbols":
                  finished = True
                  break
              if step.get("name") == "Install glslang":
                  started = True
              if not started:
                  continue
              if "uses" in step or "run" not in step:
                  raise RuntimeError("Unexpected build step")
              if step["name"] == "Configure CMake":
                  flags = os.environ["KYTY_FLAGS_47"]
                  args = ["cmake", "-S", ".", "-B", "_Build/windows", "-G", "Ninja",
                          "-DCMAKE_BUILD_TYPE=Release", "-DCMAKE_C_COMPILER=clang-cl",
                          "-DCMAKE_CXX_COMPILER=clang-cl",
                          "-DCMAKE_PREFIX_PATH=" + os.environ["QT_ROOT_DIR"],
                          "-DCMAKE_C_FLAGS_INIT=" + flags, "-DCMAKE_CXX_FLAGS_INIT=" + flags,
                          "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"]
                  print("Configuring profile:", os.environ["KYTY_PROFILE_47"], flags, flush=True)
                  subprocess.run(args, check=True)
                  cache = Path("_Build/windows/CMakeCache.txt").read_text(encoding="utf-8")
                  cpp_flags = next((line.split("=", 1)[1] for line in cache.splitlines()
                                    if line.startswith("CMAKE_CXX_FLAGS:STRING=")), None)
                  if cpp_flags is None or "/ehsc" not in cpp_flags.lower():
                      raise RuntimeError("CMake lost /EHsc: C++ exceptions must remain enabled")
                  if not all(option in cpp_flags for option in flags.split()):
                      raise RuntimeError("Selected CPU flags are missing from CMAKE_CXX_FLAGS")
                  print("Verified C++ flags:", cpp_flags, flush=True)
                  continue
              script = Path(f"_build47_{index}.ps1")
              source = step["run"]
              if step["name"] == "Install glslang":
                  api_call = '$release = Invoke-RestMethod -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot" -Headers $headers'
                  if source.count(api_call) != 1:
                      raise RuntimeError("Unexpected glslang API call")
                  authenticated = '\n'.join([
                      'if (-not $env:GH_TOKEN) { throw "GitHub Actions token missing" }',
                      '$apiHeaders = $headers.Clone()',
                      '$apiHeaders["Authorization"] = "Bearer $env:GH_TOKEN"',
                      '$apiHeaders["X-GitHub-Api-Version"] = "2022-11-28"',
                      api_call.replace('-Headers $headers', '-Headers $apiHeaders'),
                  ])
                  source = source.replace(api_call, authenticated)
              script.write_text('$ErrorActionPreference = "Stop"\n' + source, encoding="utf-8")
              print("Running:", step["name"], flush=True)
              path_file = Path(os.environ["GITHUB_PATH"])
              entries = path_file.read_text(encoding="utf-8-sig").splitlines() if path_file.exists() else []
              os.environ["PATH"] = os.pathsep.join(entries + [os.environ["PATH"]])
              if step["name"] == "Test memory and shader paths":
                  for mode in ("0", "1"):
                      os.environ["KYTY_DIRECT_ADDRESSES_47"] = mode
                      subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
              else:
                  subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
          if not started or not finished:
              raise RuntimeError("Build boundaries missing")
          '@ | & $env:KYTY_PYTHON -
          if ($LASTEXITCODE -ne 0) { throw "Build or tests failed" }

      - name: Package launchers and symbols
        run: |
          $ErrorActionPreference = "Stop"
          $install = "_Build/windows/install"
          if (-not (Test-Path "$install/launcher.exe")) { throw "launcher.exe missing" }
          foreach ($mode in @(0, 1)) {
              $name = if ($mode -eq 1) { "Prueba-47.cmd" } else { "Comparacion-47.cmd" }
              @(
                  '@echo off',
                  'setlocal',
                  'cd /d "%~dp0"',
                  "set KYTY_DIRECT_ADDRESSES_47=$mode",
                  'set KYTY_PHASES_40=',
                  'set KYTY_CLEAN_RUNS_44=0',
                  'set KYTY_IMMEDIATE_CONDITIONS_42=0',
                  'set KYTY_DEBUG_AB=',
                  'set KYTY_REDUNDANT_SOURCES_38=0',
                  'set KYTY_RESOURCE_COSTS_37=0',
                  'set KYTY_FROZEN_DIAGNOSTIC_36=0',
                  'set KYTY_DESCRIPTOR_MEMO_35=0',
                  'set KYTY_DESCRIPTOR_STATS_35=0',
                  'set KYTY_DESCRIPTOR_RECIPES_34=0',
                  'set KYTY_TRACKING_PAUSE=',
                  'set KYTY_BDA_SLICE_FILTER=',
                  'set KYTY_TRACKING_DIAGNOSTICS=',
                  'set KYTY_ADDRESS_SPACE_DIAGNOSTICS=',
                  'set KYTY_TRACKING_BLOCKING_WAIT=1',
                  'set KYTY_SHARED_SAMPLER_SNAPSHOTS=1',
                  'set KYTY_DIRECT_COLOR_METADATA=1',
                  'set KYTY_RECORD_THREAD=0',
                  'set KYTY_IMAGE_SPECIALIZATION_CACHE=',
                  'set KYTY_DEBUG_NO_PIXEL_TARGETS=0',
                  'set KYTY_DEBUG_SHADER_CPU=0',
                  'set KYTY_RESOURCE_BLOCKS_32=0',
                  'set KYTY_HOST_PRIORITY_26=0',
                  'set KYTY_REFRESH_DIAGNOSTIC_27=0',
                  'set KYTY_SRT_ALIASES_32=0',
                  'set KYTY_DIRECT_FLAT_31=0',
                  'set KYTY_DIRECT_INPUTS_29=0',
                  'set KYTY_ACTIVE_MASK_VIEW_28=0',
                  'set KYTY_DEBUG_QUEUES=',
                  'set KYTY_SRT_STATS=',
                  'set KYTY_DEBUG_SRT_RUNS=',
                  'set KYTY_VERIFY_SRT=',
                  'set KYTY_VERIFY_SPEC=',
                  'set KYTY_VERIFY_SPEC_READS=',
                  'set KYTY_SPECULATE_DRAWS=0',
                  'set KYTY_LIGHT_DRAIN_STATS=1',
                  'set KYTY_DEBUG_SAMPLE_GPU=',
                  'set KYTY_DEBUG_DUMP_THREADS=',
                  'set KYTY_DEBUG_DRAW_PHASES=',
                  'set KYTY_DEBUG_DRAW_STATS=',
                  'set KYTY_DEBUG_SPEC_STATS=',
                  'set KYTY_DEBUG_STREAM_STATS=',
                  'set KYTY_DEBUG_UPLOADS=',
                  'set KYTY_GPU_ZONES=',
                  '"%~dp0launcher.exe" %*'
              ) | Set-Content "$install/$name" -Encoding ascii
          }
          $maps = Get-ChildItem "_Build/windows" -Filter "kyty_emulator_*.map" -File
          if (-not $maps) { throw "Emulator map missing" }
          foreach ($map in $maps) { Copy-Item $map.FullName $install -Force }
          $pdb = "_Build/windows/kyty_emulator.pdb"
          if (-not (Test-Path $pdb)) { throw "Emulator PDB missing" }
          Copy-Item $pdb $install -Force
          @(
              "Prueba-47.cmd: prepared address operands ON.",
              "Comparacion-47.cmd: same executable, original evaluation.",
              "Keep _Patches, _PipelineCache and kyty_settings.ini.",
              "AMD CPU patch OFF; shader validation OFF; red-zone ON.",
              "Select THIS interpreter. Heavy view 60 seconds each mode.",
              "Report full Prueba console including address47 and address47-plan."
          ) | Set-Content "$install/PRUEBA-47.txt" -Encoding ascii

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "KytyPS5-Prueba-47.zip"
          Compress-Archive -Path "_Build/windows/install/*" -DestinationPath $zip -Force -ErrorAction Stop
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
              throw "Packaging failed: missing or empty ZIP"
          }

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Prueba-47
          path: KytyPS5-Prueba-47.zip
          if-no-files-found: error
          retention-days: 7
