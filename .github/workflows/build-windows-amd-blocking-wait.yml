name: Windows AMD - Diagnostico 49 - Coste de comprobaciones
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Checkout fixed AMD base
      uses: actions/checkout@v4
      with:
        ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
        submodules: recursive
        fetch-depth: 1
    - name: Checkout pinned working diagnostic 20
      uses: actions/checkout@v4
      with:
        ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
        path: _patch_source
        sparse-checkout: |-
          patches
          .github/workflows
        fetch-depth: 1
        submodules: false
    - name: Setup fixed Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Pin Python executable and install YAML parser
      run: |
        $ErrorActionPreference = "Stop"
        $pythonExe = (Get-Command python -CommandType Application | Select-Object -First 1).Source
        if (-not $pythonExe) { throw "Python executable missing" }
        "KYTY_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        & $pythonExe -m pip install PyYAML==6.0.2
        if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
        & $pythonExe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
        if ($LASTEXITCODE -ne 0) { throw "Python YAML verification failed" }
    - name: Reproduce working AMD source and retained optimizations
      run: |
        $ErrorActionPreference = "Stop"
        & $env:KYTY_PYTHON -m pip install PyYAML==6.0.2
        if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
        @'
        from pathlib import Path
        import subprocess
        import yaml
        baseline = Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml")
        steps = yaml.safe_load(baseline.read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
        started = False
        finished = False
        for index, step in enumerate(steps):
            if step.get("name") == "Setup MSVC environment":
                finished = True
                break
            if step.get("name") == "Verify AMD base":
                started = True
            if not started:
                continue
            if "uses" in step or "run" not in step:
                raise RuntimeError("Unexpected baseline preparation step")
            script = Path(f"_prepare49_{index}.ps1")
            script.write_text('$ErrorActionPreference = "Stop"\n' + step["run"], encoding="utf-8")
            print("Preparing:", step["name"], flush=True)
            subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
        if not started or not finished:
            raise RuntimeError("Baseline preparation boundaries missing")
        '@ | & $env:KYTY_PYTHON -
        if ($LASTEXITCODE -ne 0) { throw "Baseline preparation failed" }
    - name: Measure original image-group validation
      run: |
        $ErrorActionPreference = "Stop"
        @'
        from pathlib import Path

        header = r'''#pragma once
        #include <array>
        #include <chrono>
        #include <cstdio>
        #include <cstdlib>
        #include <cstring>
        #include <cstdint>
        namespace TextureTiming49 {
        inline bool Enabled() {
            static const bool enabled=[] {
                const char* value=std::getenv("KYTY_TEXTURE_TIMING_49");
                return value!=nullptr && std::strcmp(value,"1")==0;
            }();
            return enabled;
        }
        struct Phase {
            uint64_t calls=0, kept_samples=0, failed_samples=0, image_slots=0;
            double kept_ns=0, failed_ns=0;
        };
        struct Stats {
            std::array<Phase,2> phases {};
            std::array<uint64_t,2> sequence {};
            std::chrono::steady_clock::time_point start=std::chrono::steady_clock::now();
        };
        template<class Check>
        inline bool Measure(bool second, size_t slots, Check&& check) {
            if (!Enabled()) return check();
            static thread_local Stats stats;
            const auto phase=second ? 1u : 0u;
            auto& row=stats.phases[phase];
            ++row.calls;
            const auto sequence=stats.sequence[phase]++;
            // One position per block of 1024 calls; position rotates across blocks.
            if ((sequence & 1023u)!=((sequence >> 10u) & 1023u)) return check();
            const auto before=std::chrono::steady_clock::now();
            const bool kept=check();
            const auto after=std::chrono::steady_clock::now();
            const auto ns=std::chrono::duration<double,std::nano>(after-before).count();
            if (kept) { ++row.kept_samples; row.kept_ns+=ns; row.image_slots+=slots; }
            else { ++row.failed_samples; row.failed_ns+=ns; }
            const auto seconds=std::chrono::duration<double>(after-stats.start).count();
            if (seconds>=5.0) {
                std::printf("texture49: %.2fs original image-group validation timings\n",seconds);
                for (uint32_t i=0;i<2u;++i) {
                    const auto& item=stats.phases[i];
                    std::printf("texture49-%s: calls=%llu kept-samples=%llu kept-us=%.4f failed-samples=%llu failed-us=%.4f kept-image-slots=%.2f\n",
                        i==0u ? "prepare" : "recheck", (unsigned long long)item.calls,
                        (unsigned long long)item.kept_samples,
                        item.kept_samples ? item.kept_ns/item.kept_samples/1000.0 : 0.0,
                        (unsigned long long)item.failed_samples,
                        item.failed_samples ? item.failed_ns/item.failed_samples/1000.0 : 0.0,
                        item.kept_samples ? double(item.image_slots)/item.kept_samples : 0.0);
                }
                std::fflush(stdout);
                stats.phases={};
                stats.start=std::chrono::steady_clock::now();
            }
            return kept;
        }
        }
        '''
        # The lambda at one production wrapper site gives both phases the same Stats specialization.
        def replace(path, old, new):
            p=Path(path); source=p.read_text(encoding='utf-8')
            if source.count(old)!=1:
                raise RuntimeError('Unexpected timing49 boundary: '+str(path))
            p.write_text(source.replace(old,new),encoding='utf-8',newline='\n')
        path=Path('src/graphics/host_gpu/renderer/pipeline/descriptors.cpp')
        source=path.read_text(encoding='utf-8')
        old='static bool ImageGroupStands(TextureCache& cache, const PreparedBindings& prepared) {'
        if source.count(old)!=1: raise RuntimeError('Original image group function missing')
        start=source.index(old)
        end=source.index('\n// Records the stage',start)
        original=source[start:end]
        wrapper=r'''
        static bool ImageGroupStands(TextureCache& cache, const PreparedBindings& prepared,
                                     bool second=false) {
            return TextureTiming49::Measure(second,prepared.images.size(),[&] {
                return OriginalImageGroupCheck49(cache,prepared);
            });
        }
        '''
        replacement=original.replace('ImageGroupStands(', 'OriginalImageGroupCheck49(',1)+wrapper
        source=source[:start]+replacement+source[end:]
        path.write_text('#include "graphics/host_gpu/renderer/pipeline/textureTiming49.h"\n'+source,encoding='utf-8',newline='\n')
        replace(path,'if (group_kept && ImageGroupStands(texture_cache, prepared)) {',
                     'if (group_kept && ImageGroupStands(texture_cache, prepared, true)) {')
        Path('src/graphics/host_gpu/renderer/pipeline/textureTiming49.h').write_text(header,encoding='utf-8',newline='\n')
        path=Path('src/graphics/guest_gpu/graphicsRun.cpp')
        path.write_text('#include "graphics/host_gpu/renderer/pipeline/textureTiming49.h"\n'+path.read_text(encoding='utf-8'),encoding='utf-8',newline='\n')
        replace(path,'\tg_gpu_thread = true;', '''    g_gpu_thread = true;
            if(TextureTiming49::Enabled()) {
                std::printf("texture49: diagnostic active; sampled original checks; no checks skipped\\n");
                std::fflush(stdout);
            }''')
        for name in ['src/graphics/host_gpu/renderer/pipeline/descriptors.cpp','src/graphics/guest_gpu/graphicsRun.cpp']:
            p=Path(name)
            p.write_text('\n'.join(line.rstrip(' \t') for line in p.read_text().splitlines())+'\n',encoding='utf-8',newline='\n')
        print('Image group timing49 installed; original checks preserved')

        '@ | & $env:KYTY_PYTHON -
        if ($LASTEXITCODE -ne 0) { throw "Timing 49 adaptation failed" }
        git diff --check
        if ($LASTEXITCODE -ne 0) { throw "Invalid source diff" }
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Setup Clang
      uses: egor-tensin/setup-clang@v1
      with:
        version: 18
        platform: x64
        cygwin: 0
    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v5
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.3
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: qt5compat
        cache: true
    - name: Build and test using pinned working workflow
      run: |
        $ErrorActionPreference = "Stop"
        & $env:KYTY_PYTHON -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
        if ($LASTEXITCODE -ne 0) { throw "Pinned Python YAML verification failed" }
        @'
        from pathlib import Path
        import subprocess
        import os
        import yaml
        steps = yaml.safe_load(Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml").read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
        started = False
        finished = False
        for index, step in enumerate(steps):
            if step.get("name") == "Package launchers and symbols":
                finished = True
                break
            if step.get("name") == "Install glslang":
                started = True
            if not started:
                continue
            if "uses" in step or "run" not in step:
                raise RuntimeError("Unexpected build step")
            if step["name"] == "Configure CMake":
                flags = os.environ["KYTY_FLAGS_49"]
                args = ["cmake", "-S", ".", "-B", "_Build/windows", "-G", "Ninja",
                        "-DCMAKE_BUILD_TYPE=Release", "-DCMAKE_C_COMPILER=clang-cl",
                        "-DCMAKE_CXX_COMPILER=clang-cl",
                        "-DCMAKE_PREFIX_PATH=" + os.environ["QT_ROOT_DIR"],
                        "-DCMAKE_C_FLAGS_INIT=" + flags, "-DCMAKE_CXX_FLAGS_INIT=" + flags,
                        "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"]
                print("Configuring profile:", os.environ["KYTY_PROFILE_49"], flags, flush=True)
                subprocess.run(args, check=True)
                cache = Path("_Build/windows/CMakeCache.txt").read_text(encoding="utf-8")
                cpp_flags = next((line.split("=", 1)[1] for line in cache.splitlines()
                                  if line.startswith("CMAKE_CXX_FLAGS:STRING=")), None)
                if cpp_flags is None or "/ehsc" not in cpp_flags.lower():
                    raise RuntimeError("CMake lost /EHsc: C++ exceptions must remain enabled")
                if not all(option in cpp_flags for option in flags.split()):
                    raise RuntimeError("Selected CPU flags are missing from CMAKE_CXX_FLAGS")
                print("Verified C++ flags:", cpp_flags, flush=True)
                continue
            script = Path(f"_build49_{index}.ps1")
            source = step["run"]
            if step["name"] == "Install glslang":
                api_call = '$release = Invoke-RestMethod -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot" -Headers $headers'
                if source.count(api_call) != 1:
                    raise RuntimeError("Unexpected glslang API call")
                authenticated = '\n'.join([
                    'if (-not $env:GH_TOKEN) { throw "GitHub Actions token missing" }',
                    '$apiHeaders = $headers.Clone()',
                    '$apiHeaders["Authorization"] = "Bearer $env:GH_TOKEN"',
                    '$apiHeaders["X-GitHub-Api-Version"] = "2022-11-28"',
                    api_call.replace('-Headers $headers', '-Headers $apiHeaders'),
                ])
                source = source.replace(api_call, authenticated)
            script.write_text('$ErrorActionPreference = "Stop"\n' + source, encoding="utf-8")
            print("Running:", step["name"], flush=True)
            path_file = Path(os.environ["GITHUB_PATH"])
            entries = path_file.read_text(encoding="utf-8-sig").splitlines() if path_file.exists() else []
            os.environ["PATH"] = os.pathsep.join(entries + [os.environ["PATH"]])
            if step["name"] == "Test memory and shader paths":
                for mode in ("0", "1"):
                    os.environ["KYTY_TEXTURE_TIMING_49"] = mode
                    subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
            else:
                subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
        if not started or not finished:
            raise RuntimeError("Build boundaries missing")
        '@ | & $env:KYTY_PYTHON -
        if ($LASTEXITCODE -ne 0) { throw "Build or tests failed" }
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Package launchers and symbols
      run: |
        $ErrorActionPreference = "Stop"
        $install = "_Build/windows/install"
        if (-not (Test-Path "$install/launcher.exe")) { throw "launcher.exe missing" }
        foreach ($mode in @(0, 1)) {
            $name = if ($mode -eq 1) { "Diagnostico-49.cmd" } else { "Comparacion-49.cmd" }
            @(
                '@echo off',
                'setlocal',
                'cd /d "%~dp0"',
                "set KYTY_TEXTURE_TIMING_49=$mode",
                'set KYTY_TEXTURE_REUSE_48=0',
                'set KYTY_DIRECT_ADDRESSES_47=0',
                'set KYTY_PHASES_40=',
                'set KYTY_CLEAN_RUNS_44=0',
                'set KYTY_IMMEDIATE_CONDITIONS_42=0',
                'set KYTY_DEBUG_AB=',
                'set KYTY_REDUNDANT_SOURCES_38=0',
                'set KYTY_RESOURCE_COSTS_37=0',
                'set KYTY_FROZEN_DIAGNOSTIC_36=0',
                'set KYTY_DESCRIPTOR_MEMO_35=0',
                'set KYTY_DESCRIPTOR_STATS_35=0',
                'set KYTY_DESCRIPTOR_RECIPES_34=0',
                'set KYTY_TRACKING_PAUSE=',
                'set KYTY_BDA_SLICE_FILTER=',
                'set KYTY_TRACKING_DIAGNOSTICS=',
                'set KYTY_ADDRESS_SPACE_DIAGNOSTICS=',
                'set KYTY_TRACKING_BLOCKING_WAIT=1',
                'set KYTY_SHARED_SAMPLER_SNAPSHOTS=1',
                'set KYTY_DIRECT_COLOR_METADATA=1',
                'set KYTY_RECORD_THREAD=0',
                'set KYTY_IMAGE_SPECIALIZATION_CACHE=',
                'set KYTY_DEBUG_NO_PIXEL_TARGETS=0',
                'set KYTY_DEBUG_SHADER_CPU=0',
                'set KYTY_RESOURCE_BLOCKS_32=0',
                'set KYTY_HOST_PRIORITY_26=0',
                'set KYTY_REFRESH_DIAGNOSTIC_27=0',
                'set KYTY_SRT_ALIASES_32=0',
                'set KYTY_DIRECT_FLAT_31=0',
                'set KYTY_DIRECT_INPUTS_29=0',
                'set KYTY_ACTIVE_MASK_VIEW_28=0',
                'set KYTY_DEBUG_QUEUES=',
                'set KYTY_SRT_STATS=',
                'set KYTY_DEBUG_SRT_RUNS=',
                'set KYTY_VERIFY_SRT=',
                'set KYTY_VERIFY_SPEC=',
                'set KYTY_VERIFY_SPEC_READS=',
                'set KYTY_SPECULATE_DRAWS=0',
                'set KYTY_LIGHT_DRAIN_STATS=1',
                'set KYTY_DEBUG_SAMPLE_GPU=',
                'set KYTY_DEBUG_DUMP_THREADS=',
                'set KYTY_DEBUG_DRAW_PHASES=',
                'set KYTY_DEBUG_DRAW_STATS=',
                'set KYTY_DEBUG_SPEC_STATS=',
                'set KYTY_DEBUG_STREAM_STATS=',
                'set KYTY_DEBUG_UPLOADS=',
                'set KYTY_GPU_ZONES=',
                '"%~dp0launcher.exe" %*'
            ) | Set-Content "$install/$name" -Encoding ascii
        }
        $maps = Get-ChildItem "_Build/windows" -Filter "kyty_emulator_*.map" -File
        if (-not $maps) { throw "Emulator map missing" }
        foreach ($map in $maps) { Copy-Item $map.FullName $install -Force }
        $pdb = "_Build/windows/kyty_emulator.pdb"
        if (-not (Test-Path $pdb)) { throw "Emulator PDB missing" }
        Copy-Item $pdb $install -Force
        @(
            "Diagnostico-49.cmd: sampled timings of original texture checks ON.",
            "Comparacion-49.cmd: same executable, diagnostic OFF.",
            "Keep _Patches, _PipelineCache and kyty_settings.ini.",
            "AMD CPU patch OFF; shader validation OFF; red-zone ON.",
            "Select THIS interpreter. Warm up, heavy view 60 seconds, then light view 60 seconds.",
            "Report full diagnostic consoles including texture49 prepare and recheck lines."
        ) | Set-Content "$install/DIAGNOSTICO-49.txt" -Encoding ascii
    - name: Create Windows ZIP
      run: |
        $ErrorActionPreference = "Stop"
        $zip = "KytyPS5-Diagnostico-49.zip"
        Compress-Archive -Path "_Build/windows/install/*" -DestinationPath $zip -Force -ErrorAction Stop
        if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
            throw "Packaging failed: missing or empty ZIP"
        }
    - name: Upload KytyPS5
      uses: actions/upload-artifact@v4
      with:
        name: KytyPS5-Diagnostico-49
        path: KytyPS5-Diagnostico-49.zip
        if-no-files-found: error
        retention-days: 7
    name: Windows x64 - Diagnostico 49
    env:
      KYTY_FLAGS_49: /clang:-ffp-contract=off
      KYTY_PROFILE_49: Generica
