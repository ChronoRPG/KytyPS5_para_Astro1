name: Windows AMD - Prueba 38 - Recursos ya presentes

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - Prueba 38
    runs-on: windows-2022

    env:
      KYTY_FLAGS_38: /clang:-ffp-contract=off
      KYTY_PROFILE_38: Generica

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout fixed AMD base
      uses: actions/checkout@v4
      with:
        ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
        submodules: recursive
        fetch-depth: 1

    - name: Checkout pinned working diagnostic 20
      uses: actions/checkout@v4
      with:
        ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
        path: _patch_source
        sparse-checkout: |
          patches
          .github/workflows
        fetch-depth: 1
        submodules: false

    - name: Setup fixed Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Pin Python executable and install YAML parser
      run: |
        $ErrorActionPreference = "Stop"
        $pythonExe = (Get-Command python -CommandType Application | Select-Object -First 1).Source
        if (-not $pythonExe) { throw "Python executable missing" }
        "KYTY_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        & $pythonExe -m pip install PyYAML==6.0.2
        if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
        & $pythonExe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
        if ($LASTEXITCODE -ne 0) { throw "Python YAML verification failed" }

    - name: Reproduce working AMD source and retained optimizations
      run: |
        $ErrorActionPreference = "Stop"
        & $env:KYTY_PYTHON -m pip install PyYAML==6.0.2
        if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
        @'
        from pathlib import Path
        import subprocess
        import yaml

        baseline = Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml")
        steps = yaml.safe_load(baseline.read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
        started = False
        finished = False

        for index, step in enumerate(steps):
            if step.get("name") == "Setup MSVC environment":
                finished = True
                break
            if step.get("name") == "Verify AMD base":
                started = True
            if not started:
                continue
            if "uses" in step or "run" not in step:
                raise RuntimeError("Unexpected baseline preparation step")

            script = Path(f"_prepare38_{index}.ps1")
            script.write_text('$ErrorActionPreference = "Stop"\n' + step["run"], encoding="utf-8")
            print("Preparing:", step["name"], flush=True)
            subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)

        if not started or not finished:
            raise RuntimeError("Baseline preparation boundaries missing")
        '@ | & $env:KYTY_PYTHON -
        if ($LASTEXITCODE -ne 0) { throw "Baseline preparation failed" }

    - name: Add optional redundant-source optimization and regression tests
      run: |
        $ErrorActionPreference = "Stop"
        @'
        from pathlib import Path

        def replace(path,old,new):
            p=Path(path)
            s=p.read_text(encoding='utf-8')
            if s.count(old)!=1:
                raise RuntimeError('Unexpected source 38 boundary: '+path)
            p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')

        header='src/graphics/shader/recompiler/ir/passes/RedundantSources38.h'
        Path(header).write_text(r'''#pragma once
        #include <cstdlib>
        #include <cstring>
        namespace Libs::Graphics::ShaderRecompiler::IR {
        inline bool RedundantSources38Enabled() {
            static const bool enabled=[] {
                const auto* v=std::getenv("KYTY_REDUNDANT_SOURCES_38");
                return v!=nullptr && std::strcmp(v,"1")==0;
            }();
            return enabled;
        }
        }
        ''',encoding='utf-8')

        p=Path('src/graphics/shader/recompiler/ir/passes/SrtWalker.cpp')
        p.write_text('#include "graphics/shader/recompiler/ir/passes/RedundantSources38.h"\n#include <atomic>\n#include <cstdio>\n'+p.read_text(encoding='utf-8'),encoding='utf-8')

        replace(str(p),
            '\tconst auto count = program.control_flow.size();\n\tcompiled.inert_successors.assign(count, 0u);',
            r'''    const bool redundant38=RedundantSources38Enabled() && !program.has_address_writes &&
                program.uniform_fill.fill.words==0u &&
                !std::ranges::any_of(program.info.buffers,&BufferResource::written) &&
                !std::ranges::any_of(program.info.images,&ImageResource::written) &&
                !std::ranges::any_of(program.descriptor_sources,[](const auto& x){return x.indirect_image.has_value();});
            uint32_t extra_conditions38=0;
            const auto count = program.control_flow.size();
            compiled.inert_successors.assign(count, 0u);''')

        replace(str(p),
            '\t\tbool inert = true;\n\t\twhile (!stack.empty() && inert) {',
            r'''        bool inert = true;
                bool originally_inert38 = true;
                while (!stack.empty() && inert) {''')

        replace(str(p),
            '\t\t\tinert          = program.control_flow[index].sources.empty();',
            r'''            const auto& reached_sources38=program.control_flow[index].sources;
                    originally_inert38=originally_inert38 && reached_sources38.empty();
                    inert=reached_sources38.empty();
                    if (redundant38 && !inert) {
                        const auto& available38=program.control_flow[block].sources;
                        inert=std::ranges::all_of(reached_sources38,[&](uint32_t source) {
                            return std::ranges::find(available38,source)!=available38.end();
                        });
                    }''')

        replace(str(p),
            '\t\tcompiled.inert_successors[block] = inert ? 1u : 0u;\n\t}\n}\n\nvoid AnalyzeMemo',
            r'''        compiled.inert_successors[block] = inert ? 1u : 0u;
                if (redundant38 && inert && !originally_inert38 &&
                    compiled.conditions[block]!=ResourceNode::NoNode) ++extra_conditions38;
            }
            if (RedundantSources38Enabled()) {
                static std::atomic<uint64_t> seen38=0,affected38=0,conditions38=0;
                if (extra_conditions38!=0u) {
                    affected38.fetch_add(1u,std::memory_order_relaxed);
                    conditions38.fetch_add(extra_conditions38,std::memory_order_relaxed);
                    std::printf("source38-plan: shader=%016llx stage=%s extra-conditions=%u\n",
                        static_cast<unsigned long long>(program.shader_hash),StageName(program.stage),extra_conditions38);
                }
                const auto n=seen38.fetch_add(1u,std::memory_order_relaxed)+1u;
                if (n%128u==0u) {
                    std::printf("source38-plans: seen=%llu affected=%llu extra-conditions=%llu\n",
                        static_cast<unsigned long long>(n),
                        static_cast<unsigned long long>(affected38.load(std::memory_order_relaxed)),
                        static_cast<unsigned long long>(conditions38.load(std::memory_order_relaxed)));
                }
                if (extra_conditions38!=0u || n%128u==0u) std::fflush(stdout);
            }
        }

        void AnalyzeMemo''')

        replace('src/graphics/shader/recompiler/ir/ShaderIR.h',
            '// Per control_flow block: no block reachable from its successors guards a source, so its',
            '// Per control_flow block: successors add no source (or only sources already in this block), so its')

        p=Path('src/graphics/guest_gpu/graphicsRun.cpp')
        p.write_text('#include "graphics/shader/recompiler/ir/passes/RedundantSources38.h"\n'+p.read_text(encoding='utf-8'),encoding='utf-8')

        replace(str(p),'\tg_gpu_thread = true;',r'''    g_gpu_thread = true;
            std::printf("source38: redundant-source optimization %s\n",
                ShaderRecompiler::IR::RedundantSources38Enabled() ? "ON" : "OFF");
            std::fflush(stdout);''')

        p=Path('tests/ResourceMaterializationTests.cpp')
        p.write_text('#include "graphics/shader/recompiler/ir/passes/RedundantSources38.h"\n'+p.read_text(encoding='utf-8'),encoding='utf-8')

        tests=r'''
        void TestRedundantSources38() {
            using namespace Libs::Graphics::ShaderRecompiler::IR;
            const bool enabled=RedundantSources38Enabled();
            SetResourceMaterializationVerification(false);

            for (const bool reject:{false,true}) {
                for (const uint32_t value:{0u,1u,0xffffffffu}) {
                    auto plan=MemoPlan(MemoPlanExtra::DynamicRead,true);
                    plan.control_flow[0].condition=plan.descriptor_sources[2].dwords[0];
                    plan.control_flow[0].sources={0u,1u};
                    plan.control_flow[2].successors={0u};

                    MemoFixture f;
                    f.memory.reject_strict=reject;
                    f.memory.words[2]=value;
                    Check(f.Refresh(plan),"dominated resource plan failed");
                    Check((CompileResourcePlan(plan).inert_successors[0]!=0u)==enabled,
                        "shared resources were not classified correctly");
                    Check(enabled ? f.memory.strict_reads==0u : f.memory.strict_reads!=0u,
                        "strict condition elimination did not follow the selected mode");

                    ResourceSnapshot ref;
                    ResourceSpecialization spec;
                    const SrtRuntime rt {.user_data=f.user_data,.read_memory=TableMemory::DirectRead,
                        .userdata=&f.memory,.read_specialization_memory=TableMemory::StrictRead};

                    Check(MaterializeResourcesReference(plan,rt,ref,spec),"dominated reference failed");
                    Check(ref.buffers==f.snapshot.buffers && ref.images==f.snapshot.images &&
                        ref.samplers==f.snapshot.samplers && ref.user_data==f.snapshot.user_data &&
                        ref.flattened_srt==f.snapshot.flattened_srt && ref.uniform_fill==f.snapshot.uniform_fill &&
                        spec==f.specialization,"eliminating a shared-resource branch changed its output");

                    f.memory.words[0]^=0x100u;
                    Check(f.Refresh(plan) && f.snapshot.buffers[0].dwords[0]==f.memory.words[0],
                        "branch elimination reused old guest data");
                }
            }

            for (const uint32_t value:{0u,1u}) {
                auto plan=MemoPlan(MemoPlanExtra::DynamicRead,true);
                plan.control_flow[0].condition=plan.descriptor_sources[2].dwords[0];
                plan.control_flow[0].sources={0u};

                MemoFixture f;
                f.memory.words[2]=value;
                Check(f.Refresh(plan),"non-dominated plan failed");
                Check(CompileResourcePlan(plan).inert_successors[0]==0u && f.memory.strict_reads!=0u,
                    "a condition guarding a new source was removed");
                Check((f.snapshot.buffers[1].dwords[0]!=0u)==(value==0u),
                    "condition elimination activated the wrong branch");
            }

            auto written=MemoPlan(MemoPlanExtra::DynamicRead,true);
            written.control_flow[0].sources={0u,1u};
            written.info.buffers[0].written=true;
            Check(CompileResourcePlan(written).inert_successors[0]==0u,
                "branch expansion was applied to a write-capable plan");

            std::puts("RedundantSources38: shared sources, cycles, strict failures and fresh inputs passed");
        }
        '''

        replace(str(p),'int main() {',tests+'\nint main() {\n  TestRedundantSources38();')
        print('Prueba 38 installed; original reads and descriptor evaluation retained',flush=True)
        '@ | & $env:KYTY_PYTHON -
        if ($LASTEXITCODE -ne 0) { throw "Prueba 38 adaptation failed" }
        git diff --check
        if ($LASTEXITCODE -ne 0) { throw "Invalid source diff" }

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup Clang
      uses: egor-tensin/setup-clang@v1
      with:
        version: 18
        platform: x64
        cygwin: 0

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v5

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.3
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: qt5compat
        cache: true

    - name: Build and test using pinned working workflow
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = "Stop"
        & $env:KYTY_PYTHON -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
        if ($LASTEXITCODE -ne 0) { throw "Pinned Python YAML verification failed" }
        @'
        from pathlib import Path
        import subprocess
        import os
        import yaml

        steps = yaml.safe_load(Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml").read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
        started = False
        finished = False

        for index, step in enumerate(steps):
            if step.get("name") == "Package launchers and symbols":
                finished = True
                break
            if step.get("name") == "Install glslang":
                started = True
            if not started:
                continue
            if "uses" in step or "run" not in step:
                raise RuntimeError("Unexpected build step")

            if step["name"] == "Configure CMake":
                flags = os.environ["KYTY_FLAGS_38"]
                args = ["cmake", "-S", ".", "-B", "_Build/windows", "-G", "Ninja",
                        "-DCMAKE_BUILD_TYPE=Release",
                        "-DCMAKE_C_COMPILER=clang-cl",
                        "-DCMAKE_CXX_COMPILER=clang-cl",
                        "-DCMAKE_PREFIX_PATH=" + os.environ["QT_ROOT_DIR"],
                        "-DCMAKE_C_FLAGS_INIT=" + flags,
                        "-DCMAKE_CXX_FLAGS_INIT=" + flags,
                        "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"]

                print("Configuring profile:", os.environ["KYTY_PROFILE_38"], flags, flush=True)
                subprocess.run(args, check=True)

                cache = Path("_Build/windows/CMakeCache.txt").read_text(encoding="utf-8")
                cpp_flags = next((line.split("=", 1)[1] for line in cache.splitlines()
                                  if line.startswith("CMAKE_CXX_FLAGS:STRING=")), None)

                if cpp_flags is None or "/ehsc" not in cpp_flags.lower():
                    raise RuntimeError("CMake lost /EHsc: C++ exceptions must remain enabled")
                if not all(option in cpp_flags for option in flags.split()):
                    raise RuntimeError("Selected CPU flags are missing from CMAKE_CXX_FLAGS")

                print("Verified C++ flags:", cpp_flags, flush=True)
                continue

            script = Path(f"_build38_{index}.ps1")
            source = step["run"]

            if step["name"] == "Install glslang":
                api_call = '$release = Invoke-RestMethod -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot" -Headers $headers'
                if source.count(api_call) != 1:
                    raise RuntimeError("Unexpected glslang API call")
                authenticated = '\n'.join([
                    'if (-not $env:GH_TOKEN) { throw "GitHub Actions token missing" }',
                    '$apiHeaders = $headers.Clone()',
                    '$apiHeaders["Authorization"] = "Bearer $env:GH_TOKEN"',
                    '$apiHeaders["X-GitHub-Api-Version"] = "2022-11-28"',
                    api_call.replace('-Headers $headers', '-Headers $apiHeaders'),
                ])
                source = source.replace(api_call, authenticated)

            script.write_text('$ErrorActionPreference = "Stop"\n' + source, encoding="utf-8")
            print("Running:", step["name"], flush=True)

            path_file = Path(os.environ["GITHUB_PATH"])
            entries = path_file.read_text(encoding="utf-8-sig").splitlines() if path_file.exists() else []
            os.environ["PATH"] = os.pathsep.join(entries + [os.environ["PATH"]])

            if step["name"] == "Test memory and shader paths":
                for mode38 in ("0", "1"):
                    os.environ["KYTY_REDUNDANT_SOURCES_38"] = mode38
                    print("Testing source optimization mode:", mode38, flush=True)
                    subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
                os.environ.pop("KYTY_REDUNDANT_SOURCES_38", None)
            else:
                subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)

        if not started or not finished:
            raise RuntimeError("Build boundaries missing")
        '@ | & $env:KYTY_PYTHON -
        if ($LASTEXITCODE -ne 0) { throw "Build or tests failed" }

    - name: Package launchers and symbols
      run: |
        $ErrorActionPreference = "Stop"
        $install = "_Build/windows/install"
        if (-not (Test-Path "$install/launcher.exe")) { throw "launcher.exe missing" }

        foreach ($mode in @(0, 1)) {
            $name = if ($mode -eq 1) { "Prueba-38.cmd" } else { "Comparacion-38.cmd" }
            @(
                '@echo off',
                'setlocal',
                'cd /d "%~dp0"',
                "set KYTY_REDUNDANT_SOURCES_38=$mode",
                'set KYTY_RESOURCE_COSTS_37=0',
                'set KYTY_FROZEN_DIAGNOSTIC_36=0',
                'set KYTY_DESCRIPTOR_MEMO_35=0',
                'set KYTY_DESCRIPTOR_STATS_35=0',
                'set KYTY_DESCRIPTOR_RECIPES_34=0',
                'set KYTY_TRACKING_PAUSE=',
                'set KYTY_BDA_SLICE_FILTER=',
                'set KYTY_TRACKING_DIAGNOSTICS=',
                'set KYTY_ADDRESS_SPACE_DIAGNOSTICS=',
                'set KYTY_TRACKING_BLOCKING_WAIT=1',
                'set KYTY_SHARED_SAMPLER_SNAPSHOTS=1',
                'set KYTY_DIRECT_COLOR_METADATA=1',
                'set KYTY_RECORD_THREAD=0',
                'set KYTY_IMAGE_SPECIALIZATION_CACHE=',
                'set KYTY_DEBUG_NO_PIXEL_TARGETS=0',
                'set KYTY_DEBUG_SHADER_CPU=0',
                'set KYTY_RESOURCE_BLOCKS_32=0',
                'set KYTY_HOST_PRIORITY_26=0',
                'set KYTY_REFRESH_DIAGNOSTIC_27=0',
                'set KYTY_SRT_ALIASES_32=0',
                'set KYTY_DIRECT_FLAT_31=0',
                'set KYTY_DIRECT_INPUTS_29=0',
                'set KYTY_ACTIVE_MASK_VIEW_28=0',
                'set KYTY_DEBUG_QUEUES=',
                'set KYTY_SRT_STATS=',
                'set KYTY_DEBUG_SRT_RUNS=',
                'set KYTY_VERIFY_SRT=',
                'set KYTY_VERIFY_SPEC=',
                'set KYTY_VERIFY_SPEC_READS=',
                'set KYTY_SPECULATE_DRAWS=0',
                'set KYTY_LIGHT_DRAIN_STATS=1',
                'set KYTY_DEBUG_SAMPLE_GPU=',
                'set KYTY_DEBUG_DUMP_THREADS=',
                'set KYTY_DEBUG_DRAW_PHASES=',
                'set KYTY_DEBUG_DRAW_STATS=',
                'set KYTY_DEBUG_SPEC_STATS=',
                'set KYTY_DEBUG_STREAM_STATS=',
                'set KYTY_DEBUG_UPLOADS=',
                'set KYTY_GPU_ZONES=',
                '"%~dp0launcher.exe" %*'
            ) | Set-Content "$install/$name" -Encoding ascii
        }

        $maps = Get-ChildItem "_Build/windows" -Filter "kyty_emulator_*.map" -File
        if (-not $maps) { throw "Emulator map missing" }
        foreach ($map in $maps) { Copy-Item $map.FullName $install -Force }

        $pdb = "_Build/windows/kyty_emulator.pdb"
        if (-not (Test-Path $pdb)) { throw "Emulator PDB missing" }
        Copy-Item $pdb $install -Force

        @(
            "AMD base: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9",
            "Prueba-38.cmd: eliminates resource conditions only when successors add no new sources.",
            "Comparacion-38.cmd: same executable, optimization OFF.",
            "Compare the same heavy view three times; report FPS, pauses, and graphics errors.",
            "AMD CPU patch OFF; shader validation OFF; red-zone protection ON.",
            "Copy your working _Patches and select THIS interpreter.",
            "Warm up, then remain in the fixed heavy view for 60 seconds.",
            "Copy Prueba-38 console including source38-plan and source38-plans lines.",
            "Close emulator and launcher completely before changing mode."
        ) | Set-Content "$install/PRUEBA-38.txt" -Encoding ascii

    - name: Create Windows ZIP
      run: |
        $ErrorActionPreference = "Stop"
        $zip = "KytyPS5-Prueba-38.zip"
        Compress-Archive -Path "_Build/windows/install/*" -DestinationPath $zip -Force -ErrorAction Stop
        if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
            throw "Packaging failed: missing or empty ZIP"
        }

    - name: Upload KytyPS5
      uses: actions/upload-artifact@v4
      with:
        name: KytyPS5-Prueba-38
        path: KytyPS5-Prueba-38.zip
        if-no-files-found: error
        retention-days: 7
