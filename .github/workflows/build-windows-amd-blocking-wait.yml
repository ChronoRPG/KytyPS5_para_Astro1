name: Windows AMD - Prueba 16 - Clasificacion de texturas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - AMD base + image specialization cache
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout patches from workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _patch_source
          sparse-checkout: patches
          fetch-depth: 1
          submodules: false

      - name: Verify AMD base
        run: |
          $ErrorActionPreference = "Stop"

          $expected = "4068f4ac886dcd25acc52b6e3fa3e3800dc576a9"
          $actual = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "Could not read source commit"
          }

          if ($actual -ne $expected) {
            throw "Unexpected source commit: $actual"
          }

          Write-Host "AMD base verified: $actual"

      - name: Apply lightweight diagnostics patch
        run: |
          $ErrorActionPreference = "Stop"

          $patch = "_patch_source/patches/KytyPS5_light_drain_stats.patch"

          if (-not (Test-Path $patch)) {
            throw "Missing patch: $patch"
          }

          git apply --ignore-whitespace --check $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Light diagnostics patch does not apply to AMD base"
          }

          git apply --ignore-whitespace $patch
          if ($LASTEXITCODE -ne 0) {
            throw "Light diagnostics patch application failed"
          }

          Write-Host "Light diagnostics patch applied"

      - name: Adapt upstream vertex metadata optimization
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError("Unexpected source: " + path)
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          header = "src/graphics/shader/shaderVertexMetadata.h"
          replace_once(header, "#include <array>", "#include <span>")
          replace_once(header,
              "std::array<ShaderSemantic, ShaderVertexInputInfo::RES_MAX> input_semantics {};",
              "std::span<const ShaderSemantic> input_semantics {};")
          replace_once(header,
              "// Copies the small AGC metadata subset used by the vertex path after validating every guest range.",
              "// Validates vertex metadata and borrows its semantics for immediate draw preparation.")
          source = "src/graphics/shader/shaderVertexMetadata.cpp"
          replace_once(source,
              "\tconst auto semantic_size =\n\t    static_cast<uint64_t>(data.num_input_semantics) * sizeof(ShaderSemantic);\n",
              "")
          replace_once(source,
              "std::memcpy(next.input_semantics.data(), data.input_semantics, semantic_size);",
              "next.input_semantics = {data.input_semantics, data.num_input_semantics};")
          # Keep the existing count and call interface used by this AMD fork.
          # Existing tests still cover range checks and unchanged output on rejection.
          print("Adapted upstream e57c37f: vertex semantics view applied")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Metadata adaptation failed" }

      - name: Apply pinned upstream optimizations
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "https://github.com/KytyPS5/KytyPS5.git"
          $commits = @(
            "a67a033ff88406707f47492a7cdcfef736973d66",
            "f3dc5ee4a9e0725b17bd3e0a4ad1bdbeb0afc8a9"
          )
          foreach ($commit in $commits) {
            git fetch --no-tags --depth=2 $repo $commit
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch $commit" }
            $patch = Join-Path $env:RUNNER_TEMP "$commit.patch"
            git diff --output=$patch "$commit^" $commit -- src
            if ($LASTEXITCODE -ne 0) { throw "Could not generate $commit patch" }
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) { throw "Patch does not apply: $commit" }
            git apply $patch
            if ($LASTEXITCODE -ne 0) { throw "Patch application failed: $commit" }
          }

      - name: Add optional blocking tracking wait
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          p = Path("src/graphics/host_gpu/regionManager.h")
          s = p.read_text(encoding="utf-8")
          def replace_once(old, new):
              global s
              if s.count(old) != 1:
                  raise RuntimeError("Unexpected tracking lock source: " + repr(old))
              s = s.replace(old, new)

          replace_once("#include <atomic>", "#include <atomic>\n#include <cstdlib>\n#include <cstring>")
          replace_once("\t\t\tstd::atomic_signal_fence(std::memory_order_seq_cst);", """\t\t\tif (BlockingWait()) {
          \t\t\t\t// Recheck after waking; test_and_set still acquires ownership.
          \t\t\t\tm_lock.wait(true, std::memory_order_relaxed);
          \t\t\t} else {
          \t\t\t\tstd::atomic_signal_fence(std::memory_order_seq_cst);
          \t\t\t}""")
          replace_once("\t\tm_lock.clear(std::memory_order_release);", """\t\tm_lock.clear(std::memory_order_release);
          \t\tif (BlockingWait()) {
          \t\t\tm_lock.notify_one();
          \t\t}""")
          replace_once("private:\n\tstatic uint32_t CurrentThread() noexcept {", """private:
          \tstatic bool BlockingWait() noexcept {
          \t\tstatic const bool enabled = [] {
          \t\t\tconst char* v = std::getenv("KYTY_TRACKING_BLOCKING_WAIT");
          \t\t\treturn v && std::strcmp(v, "1") == 0;
          \t\t}();
          \t\treturn enabled;
          \t}
          \tstatic uint32_t CurrentThread() noexcept {""")
          p.write_text(s, encoding="utf-8", newline="\n")
          print("Retained optional atomic wait/notify from Prueba 10")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Blocking wait adaptation failed" }

      - name: Adapt shared sampler snapshots
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if s.count(old) != 1:
                  raise RuntimeError('Unexpected source: ' + path + ' ' + repr(old))
              p.write_text(s.replace(old, new), encoding='utf-8', newline='\n')

          header = 'src/graphics/shader/recompiler/ir/ShaderIR.h'
          replace(header, '#include <deque>', '#include <deque>\n#include <cstdlib>\n#include <cstring>')
          replace(header, 'enum class ResourceKind {', '''inline bool SharedSamplerSnapshotsEnabled() noexcept {
              static const bool enabled = [] {
                  const char* value = std::getenv("KYTY_SHARED_SAMPLER_SNAPSHOTS");
                  return value && std::strcmp(value, "1") == 0;
              }();
              return enabled;
          }

          enum class ResourceKind {''')
          replace(header, 'struct SamplerResource {\n\tuint32_t source                = 0;\n\tuint32_t first_use_pc          = 0;\n\tbool     force_point_filtering = false;\n\tbool     depth_compare         = false;', 'struct SamplerResource {\n\tuint32_t source                = 0;\n\tuint32_t first_use_pc          = 0;\n\tbool     force_point_filtering = false;\n\tbool     depth_compare         = false;\n\tuint32_t snapshot_index        = 0;')
          source = 'src/graphics/shader/recompiler/ir/passes/ResourceMaterialization.cpp'
          replace(source, '\tfor (uint32_t index = 0; index < program.info.samplers.size(); index++) {\n\t\tconst auto target = sampler_plan.point_sampler[index];\n\t\tif (target != UINT32_MAX', '\tfor (uint32_t index = 0; !SharedSamplerSnapshotsEnabled() && index < program.info.samplers.size(); index++) {\n\t\tconst auto target = sampler_plan.point_sampler[index];\n\t\tif (target != UINT32_MAX')
          replace(source, '\tsamplers.reserve(sampler_plan.sampler_count);', '''\tsamplers.reserve(sampler_plan.sampler_count);
          \tfor (uint32_t index = 0; index < samplers.size(); index++) {
          \t\tsamplers[index].snapshot_index = index;
          \t}''')
          replace(source, '\t\t\tsampler.force_point_filtering = true;\n\t\t\tsamplers.push_back', '''\t\t\tsampler.force_point_filtering = true;
          \t\t\tsampler.snapshot_index = SharedSamplerSnapshotsEnabled() ? index : target;
          \t\t\tsamplers.push_back''')
          replace('src/graphics/host_gpu/renderer/pipeline/descriptors.cpp', 'NativeSampler(m_context, program, i, snapshot.samplers[i])', 'NativeSampler(m_context, program, i, snapshot.samplers[program.info.samplers[i].snapshot_index])')
          replace('src/graphics/host_gpu/renderer/renderCompute.cpp', 'DecodeNativeDescriptor<ShaderSamplerResource>(resources.samplers[i])', 'DecodeNativeDescriptor<ShaderSamplerResource>(resources.samplers[program.info.samplers[i].snapshot_index])')
          tests = 'tests/ResourceMaterializationTests.cpp'
          replace(tests, 'void TestMixedSamplerDuplicatesTheCorrectSnapshot() {', 'void TestMixedSamplerDuplicatesTheCorrectSnapshot() {\n  using Libs::Graphics::ShaderRecompiler::IR::SamplerResource;\n  const SamplerResource positional {17u, 29u, true, true};\n  Check(positional.source == 17u && positional.first_use_pc == 29u &&\n            positional.force_point_filtering && positional.depth_compare &&\n            positional.snapshot_index == 0u,\n        "sampler sharing changed positional aggregate initialization");')

          replace(tests, '''  Check(snapshot.samplers.size() == 3,
                  "mixed sampler materialization appended unrelated samplers");
            Check(snapshot.samplers[2] == snapshot.samplers[1] &&
                      snapshot.samplers[2] != snapshot.samplers[0],
                  "point sampler variant duplicated the wrong runtime descriptor");''', '''  if (SharedSamplerSnapshotsEnabled()) {
              Check(snapshot.samplers.size() == 2,
                    "shared sampler materialization duplicated a descriptor");
              Check(snapshot.samplers[0] != snapshot.samplers[1],
                    "shared sampler descriptors lost their distinct values");
            } else {
              Check(snapshot.samplers.size() == 3,
                    "mixed sampler materialization appended unrelated samplers");
              Check(snapshot.samplers[2] == snapshot.samplers[1] &&
                        snapshot.samplers[2] != snapshot.samplers[0],
                    "point sampler variant duplicated the wrong runtime descriptor");
            }''')
          replace(tests, "  }\n}\n\n// Guest memory", """  }
            Program program;
            program.resource_tracking_complete = true;
            program.info = plan.info;
            ApplyResourceSpecialization(program, specialization);
            Check(program.info.samplers.size() == 3,
                  "sampler sharing changed the native sampler layout");
            Check(program.info.samplers[0].snapshot_index == 0 &&
                      program.info.samplers[1].snapshot_index == 1 &&
                      program.info.samplers[2].snapshot_index ==
                          (SharedSamplerSnapshotsEnabled() ? 1u : 2u),
                  "native sampler variant selected the wrong snapshot index");
            Check(snapshot.samplers[program.info.samplers[2].snapshot_index] == snapshot.samplers[1],
                  "native point sampler lost its original descriptor");
          }

          // Guest memory""")
          print('Prueba 12: adapted shared sampler snapshots; existing layout checks retained')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Sampler adaptation failed" }

      - name: Adapt color metadata publication
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          p = Path("src/graphics/host_gpu/renderer/cache/textureCache.cpp")
          s = p.read_text(encoding="utf-8")
          old = "\t\t\tm_buffer_cache.FillBuffer(address, slice_size, UINT32_MAX, false);"
          new = """\t\t\tstatic const bool direct_metadata = [] {
          \t\t\t\tconst char* value = std::getenv("KYTY_DIRECT_COLOR_METADATA");
          \t\t\t\treturn value && std::strcmp(value, "1") == 0;
          \t\t\t}();
          \t\t\tif (direct_metadata) {
          \t\t\t\tstd::fill(bytes.begin(), bytes.end(), uint8_t {0xff});
          \t\t\t\tm_buffer_cache.InvalidateMemory(address, slice_size);
          \t\t\t\tLibKernel::Memory::WriteBacking(address, bytes.data(), bytes.size());
          \t\t\t\t// Retain this AMD base's descriptor-read epoch invalidation.
          \t\t\t\tm_scheduler.Context().AdvanceBdaEpochForGpuWrite();
          \t\t\t} else {
          \t\t\t\tm_buffer_cache.FillBuffer(address, slice_size, UINT32_MAX, false);
          \t\t\t}"""
          if s.count(old) != 1:
              raise RuntimeError("Unexpected color metadata source")
          if "#include <cstring>" not in s:
              s = s.replace("#include <cstdlib>", "#include <cstdlib>\n#include <cstring>", 1)
              if "#include <cstring>" not in s:
                  raise RuntimeError("Expected standard includes missing")
          p.write_text(s.replace(old, new), encoding="utf-8", newline="\n")
          print("Prueba 13: adapted upstream 190608a; metadata A/B switch installed")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Metadata publication adaptation failed" }

      - name: Verify patched source
        run: |
          $ErrorActionPreference = "Stop"

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid source diff"
          }

          $config = Get-Content "src/common/emulatorConfig.h" -Raw

          if ($config -notmatch 'gpu_frames_ahead\s*=\s*0\s*;') {
            throw "Expected original gpu_frames_ahead = 0"
          }

          $statsSource = Get-Content `
            "src/graphics/host_gpu/renderer/drainStats.cpp" -Raw

          if (-not $statsSource.Contains("KYTY_LIGHT_DRAIN_STATS")) {
            throw "Light diagnostics patch verification failed"
          }

          git diff --stat

      - name: Add exact descriptor image classification cache
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError('Unexpected source: ' + path + ' ' + repr(old))
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          header = 'src/graphics/shader/recompiler/ir/passes/ResourceMaterialization.h'
          replace(header, '\tstd::vector<uint32_t> key;', '''\t// Same plan ownership as key. Inputs saved before FMASK descriptor remapping.
          \tstd::vector<DescriptorValue> image_inputs;
          \tstd::vector<ResourceSpecialization::Image> image_results;
          \tbool image_cache_initialized = false;
          \tbool image_cache_allowed = false;
          \tuint32_t image_cache_hits = 0;
          \tstd::vector<uint32_t> key;''')
          source = 'src/graphics/shader/recompiler/ir/passes/ResourceMaterialization.cpp'
          replace(source, '#include <cstring>', '#include <cstring>\n#include <cstdlib>')
          replace(source, '''static bool BuildResourceSpecialization(const ResourcePlan& program, ResourceSnapshot& snapshot,
                                                  ResourceSpecialization& specialization) {''', '''static bool BuildResourceSpecialization(const ResourcePlan& program, ResourceSnapshot& snapshot,
                                                  ResourceSpecialization& specialization,
                                                  MaterializationMemo* memo) {
          \tstatic const bool enabled = [] {
          \t\tconst auto* value = std::getenv("KYTY_IMAGE_SPECIALIZATION_CACHE");
          \t\treturn value != nullptr && std::strcmp(value, "1") == 0;
          \t}();
          \tif (memo != nullptr) memo->image_cache_hits = 0;
          \tif (enabled && memo != nullptr && !memo->image_cache_initialized) {
          \t\t// Indirect tables have cross-image dependencies; retain their original path.
          \t\tmemo->image_cache_allowed = !program.info.images.empty() &&
          \t\t    std::ranges::none_of(program.descriptor_sources, [](const auto& source) {
          \t\t        return source.indirect_image.has_value();
          \t\t    });
          \t\tmemo->image_cache_initialized = true;
          \t}
          \tconst bool cache_images = enabled && memo != nullptr && memo->image_cache_allowed &&
          \t    snapshot.images.size() == program.info.images.size() &&
          \t    specialization.images.size() == program.info.images.size();
          \tbool image_cache_changed = false;''')
          replace(source, '''\t\tconst auto& descriptor = snapshot.images[i];
          \t\tauto&       image      = specialization.images[i];''', '''\t\tconst auto& descriptor = snapshot.images[i];
          \t\tauto&       image      = specialization.images[i];
          \t\t// Descriptors are freshly evaluated each refresh. Reuse only their pure
          \t\t// classification, when every descriptor word and width match.
          \t\tif (cache_images && i < memo->image_inputs.size() &&
          \t\t    i < memo->image_results.size() && descriptor == memo->image_inputs[i]) {
          \t\t\timage = memo->image_results[i];
          \t\t\tmemo->image_cache_hits++;
          \t\t\tcontinue;
          \t\t}
          \t\timage_cache_changed = true;''')
          replace(source, '\tImageRemap(specialization).Apply(snapshot.images);', '''\tif (cache_images && image_cache_changed) {
          \t\tmemo->image_inputs = snapshot.images;
          \t\tmemo->image_results = specialization.images;
          \t}
          \tImageRemap(specialization).Apply(snapshot.images);''')
          replace(source, 'BuildResourceSpecialization(program, snapshot, specialization)',
                  'BuildResourceSpecialization(program, snapshot, specialization, memo)')
          print('Prueba 16: exact-descriptor image classification cache; indirect tables unchanged')
          tests = 'tests/ResourceMaterializationTests.cpp'
          new_test = r'''
          void TestImageCacheTracksDescriptorChanges() {
            using namespace Libs::Graphics::ShaderRecompiler::IR;
            using Libs::Graphics::Prospero::BufferFormat;
            using Libs::Graphics::Prospero::ImageType;
            Program program;
            program.stage = Libs::Graphics::ShaderType::Pixel;
            program.srt_plan_complete = true;
            program.resource_tracking_complete = true;
            auto& block = AddValueBlock(program);
            const auto add_source = [&](uint32_t first, uint32_t count) {
              DescriptorSource source;
              source.dword_count = count;
              for (uint32_t i = 0; i < count; ++i) {
                auto& value = block.AppendNewInst(ValueOpcode::GetUserData,
                    {Value(static_cast<ScalarReg>(first + i))});
                source.dwords[i] = Value(&value);
              }
              program.descriptor_sources.push_back(source);
              return static_cast<uint32_t>(program.descriptor_sources.size() - 1);
            };
            const auto buffer = add_source(0, 4);
            const auto image = add_source(4, 8);
            program.info.buffers.push_back({.source = buffer});
            program.info.images.push_back({.source = image,
                .resource_class = ImageResourceClass::Sampled,
                .numeric_class = Libs::Graphics::Prospero::TextureNumericClass::Float,
                .dimension = Libs::Graphics::ShaderRecompiler::Decoder::ImageDimension::Dim2D});
            auto plan = ExtractResourcePlan(program);
            std::array<uint32_t, 12> data {};
            data[4] = 0x1234u;
            data[5] = static_cast<uint32_t>(BufferFormat::k32Float) << 20u;
            data[7] = static_cast<uint32_t>(ImageType::kColor2D) << 28u;
            ResourceSnapshot cached, reference;
            ResourceSpecialization cached_spec, reference_spec;
            MaterializationMemo memo;
            const auto refresh = [&] {
              const SrtRuntime runtime {.user_data = data};
              Check(MaterializeResources(plan, runtime, cached, cached_spec, &memo),
                  "cached image refresh failed");
              Check(MaterializeResources(plan, runtime, reference, reference_spec),
                  "reference image refresh failed");
              Check(cached.buffers == reference.buffers && cached.images == reference.images &&
                  cached.samplers == reference.samplers && cached.flattened_srt == reference.flattened_srt &&
                  cached.user_data == reference.user_data && cached_spec == reference_spec,
                  "image cache changed materialization results");
            };
            refresh();
            data[0]++;
            refresh();
            const auto* env = std::getenv("KYTY_IMAGE_SPECIALIZATION_CACHE");
            const bool enabled = env != nullptr && std::string_view(env) == "1";
            Check(!memo.reused && memo.image_cache_hits == (enabled ? 1u : 0u),
                "unchanged image was not reused independently of the buffer");
            data[5] = static_cast<uint32_t>(BufferFormat::k32UInt) << 20u;
            refresh();
            Check(memo.image_cache_hits == 0u && cached_spec.images[0].numeric_class ==
                Libs::Graphics::Prospero::TextureNumericClass::Uint,
                "image format change was hidden by the cache");
            data[4]++;
            refresh();
            Check(memo.image_cache_hits == 0u, "image address change was hidden");
            data[5] |= 0x20000000u; // Reserved bit: must retain original null sanitization.
            refresh();
            Check(cached.images[0].dwords[0] == 0u, "invalid image was not sanitized");
            data[0]++;
            refresh();
            data[5] = static_cast<uint32_t>(BufferFormat::k32Float) << 20u;
            refresh();
            Check(cached_spec.images[0].numeric_class ==
                Libs::Graphics::Prospero::TextureNumericClass::Float,
                "valid image did not recover after invalid descriptor");
            data[0]++;
            refresh();
          }

          '''
          replace(tests, 'int main() {', new_test + 'int main() {\n  TestImageCacheTracksDescriptorChanges();')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Image specialization cache adaptation failed" }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Install glslang
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{ "User-Agent" = "GitHub-Actions-KytyPS5"; "Accept" = "application/vnd.github+json" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot" -Headers $headers
          $asset = $release.assets | Where-Object {
            $_.name -match "(?i)windows" -and $_.name -match "(?i)(x64|x86_64|amd64)" -and $_.name -match "(?i)\.zip$"
          } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object {
              $_.name -match "(?i)windows" -and $_.name -match "(?i)\.zip$"
            } | Select-Object -First 1
          }
          if (-not $asset) { throw "No Windows glslang ZIP found" }
          $zip = "$env:RUNNER_TEMP/glslang.zip"
          $extract = "$env:RUNNER_TEMP/glslang"
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $validator = Get-ChildItem $extract -Filter "glslangValidator.exe" -Recurse | Select-Object -First 1
          if (-not $validator) {
            $validator = Get-ChildItem $extract -Filter "glslang.exe" -Recurse | Select-Object -First 1
          }
          if (-not $validator) { throw "glslang executable missing" }
          if ($validator.Name -eq "glslang.exe") {
            Copy-Item $validator.FullName (Join-Path $validator.Directory.FullName "glslangValidator.exe") -Force
          }
          Add-Content $env:GITHUB_PATH $validator.Directory.FullName

      - name: Verify glslang
        run: |
          glslangValidator --version

          if ($LASTEXITCODE -ne 0) {
            throw "glslang verification failed"
          }

      - name: Configure CMake
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed"
          }

      - name: Build KytyPS5
        run: |
          cmake `
            --build _Build/windows `
            --target launcher shader_vertex_metadata_tests memory_tracker_tests resource_materialization_tests shader_cfg_tests virtual_memory_allocation_tests `
            --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Test memory and shader paths
        run: |
          $env:KYTY_TRACKING_BLOCKING_WAIT = "1"
          foreach ($mode in @(0, 1)) {
            $env:KYTY_DIRECT_COLOR_METADATA = "1"
            $env:KYTY_IMAGE_SPECIALIZATION_CACHE = "$mode"
            $env:KYTY_SHARED_SAMPLER_SNAPSHOTS = "1"
            ctest --test-dir _Build/windows -R '^(shader_vertex_metadata|memory_tracker|resource_materialization|shader_cfg|virtual_memory_allocation)$' --output-on-failure --no-tests=error
            if ($LASTEXITCODE -ne 0) { throw "Memory or shader tests failed in mode $mode" }
          }
          Remove-Item Env:KYTY_IMAGE_SPECIALIZATION_CACHE
          Remove-Item Env:KYTY_DIRECT_COLOR_METADATA
          Remove-Item Env:KYTY_SHARED_SAMPLER_SNAPSHOTS
          Remove-Item Env:KYTY_TRACKING_BLOCKING_WAIT

      - name: Install KytyPS5
        run: |
          cmake `
            --install _Build/windows `
            --prefix _Build/windows/install

          if ($LASTEXITCODE -ne 0) {
            throw "Install failed"
          }

      - name: Package launchers and symbols
        run: |
          $ErrorActionPreference = "Stop"
          $install = "_Build/windows/install"
          if (-not (Test-Path "$install/launcher.exe")) { throw "launcher.exe missing" }
          foreach ($mode in @(0, 1)) {
            $name = if ($mode -eq 1) { "Prueba-16.cmd" } else { "Comparacion-14.cmd" }
            @(
              '@echo off',
              'setlocal',
              'cd /d "%~dp0"',
              'set KYTY_TRACKING_PAUSE=',
              'set KYTY_BDA_SLICE_FILTER=',
              'set KYTY_TRACKING_DIAGNOSTICS=',
              'set KYTY_ADDRESS_SPACE_DIAGNOSTICS=',
              'set KYTY_TRACKING_BLOCKING_WAIT=1',
              'set KYTY_SHARED_SAMPLER_SNAPSHOTS=1',
              'set KYTY_DIRECT_COLOR_METADATA=1',
              'set KYTY_RECORD_THREAD=0',
              "set KYTY_IMAGE_SPECIALIZATION_CACHE=$mode",
              'set KYTY_DEBUG_QUEUES=',
              'set KYTY_SPECULATE_DRAWS=0',
              'set KYTY_LIGHT_DRAIN_STATS=1',
              'set KYTY_DEBUG_SAMPLE_GPU=',
              'set KYTY_DEBUG_DUMP_THREADS=',
              'set KYTY_DEBUG_DRAW_PHASES=',
              'set KYTY_DEBUG_DRAW_STATS=',
              'set KYTY_DEBUG_SPEC_STATS=',
              'set KYTY_DEBUG_STREAM_STATS=',
              'set KYTY_DEBUG_UPLOADS=',
              'set KYTY_GPU_ZONES=',
              '"%~dp0launcher.exe" %*'
            ) | Set-Content "$install/$name" -Encoding ascii
          }
          $diagnostic = Get-Content "$install/Prueba-16.cmd"
          $diagnostic = $diagnostic -replace '^set KYTY_DEBUG_DRAW_PHASES=$', 'set KYTY_DEBUG_DRAW_PHASES=all'
          $diagnostic | Set-Content "$install/Diagnostico-16.cmd" -Encoding ascii
          $maps = Get-ChildItem "_Build/windows" -Filter "kyty_emulator_*.map" -File
          if (-not $maps) { throw "Emulator map missing" }
          foreach ($map in $maps) { Copy-Item $map.FullName $install -Force }
          $pdb = "_Build/windows/kyty_emulator.pdb"
          if (-not (Test-Path $pdb)) { throw "Emulator PDB missing" }
          Copy-Item $pdb $install -Force
          @(
            "Base AMD: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9",
            "Upstream a67a033 and f3dc5ee retained.",
            "Comparacion-14.cmd: Prueba 14 settings, image classification cache OFF.",
            "Prueba-16.cmd: same settings, image classification cache ON.",
            "Keep AMD CPU patch OFF, shader validation OFF, red-zone protection ON.",
            "Copy your working _Patches; select THIS interpreter.",
            "Close all emulator and launcher processes before switching mode.",
            "No capture required: compare FPS, CPU, freezes and graphics."
          ) | Set-Content "$install/PRUEBA-16.txt" -Encoding ascii

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath "KytyPS5-Windows-AMD-Prueba-16-Texturas.zip" `
            -Force -ErrorAction Stop

          $zip = "KytyPS5-Windows-AMD-Prueba-16-Texturas.zip"
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
            throw "Packaging failed: missing or empty ZIP"
          }

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-AMD-Prueba-16-Texturas
          path: KytyPS5-Windows-AMD-Prueba-16-Texturas.zip
          if-no-files-found: error
          retention-days: 7
