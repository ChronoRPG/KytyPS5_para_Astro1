name: Windows AMD - Diagnostico 27 - Actualizacion de recursos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout pinned working diagnostic 20
        uses: actions/checkout@v4
        with:
          ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
          path: _patch_source
          sparse-checkout: |
            patches
            .github/workflows
          fetch-depth: 1
          submodules: false

      - name: Setup fixed Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin Python executable and install YAML parser
        run: |
          $ErrorActionPreference = "Stop"

          $pythonExe = (
            Get-Command python -CommandType Application |
            Select-Object -First 1
          ).Source

          if (-not $pythonExe) {
            throw "Python executable missing"
          }

          "KYTY_PYTHON=$pythonExe" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & $pythonExe -m pip install PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) {
            throw "YAML parser installation failed"
          }

          & $pythonExe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw "Python YAML verification failed"
          }

      - name: Reproduce working AMD source and retained optimizations
        run: |
          $ErrorActionPreference = "Stop"

          @'
          from pathlib import Path
          import subprocess
          import yaml

          baseline = Path(
              "_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml"
          )
          steps = yaml.safe_load(
              baseline.read_text(encoding="utf-8")
          )["jobs"]["build"]["steps"]

          started = False
          finished = False

          for index, step in enumerate(steps):
              if step.get("name") == "Setup MSVC environment":
                  finished = True
                  break

              if step.get("name") == "Verify AMD base":
                  started = True

              if not started:
                  continue

              if "uses" in step or "run" not in step:
                  raise RuntimeError("Unexpected baseline preparation step")

              script = Path(f"_prepare27_{index}.ps1")
              script.write_text(
                  '$ErrorActionPreference = "Stop"\n' + step["run"],
                  encoding="utf-8"
              )

              print("Preparing:", step["name"], flush=True)
              subprocess.run(
                  ["pwsh", "-NoProfile", "-File", str(script.resolve())],
                  check=True
              )

          if not started or not finished:
              raise RuntimeError("Baseline preparation boundaries missing")
          '@ | & $env:KYTY_PYTHON -

          if ($LASTEXITCODE -ne 0) {
            throw "Baseline preparation failed"
          }

      - name: Add sampled resource refresh diagnostic
        run: |
          $ErrorActionPreference = "Stop"

          @'
          from pathlib import Path

          p = Path(
              "src/graphics/shader/recompiler/ir/passes/ResourceMaterialization.cpp"
          )
          s = p.read_text(encoding="utf-8")

          helper = r"""
          namespace {
          struct Refresh27Stats {
              uint64_t calls = 0, samples = 0, reused = 0;
              std::array<uint64_t, 7> ns {};
              std::chrono::steady_clock::time_point window =
                  std::chrono::steady_clock::now();
          };

          thread_local Refresh27Stats refresh27_stats;

          struct Refresh27Timer {
              using Clock = std::chrono::steady_clock;
              bool sampled = false;
              size_t phase = 0;
              Clock::time_point last;

              Refresh27Timer() {
                  static const bool enabled = [] {
                      const char* v = std::getenv("KYTY_REFRESH_DIAGNOSTIC_27");
                      return v && std::strcmp(v, "1") == 0;
                  }();

                  if (!enabled) return;

                  auto& st = refresh27_stats;
                  const uint64_t sequence = ++st.calls;
                  sampled =
                      ((sequence * 11400714819323198485ull) >> 54u) == 0;

                  if (sampled) last = Clock::now();
              }

              void Next(size_t next) {
                  if (!sampled) return;

                  const auto now = Clock::now();
                  refresh27_stats.ns[phase] += static_cast<uint64_t>(
                      std::chrono::duration_cast<std::chrono::nanoseconds>(
                          now - last
                      ).count()
                  );

                  last = now;
                  phase = next;
              }

              void Reused() {
                  if (sampled) ++refresh27_stats.reused;
              }

              ~Refresh27Timer() {
                  if (!sampled) return;

                  Next(phase);
                  auto& st = refresh27_stats;
                  ++st.samples;

                  const double seconds =
                      std::chrono::duration<double>(last - st.window).count();

                  if (seconds < 5.0) return;

                  uint64_t total = 0;
                  for (auto v : st.ns) total += v;

                  static constexpr const char* names[] = {
                      "active", "flat", "fill", "memo",
                      "descriptors", "specialization", "finish"
                  };

                  std::printf(
                      "refresh27: seconds=%.1f calls=%llu samples=%llu "
                      "memo-reused=%llu sampled-us/refresh=%.3f",
                      seconds,
                      static_cast<unsigned long long>(st.calls),
                      static_cast<unsigned long long>(st.samples),
                      static_cast<unsigned long long>(st.reused),
                      static_cast<double>(total) / 1000.0 /
                          static_cast<double>(st.samples)
                  );

                  for (size_t i = 0; i < 7; ++i) {
                      std::printf(
                          " %s-us=%.3f",
                          names[i],
                          static_cast<double>(st.ns[i]) / 1000.0 /
                              static_cast<double>(st.samples)
                      );
                  }

                  std::printf("\n");
                  std::fflush(stdout);

                  st.calls = st.samples = st.reused = 0;
                  st.ns.fill(0);
                  st.window = last;
              }
          };
          }
          """

          def change(old, new):
              global s
              if s.count(old) != 1:
                  raise RuntimeError(
                      "Unexpected refresh source: " + old[:75]
                  )
              s = s.replace(old, new)

          s = (
              "#include <chrono>\n"
              "#include <cstdio>\n"
              "#include <cstdlib>\n"
              "#include <cstring>\n"
          ) + s

          change(
              "template <typename Roots>\nbool Materialize(",
              helper + "\ntemplate <typename Roots>\nbool Materialize("
          )

          change(
              "\tconst auto active = walker.FindActiveSources();",
              "\tRefresh27Timer timer27;\n"
              "\tconst auto active = walker.FindActiveSources();\n"
              "\ttimer27.Next(1);"
          )

          change(
              "\tsnapshot.uniform_fill = {};",
              "\ttimer27.Next(2);\n"
              "\tsnapshot.uniform_fill = {};"
          )

          change(
              "\tif constexpr (std::is_same_v<Roots, CompiledRoots>) {\n"
              "\t\tif (memo != nullptr) {",
              "\ttimer27.Next(3);\n"
              "\tif constexpr (std::is_same_v<Roots, CompiledRoots>) {\n"
              "\t\tif (memo != nullptr) {"
          )

          change(
              "\t\t\t\tmemo->reused = true;",
              "\t\t\t\ttimer27.Reused();\n"
              "\t\t\t\tmemo->reused = true;"
          )

          change(
              "\tconst auto evaluate = [&](uint32_t source, DescriptorValue& value) {",
              "\ttimer27.Next(4);\n"
              "\tconst auto evaluate = [&](uint32_t source, DescriptorValue& value) {"
          )

          change(
              "\tif (!BuildResourceSpecialization(program, snapshot, specialization)) {",
              "\ttimer27.Next(5);\n"
              "\tif (!BuildResourceSpecialization(program, snapshot, specialization)) {"
          )

          change(
              "\tif constexpr (std::is_same_v<Roots, CompiledRoots>) {\n"
              "\t\tif (memo != nullptr && roots.compiled.memoizable) {",
              "\ttimer27.Next(6);\n"
              "\tif constexpr (std::is_same_v<Roots, CompiledRoots>) {\n"
              "\t\tif (memo != nullptr && roots.compiled.memoizable) {"
          )

          p.write_text(s, encoding="utf-8", newline="\n")
          print("Refresh diagnostic 27: sampled CPU preparation phases")
          '@ | & $env:KYTY_PYTHON -

          if ($LASTEXITCODE -ne 0) {
            throw "Refresh diagnostic adaptation failed"
          }

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid source diff"
          }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Build and test using pinned working workflow
        run: |
          $ErrorActionPreference = "Stop"

          & $env:KYTY_PYTHON -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Python YAML verification failed"
          }

          @'
          from pathlib import Path
          import subprocess
          import os
          import yaml

          baseline = Path(
              "_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml"
          )
          steps = yaml.safe_load(
              baseline.read_text(encoding="utf-8")
          )["jobs"]["build"]["steps"]

          started = False
          finished = False

          for index, step in enumerate(steps):
              if step.get("name") == "Package launchers and symbols":
                  finished = True
                  break

              if step.get("name") == "Install glslang":
                  started = True

              if not started:
                  continue

              if "uses" in step or "run" not in step:
                  raise RuntimeError("Unexpected build step")

              script = Path(f"_build27_{index}.ps1")
              script.write_text(
                  '$ErrorActionPreference = "Stop"\n' + step["run"],
                  encoding="utf-8"
              )

              print("Running:", step["name"], flush=True)

              path_file = Path(os.environ["GITHUB_PATH"])
              entries = (
                  path_file.read_text(encoding="utf-8-sig").splitlines()
                  if path_file.exists() else []
              )
              os.environ["PATH"] = os.pathsep.join(
                  entries + [os.environ["PATH"]]
              )

              subprocess.run(
                  ["pwsh", "-NoProfile", "-File", str(script.resolve())],
                  check=True
              )

          if not started or not finished:
              raise RuntimeError("Build boundaries missing")
          '@ | & $env:KYTY_PYTHON -

          if ($LASTEXITCODE -ne 0) {
            throw "Build or tests failed"
          }

      - name: Package launchers and symbols
        run: |
          $ErrorActionPreference = "Stop"
          $install = "_Build/windows/install"

          if (-not (Test-Path "$install/launcher.exe")) {
            throw "launcher.exe missing"
          }

          foreach ($mode in @(0, 1)) {
            $name = if ($mode -eq 1) {
              "Diagnostico-27.cmd"
            } else {
              "Comparacion-27.cmd"
            }

            @(
              '@echo off',
              'setlocal',
              'cd /d "%~dp0"',
              'set KYTY_TRACKING_PAUSE=',
              'set KYTY_BDA_SLICE_FILTER=',
              'set KYTY_TRACKING_DIAGNOSTICS=',
              'set KYTY_ADDRESS_SPACE_DIAGNOSTICS=',
              'set KYTY_TRACKING_BLOCKING_WAIT=1',
              'set KYTY_SHARED_SAMPLER_SNAPSHOTS=1',
              'set KYTY_DIRECT_COLOR_METADATA=1',
              'set KYTY_RECORD_THREAD=0',
              'set KYTY_IMAGE_SPECIALIZATION_CACHE=',
              'set KYTY_DEBUG_NO_PIXEL_TARGETS=0',
              'set KYTY_DEBUG_SHADER_CPU=0',
              'set KYTY_RESOURCE_BLOCKS_32=0',
              'set KYTY_HOST_PRIORITY_26=0',
              "set KYTY_REFRESH_DIAGNOSTIC_27=$mode",
              'set KYTY_DEBUG_QUEUES=',
              'set KYTY_SRT_STATS=',
              'set KYTY_DEBUG_SRT_RUNS=',
              'set KYTY_VERIFY_SRT=',
              'set KYTY_VERIFY_SPEC=',
              'set KYTY_VERIFY_SPEC_READS=',
              'set KYTY_SPECULATE_DRAWS=0',
              'set KYTY_LIGHT_DRAIN_STATS=1',
              'set KYTY_DEBUG_SAMPLE_GPU=',
              'set KYTY_DEBUG_DUMP_THREADS=',
              'set KYTY_DEBUG_DRAW_PHASES=',
              'set KYTY_DEBUG_DRAW_STATS=',
              'set KYTY_DEBUG_SPEC_STATS=',
              'set KYTY_DEBUG_STREAM_STATS=',
              'set KYTY_DEBUG_UPLOADS=',
              'set KYTY_GPU_ZONES=',
              '"%~dp0launcher.exe" %*'
            ) | Set-Content "$install/$name" -Encoding ascii
          }

          $maps = Get-ChildItem "_Build/windows" `
            -Filter "kyty_emulator_*.map" -File

          if (-not $maps) {
            throw "Emulator map missing"
          }

          foreach ($map in $maps) {
            Copy-Item $map.FullName $install -Force
          }

          $pdb = "_Build/windows/kyty_emulator.pdb"

          if (-not (Test-Path $pdb)) {
            throw "Emulator PDB missing"
          }

          Copy-Item $pdb $install -Force

          @(
            "Base AMD: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9",
            "Comparacion-27.cmd: stable settings, refresh diagnostic OFF.",
            "Diagnostico-27.cmd: sampled resource refresh diagnostic ON.",
            "Keep AMD CPU patch OFF, shader validation OFF, red-zone protection ON.",
            "Copy your working _Patches; select THIS interpreter.",
            "Capture heavy and light views separately for 60 seconds.",
            "Copy the console output containing refresh27 lines."
          ) | Set-Content "$install/DIAGNOSTICO-27.txt" -Encoding ascii

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath "KytyPS5-Windows-AMD-Diagnostico-27-Recursos.zip" `
            -Force `
            -ErrorAction Stop

          $zip = "KytyPS5-Windows-AMD-Diagnostico-27-Recursos.zip"

          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
            throw "Packaging failed: missing or empty ZIP"
          }

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-AMD-Diagnostico-27-Recursos
          path: KytyPS5-Windows-AMD-Diagnostico-27-Recursos.zip
          if-no-files-found: error
          retention-days: 7
