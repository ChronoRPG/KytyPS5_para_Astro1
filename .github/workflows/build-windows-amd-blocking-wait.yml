name: Windows AMD - Prueba 26 - Prioridades de hilos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout pinned working diagnostic 20
        uses: actions/checkout@v4
        with:
          ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
          path: _patch_source
          sparse-checkout: |
            patches
            .github/workflows
          fetch-depth: 1
          submodules: false

      - name: Reproduce working AMD source and retained optimizations
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) {
            throw "YAML parser installation failed"
          }

          @'
          from pathlib import Path
          import subprocess
          import yaml

          baseline = Path(
              "_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml"
          )
          steps = yaml.safe_load(
              baseline.read_text(encoding="utf-8")
          )["jobs"]["build"]["steps"]

          started = False
          finished = False

          for index, step in enumerate(steps):
              if step.get("name") == "Setup MSVC environment":
                  finished = True
                  break

              if step.get("name") == "Verify AMD base":
                  started = True

              if not started:
                  continue

              if "uses" in step or "run" not in step:
                  raise RuntimeError("Unexpected baseline preparation step")

              script = Path(f"_prepare26_{index}.ps1")
              script.write_text(
                  '$ErrorActionPreference = "Stop"\n' + step["run"],
                  encoding="utf-8"
              )

              print("Preparing:", step["name"], flush=True)
              subprocess.run(
                  ["pwsh", "-NoProfile", "-File", str(script.resolve())],
                  check=True
              )

          if not started or not finished:
              raise RuntimeError("Baseline preparation boundaries missing")
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
            throw "Baseline preparation failed"
          }

      - name: Adapt pinned PR 1050 with optional host priorities
        run: |
          $ErrorActionPreference = "Stop"

          git fetch --no-tags https://github.com/KytyPS5/KytyPS5.git f7b0b3b56b45fa59a91efa8f21df14685fbcac87 356568c1bb3055924e14ddd10bb720d3901842d7

          if ($LASTEXITCODE -ne 0) {
            throw "Priority source fetch failed"
          }

          @'
          from pathlib import Path
          import subprocess

          p = Path("src/kernel/pthread.cpp")
          s = p.read_text(encoding="utf-8")

          a = s.index("int PthreadGetPriorityForKernel(Pthread thread) {")
          b = s.index("\nint PthreadGetCurrentPriorityForKernel()", a)
          original = s[a:b]

          patch = Path("_priority26.patch")
          with patch.open("wb") as out:
              subprocess.run(
                  [
                      "git", "diff",
                      "f7b0b3b56b45fa59a91efa8f21df14685fbcac87^",
                      "356568c1bb3055924e14ddd10bb720d3901842d7",
                      "--", "src/kernel/pthread.cpp"
                  ],
                  stdout=out,
                  check=True
              )

          subprocess.run(
              ["git", "apply", "--check", str(patch)],
              check=True
          )
          subprocess.run(
              ["git", "apply", str(patch)],
              check=True
          )

          s = p.read_text(encoding="utf-8")

          def replace(old, new):
              global s
              if s.count(old) != 1:
                  raise RuntimeError(
                      "Unexpected priority source: " + old[:70]
                  )
              s = s.replace(old, new)

          replace(
              "constexpr int GUEST_HOST_PRIORITY_HIGH   = 0;",
              '''static bool HostPriority26Enabled() {
              static const bool enabled = [] {
                  const char* value = std::getenv("KYTY_HOST_PRIORITY_26");
                  return value != nullptr && std::strcmp(value, "1") == 0;
              }();
              return enabled;
          }
          constexpr int GUEST_HOST_PRIORITY_HIGH   = 0;'''
          )

          replace(
              "return GUEST_HOST_PRIORITY_HIGH;",
              "return HostPriority26Enabled() ? GUEST_HOST_PRIORITY_HIGH : +2;"
          )

          replace(
              "return GUEST_HOST_PRIORITY_NORMAL;",
              "return HostPriority26Enabled() ? GUEST_HOST_PRIORITY_NORMAL : 0;"
          )

          replace(
              "return core_bound ? std::max(host - 1, -2) : host;",
              "return HostPriority26Enabled() && core_bound ? std::max(host - 1, -2) : host;"
          )

          old_body = original[
              original.index("{") + 1:original.rfind("}")
          ]

          replace(
              "int PthreadGetPriorityForKernel(Pthread thread) {",
              "int PthreadGetPriorityForKernel(Pthread thread) {\n"
              "#if KYTY_PLATFORM == KYTY_PLATFORM_WINDOWS\n"
              "    if (!HostPriority26Enabled()) {\n"
              + old_body +
              "\n    }\n"
              "#endif\n"
          )

          replace(
              "thread->core_bound = LowerCoreBoundThread(thread->attr->affinity);",
              "if (HostPriority26Enabled()) {\n"
              "\tthread->core_bound = LowerCoreBoundThread(thread->attr->affinity);"
          )

          replace(
              "GuestThreadHostPriority(thread->attr->guest_priority, thread->core_bound));",
              "GuestThreadHostPriority(thread->attr->guest_priority, thread->core_bound));\n"
              "    }"
          )

          s = "#include <cstdlib>\n#include <cstring>\n" + s
          p.write_text(s, encoding="utf-8", newline="\n")

          p = Path("src/graphics/guest_gpu/graphicsRun.cpp")
          s = p.read_text(encoding="utf-8")

          anchor = "#include <algorithm>"
          if s.count(anchor) != 1:
              raise RuntimeError("Unexpected graphics includes")

          s = s.replace(
              anchor,
              '''#if KYTY_PLATFORM == KYTY_PLATFORM_WINDOWS
          #ifndef NOMINMAX
          #define NOMINMAX
          #endif
          #include <windows.h>
          #undef min
          #undef max
          #endif
          #include <cstring>
          ''' + anchor
          )

          anchor = "\tg_gpu_state  = gpu;"
          if s.count(anchor) != 1:
              raise RuntimeError("Unexpected GPU entry")

          s = s.replace(
              anchor,
              anchor + '''
          #if KYTY_PLATFORM == KYTY_PLATFORM_WINDOWS
              const char* priority26 = std::getenv("KYTY_HOST_PRIORITY_26");
              const bool priority26_enabled =
                  priority26 && std::strcmp(priority26, "1") == 0;

              if (priority26_enabled &&
                  !SetThreadPriority(GetCurrentThread(), THREAD_PRIORITY_HIGHEST)) {
                  printf("Prueba 26: GPU thread priority failed, error %lu\\n",
                         GetLastError());
              }

              printf("Prueba 26: host priorities %s\\n",
                     priority26_enabled ? "ON" : "OFF");
          #endif
          '''
          )

          p.write_text(s, encoding="utf-8", newline="\n")
          print("Prueba 26: optional host priorities adapted")
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
            throw "Priority adaptation failed"
          }

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid source diff"
          }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Install glslang
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @{
            "User-Agent" = "GitHub-Actions-KytyPS5"
            "Accept" = "application/vnd.github+json"
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot" `
            -Headers $headers

          $asset = $release.assets | Where-Object {
            $_.name -match "(?i)windows" -and
            $_.name -match "(?i)(x64|x86_64|amd64)" -and
            $_.name -match "(?i)\.zip$"
          } | Select-Object -First 1

          if (-not $asset) {
            $asset = $release.assets | Where-Object {
              $_.name -match "(?i)windows" -and
              $_.name -match "(?i)\.zip$"
            } | Select-Object -First 1
          }

          if (-not $asset) {
            throw "No Windows glslang ZIP found"
          }

          $zip = "$env:RUNNER_TEMP/glslang.zip"
          $extract = "$env:RUNNER_TEMP/glslang"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -Headers $headers `
            -OutFile $zip

          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $validator = Get-ChildItem $extract `
            -Filter "glslangValidator.exe" -Recurse |
            Select-Object -First 1

          if (-not $validator) {
            $validator = Get-ChildItem $extract `
              -Filter "glslang.exe" -Recurse |
              Select-Object -First 1
          }

          if (-not $validator) {
            throw "glslang executable missing"
          }

          if ($validator.Name -eq "glslang.exe") {
            Copy-Item $validator.FullName `
              (Join-Path $validator.Directory.FullName "glslangValidator.exe") `
              -Force
          }

          Add-Content $env:GITHUB_PATH $validator.Directory.FullName

      - name: Verify glslang
        run: |
          glslangValidator --version
          if ($LASTEXITCODE -ne 0) {
            throw "glslang verification failed"
          }

      - name: Configure CMake
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed"
          }

      - name: Build KytyPS5
        run: |
          cmake `
            --build _Build/windows `
            --target launcher shader_vertex_metadata_tests memory_tracker_tests resource_materialization_tests shader_cfg_tests virtual_memory_allocation_tests `
            --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Test memory and shader paths
        run: |
          $env:KYTY_TRACKING_BLOCKING_WAIT = "1"
          $env:KYTY_SHARED_SAMPLER_SNAPSHOTS = "1"

          foreach ($priority in @(0, 1)) {
            $env:KYTY_HOST_PRIORITY_26 = "$priority"

            foreach ($mode in @(0, 1)) {
              $env:KYTY_DIRECT_COLOR_METADATA = "$mode"

              ctest `
                --test-dir _Build/windows `
                -R '^(shader_vertex_metadata|memory_tracker|resource_materialization|shader_cfg|virtual_memory_allocation)$' `
                --output-on-failure `
                --no-tests=error

              if ($LASTEXITCODE -ne 0) {
                throw "Tests failed: priority=$priority metadata=$mode"
              }
            }
          }

          Remove-Item Env:KYTY_HOST_PRIORITY_26
          Remove-Item Env:KYTY_DIRECT_COLOR_METADATA
          Remove-Item Env:KYTY_SHARED_SAMPLER_SNAPSHOTS
          Remove-Item Env:KYTY_TRACKING_BLOCKING_WAIT

      - name: Install KytyPS5
        run: |
          cmake `
            --install _Build/windows `
            --prefix _Build/windows/install

          if ($LASTEXITCODE -ne 0) {
            throw "Install failed"
          }

      - name: Package launchers and symbols
        run: |
          $ErrorActionPreference = "Stop"
          $install = "_Build/windows/install"

          if (-not (Test-Path "$install/launcher.exe")) {
            throw "launcher.exe missing"
          }

          foreach ($mode in @(0, 1)) {
            $name = if ($mode -eq 1) {
              "Prueba-26.cmd"
            } else {
              "Comparacion-26.cmd"
            }

            @(
              '@echo off',
              'setlocal',
              'cd /d "%~dp0"',
              'set KYTY_TRACKING_PAUSE=',
              'set KYTY_BDA_SLICE_FILTER=',
              'set KYTY_TRACKING_DIAGNOSTICS=',
              'set KYTY_ADDRESS_SPACE_DIAGNOSTICS=',
              'set KYTY_TRACKING_BLOCKING_WAIT=1',
              'set KYTY_SHARED_SAMPLER_SNAPSHOTS=1',
              'set KYTY_DIRECT_COLOR_METADATA=1',
              'set KYTY_RECORD_THREAD=0',
              'set KYTY_IMAGE_SPECIALIZATION_CACHE=',
              'set KYTY_DEBUG_NO_PIXEL_TARGETS=0',
              'set KYTY_DEBUG_SHADER_CPU=0',
              'set KYTY_RESOURCE_BLOCKS_32=0',
              "set KYTY_HOST_PRIORITY_26=$mode",
              'set KYTY_DEBUG_QUEUES=',
              'set KYTY_SRT_STATS=',
              'set KYTY_DEBUG_SRT_RUNS=',
              'set KYTY_VERIFY_SRT=',
              'set KYTY_VERIFY_SPEC=',
              'set KYTY_VERIFY_SPEC_READS=',
              'set KYTY_SPECULATE_DRAWS=0',
              'set KYTY_LIGHT_DRAIN_STATS=1',
              'set KYTY_DEBUG_SAMPLE_GPU=',
              'set KYTY_DEBUG_DUMP_THREADS=',
              'set KYTY_DEBUG_DRAW_PHASES=',
              'set KYTY_DEBUG_DRAW_STATS=',
              'set KYTY_DEBUG_SPEC_STATS=',
              'set KYTY_DEBUG_STREAM_STATS=',
              'set KYTY_DEBUG_UPLOADS=',
              'set KYTY_GPU_ZONES=',
              '"%~dp0launcher.exe" %*'
            ) | Set-Content "$install/$name" -Encoding ascii
          }

          $maps = Get-ChildItem "_Build/windows" `
            -Filter "kyty_emulator_*.map" -File

          if (-not $maps) {
            throw "Emulator map missing"
          }

          foreach ($map in $maps) {
            Copy-Item $map.FullName $install -Force
          }

          $pdb = "_Build/windows/kyty_emulator.pdb"

          if (-not (Test-Path $pdb)) {
            throw "Emulator PDB missing"
          }

          Copy-Item $pdb $install -Force

          @(
            "Base AMD: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9",
            "Upstream a67a033 and f3dc5ee retained.",
            "Comparacion-26.cmd: stable settings, new host priorities OFF.",
            "Prueba-26.cmd: same settings, new host priorities ON.",
            "Keep AMD CPU patch OFF, shader validation OFF, red-zone protection ON.",
            "Copy your working _Patches; select THIS interpreter.",
            "Close emulator and launcher before switching mode.",
            "Compare the same heavy view for 60 seconds in each mode."
          ) | Set-Content "$install/PRUEBA-26.txt" -Encoding ascii

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath "KytyPS5-Windows-AMD-Prueba-26-Prioridades.zip" `
            -Force `
            -ErrorAction Stop

          $zip = "KytyPS5-Windows-AMD-Prueba-26-Prioridades.zip"

          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
            throw "Packaging failed: missing or empty ZIP"
          }

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-AMD-Prueba-26-Prioridades
          path: KytyPS5-Windows-AMD-Prueba-26-Prioridades.zip
          if-no-files-found: error
          retention-days: 7
