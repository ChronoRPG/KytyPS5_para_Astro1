name: Windows AMD - Diagnostico 36 - Entradas independientes

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - Diagnostico 36
    runs-on: windows-2022

    env:
      KYTY_FLAGS_36: /clang:-ffp-contract=off
      KYTY_PROFILE_36: Generica

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout fixed AMD base
      uses: actions/checkout@v4
      with:
        ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
        submodules: recursive
        fetch-depth: 1

    - name: Checkout pinned working diagnostic 20
      uses: actions/checkout@v4
      with:
        ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
        path: _patch_source
        sparse-checkout: |
          patches
          .github/workflows
        fetch-depth: 1
        submodules: false

    - name: Setup fixed Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Pin Python executable and install YAML parser
      run: |
        $ErrorActionPreference = "Stop"
        $pythonExe = (Get-Command python -CommandType Application | Select-Object -First 1).Source
        if (-not $pythonExe) { throw "Python executable missing" }
        "KYTY_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        & $pythonExe -m pip install PyYAML==6.0.2
        if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
        & $pythonExe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
        if ($LASTEXITCODE -ne 0) { throw "Python YAML verification failed" }

    - name: Reproduce working AMD source and retained optimizations
      run: |
        $ErrorActionPreference = "Stop"
        & $env:KYTY_PYTHON -m pip install PyYAML==6.0.2
        if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
        @'
        from pathlib import Path
        import subprocess
        import yaml

        baseline = Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml")
        steps = yaml.safe_load(baseline.read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
        started = False
        finished = False

        for index, step in enumerate(steps):
            if step.get("name") == "Setup MSVC environment":
                finished = True
                break
            if step.get("name") == "Verify AMD base":
                started = True
            if not started:
                continue
            if "uses" in step or "run" not in step:
                raise RuntimeError("Unexpected baseline preparation step")
            script = Path(f"_prepare36_{index}.ps1")
            script.write_text('$ErrorActionPreference = "Stop"\n' + step["run"], encoding="utf-8")
            print("Preparing:", step["name"], flush=True)
            subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)

        if not started or not finished:
            raise RuntimeError("Baseline preparation boundaries missing")
        '@ | & $env:KYTY_PYTHON -
        if ($LASTEXITCODE -ne 0) { throw "Baseline preparation failed" }

    - name: Add frozen-input diagnostic and isolation tests
      run: |
        $ErrorActionPreference = "Stop"
        @'
        from pathlib import Path

        Path('src/graphics/shader/recompiler/ir/passes/FrozenResourceInputs36.h').parent.mkdir(parents=True,exist_ok=True)
        Path('src/graphics/shader/recompiler/ir/passes/FrozenResourceInputs36.h').write_text(r'''
        #pragma once
        #include "graphics/shader/recompiler/ir/passes/ResourceMaterialization.h"
        #include <algorithm>
        #include <limits>

        namespace Libs::Graphics::ShaderRecompiler::IR {
        inline thread_local bool t_frozen_probe36 = false;

        // Conservative first subset. Eligibility does not imply a performance gain.
        inline bool FrozenInputsEligible36(const ResourcePlan& plan) {
          if (!plan.compiled || !plan.compiled->memoizable || !plan.srt_plan_complete ||
              !plan.resource_tracking_complete || plan.has_address_writes ||
              plan.uniform_fill.fill.words != 0u) return false;

          if (std::ranges::any_of(plan.clean_flat_slots, [](auto value){return value != 0u;}) ||
              std::ranges::any_of(plan.info.buffers, &BufferResource::written) ||
              std::ranges::any_of(plan.info.images, &ImageResource::written) ||
              std::ranges::any_of(plan.descriptor_sources, [](const auto& source){return source.indirect_image.has_value();}))
            return false;

          for (const auto& node : plan.compiled->nodes) {
            if (node.op == ResourceNode::Op::Select || node.op == ResourceNode::Op::ReadFirstLane ||
                (node.flags & ResourceNode::CleanSlot) != 0u) return false;
          }

          for (size_t i=0; i<plan.compiled->conditions.size(); ++i) {
            if (plan.compiled->conditions[i] != ResourceNode::NoNode &&
                (i >= plan.compiled->direct_conditions.size() || plan.compiled->direct_conditions[i] == 0u))
              return false;
          }
          return true;
        }

        class FrozenResourceInputs36 {
         public:
          bool Capture(const ResourcePlan& plan, const SrtRuntime& source) {
            words.clear(); flat.clear(); valid=false;
            if (!FrozenInputsEligible36(plan) || source.read_memory == nullptr) return false;
            user_data.assign(source.user_data.begin(),source.user_data.end());
            shader_base=source.shader_base;

            CaptureContext context {source,this};
            auto runtime=source;
            runtime.user_data=user_data;
            runtime.userdata=&context;
            runtime.read_memory=CaptureRead;
            runtime.read_memory_block=nullptr;
            runtime.read_specialization_memory=nullptr;
            runtime.specialization_block_reads=false;

            SrtEvaluator evaluator(plan,*plan.compiled,runtime);
            if (!evaluator.RefreshFlatBuffer(flat)) return false;

            std::ranges::sort(words,{},&Word::address);
            size_t kept=0;
            for (const auto& word : words) {
              if (kept != 0u && words[kept-1].address == word.address) {
                if (words[kept-1].value != word.value) return false;
              } else {
                words[kept++]=word;
              }
            }
            words.resize(kept); valid=true;
            return true;
          }

          SrtRuntime Runtime() const {
            return {.user_data=user_data,.shader_base=shader_base,.read_memory=Read,
              .userdata=const_cast<FrozenResourceInputs36*>(this),.read_specialization_memory=Read};
          }

          bool Valid() const {return valid;}
          size_t WordCount() const {return words.size();}

         private:
          struct Word {uint64_t address; uint32_t value;};
          struct CaptureContext {SrtRuntime source; FrozenResourceInputs36* packet;};

          static bool CaptureRead(void* opaque,uint64_t address,std::span<uint32_t> values) {
            auto& ctx=*static_cast<CaptureContext*>(opaque);
            if (values.size()>65536u || ctx.packet->words.size()>65536u-values.size() ||
                values.size_bytes()>std::numeric_limits<uint64_t>::max()-address) return false;
            if (!ctx.source.read_memory(ctx.source.userdata,address,values)) return false;
            for (size_t i=0;i<values.size();++i) ctx.packet->words.push_back({address+i*4u,values[i]});
            return true;
          }

          static bool Read(void* opaque,uint64_t address,std::span<uint32_t> values) {
            const auto& packet=*static_cast<const FrozenResourceInputs36*>(opaque);
            if (!packet.valid || values.size_bytes()>std::numeric_limits<uint64_t>::max()-address) return false;
            for (size_t i=0;i<values.size();++i) {
              const auto at=address+i*4u;
              const auto found=std::ranges::lower_bound(packet.words,at,{},&Word::address);
              if (found==packet.words.end() || found->address!=at) return false;
              values[i]=found->value;
            }
            return true;
          }

          std::vector<Word> words;
          std::vector<uint32_t> user_data,flat;
          uint64_t shader_base=0;
          bool valid=false;
        };
        }
        ''',encoding="utf-8",newline="\n")

        Path('patches/probe36.txt').parent.mkdir(parents=True,exist_ok=True)
        Path('patches/probe36.txt').write_text(r'''
        namespace {
        struct FrozenProbeStats36 {
            uint64_t samples=0, eligible=0, captured=0, failures=0;
            double serial_us=0, capture_us=0, replay_us=0;
        };

        void ProbeFrozenInputs36(const ResourcePlan& plan, const SrtRuntime& runtime, double serial_us) {
            static FrozenProbeStats36 stats;
            static FrozenResourceInputs36 packet;
            static ResourceSnapshot replay,reference;
            static ResourceSpecialization replay_spec,reference_spec;

            ++stats.samples;
            if (FrozenInputsEligible36(plan)) {
                ++stats.eligible;
                const auto begin=std::chrono::steady_clock::now();
                const bool captured=packet.Capture(plan,runtime);
                const auto captured_at=std::chrono::steady_clock::now();

                if (captured) {
                    ++stats.captured;
                    stats.serial_us+=serial_us;
                    stats.capture_us+=std::chrono::duration<double,std::micro>(captured_at-begin).count();

                    const auto frozen=packet.Runtime();
                    const auto replay_begin=std::chrono::steady_clock::now();
                    const bool replay_ok=MaterializeCompiled(plan,frozen,replay,replay_spec,nullptr);
                    const auto replay_end=std::chrono::steady_clock::now();
                    stats.replay_us+=std::chrono::duration<double,std::micro>(replay_end-replay_begin).count();

                    // Compare on the same frozen inputs; never adopt this diagnostic result in the game.
                    const bool reference_ok=MaterializeResourcesReference(plan,frozen,reference,reference_spec);
                    if (!replay_ok || !reference_ok || replay.buffers!=reference.buffers ||
                        replay.images!=reference.images || replay.samplers!=reference.samplers ||
                        replay.user_data!=reference.user_data || replay.flattened_srt!=reference.flattened_srt ||
                        replay.uniform_fill!=reference.uniform_fill || replay_spec!=reference_spec) ++stats.failures;
                } else {
                    ++stats.failures;
                }
            }

            if (stats.samples==1u || stats.samples%64u==0u) {
                const auto n=stats.captured!=0u ? static_cast<double>(stats.captured) : 1.0;
                std::printf("frozen36: samples=%llu eligible=%llu captured=%llu failures=%llu serial-us=%.3f capture-us=%.3f replay-us=%.3f\n",
                    static_cast<unsigned long long>(stats.samples),
                    static_cast<unsigned long long>(stats.eligible),
                    static_cast<unsigned long long>(stats.captured),
                    static_cast<unsigned long long>(stats.failures),
                    stats.serial_us/n,stats.capture_us/n,stats.replay_us/n);
                std::fflush(stdout);
            }
        }
        }
        ''',encoding="utf-8",newline="\n")

        Path('patches/frozen_test36.txt').parent.mkdir(parents=True,exist_ok=True)
        Path('patches/frozen_test36.txt').write_text(r'''
        void TestFrozenInputs36() {
          using namespace Libs::Graphics::ShaderRecompiler::IR;
          SetResourceMaterializationVerification(false);
          const auto plan=MemoPlan(MemoPlanExtra::None,true);
          (void)CompileResourcePlan(plan);
          Check(FrozenInputsEligible36(plan),"simple plan rejected");

          struct Job {FrozenResourceInputs36 input; ResourceSnapshot expected; ResourceSpecialization spec;};
          std::array<std::vector<Job>,2> jobs;

          for(uint32_t stream=0;stream<2;stream++) {
            jobs[stream].resize(128);
            MemoFixture f;
            for(uint32_t step=0;step<128;step++) {
              f.user_data={static_cast<uint32_t>(TableMemory::Base),0u,0u,8u};
              for (uint32_t word=0;word<f.memory.words.size();++word) f.memory.words[word]=0x1000u+word;
              f.memory.words[3]=0;
              f.memory.words[0]=(step+stream*512u)*16u;
              f.memory.words[1]=0x100u+step+stream*512u;
              f.memory.words[4]=(step+stream)&1u;
              f.user_data[2]=0x200u+step+stream*512u;

              const SrtRuntime runtime {.user_data=f.user_data,.read_memory=TableMemory::DirectRead,
                .userdata=&f.memory,.read_specialization_memory=TableMemory::StrictRead};

              auto& job=jobs[stream][step];
              Check(MaterializeResourcesReference(plan,runtime,job.expected,job.spec),"reference failed");
              Check(job.input.Capture(plan,runtime),"freeze failed");
              Check(job.input.Valid() && job.input.WordCount()==5,"capture lost flat inputs");
              f.user_data.fill(0xffffffffu);f.memory.words.fill(0xffffffffu);

              uint32_t missing=0;
              const auto frozen=job.input.Runtime();
              Check(!frozen.read_memory(frozen.userdata,0x40,{&missing,1}),"missing word accepted");
            }
          }

          std::atomic<bool> start=false;
          const auto run=[&](uint32_t stream) {
            t_resource_scratch_slot=stream;
            while(!start.load(std::memory_order_acquire)) std::this_thread::yield();
            ResourceSnapshot out;ResourceSpecialization spec;
            for(uint32_t i=0;i<32768;i++) {
              const auto& job=jobs[stream][i%128];
              Check(MaterializeResources(plan,job.input.Runtime(),out,spec),"frozen replay failed");
              const auto& e=job.expected;
              Check(out.buffers==e.buffers && out.images==e.images && out.samplers==e.samplers &&
                out.user_data==e.user_data && out.flattened_srt==e.flattened_srt &&
                out.uniform_fill==e.uniform_fill && spec==job.spec,"frozen replay differs after source changed");
            }
          };

          std::thread worker([&]{run(1);});
          start.store(true,std::memory_order_release);
          run(0);
          worker.join();
          t_resource_scratch_slot=0;

          for(const auto extra:{MemoPlanExtra::DynamicRead,MemoPlanExtra::MemoryPredicate,MemoPlanExtra::ReadFirstLane}) {
            const auto unsafe=MemoPlan(extra,true);
            (void)CompileResourcePlan(unsafe);
            Check(!FrozenInputsEligible36(unsafe),"unsupported plan accepted");
          }

          MemoFixture f;FrozenResourceInputs36 packet;
          const SrtRuntime runtime {.user_data=f.user_data,.read_memory=TableMemory::DirectRead,
            .userdata=&f.memory,.read_specialization_memory=TableMemory::StrictRead};
          Check(packet.Capture(plan,runtime),"initial capture failed");
          f.user_data[0]=0x40;
          Check(!packet.Capture(plan,runtime) && !packet.Valid(),"failed recapture kept stale valid data");

          std::puts("Frozen input tests: 65536 parallel replays match the pre-mutation reference; unsafe plans and reads rejected");
        }
        ''',encoding="utf-8",newline="\n")

        def replace(path, old, new):
            p=Path(path)
            s=p.read_text(encoding="utf-8")
            if s.count(old)!=1:
                raise RuntimeError("Unexpected frozen input boundary: "+path)
            p.write_text(s.replace(old,new),encoding="utf-8",newline="\n")

        p=Path("src/graphics/shader/recompiler/ir/passes/ResourceMaterialization.cpp")
        p.write_text('#include "graphics/shader/recompiler/ir/passes/FrozenResourceInputs36.h"\n#include <chrono>\n#include <cstdio>\n'+p.read_text(encoding="utf-8"),encoding="utf-8")

        boundary='bool MaterializeResources(const ResourcePlan& program, const SrtRuntime& runtime,'
        replace(str(p),boundary,Path("patches/probe36.txt").read_text(encoding="utf-8")+'\n'+boundary)

        replace(str(p),
            '\tconst bool result = MaterializeCompiled(program, runtime, snapshot, specialization, memo);',
            '''    thread_local uint64_t calls36=0;
            const bool sample36=t_frozen_probe36 && (++calls36%4096u==0u);
            const auto begin36=sample36 ? std::chrono::steady_clock::now() : std::chrono::steady_clock::time_point {};
        \tconst bool result = MaterializeCompiled(program, runtime, snapshot, specialization, memo);
            if (sample36 && result) {
                const auto us=std::chrono::duration<double,std::micro>(std::chrono::steady_clock::now()-begin36).count();
                ProbeFrozenInputs36(program,runtime,us);
            }''')

        p=Path("src/graphics/guest_gpu/graphicsRun.cpp")
        p.write_text('#include "graphics/shader/recompiler/ir/passes/FrozenResourceInputs36.h"\n#include <cstdio>\n#include <cstdlib>\n'+p.read_text(encoding="utf-8"),encoding="utf-8")

        replace(str(p),'\tg_gpu_thread = true;', '''\tg_gpu_thread = true;
            const auto* frozen36=std::getenv("KYTY_FROZEN_DIAGNOSTIC_36");
            ShaderRecompiler::IR::t_frozen_probe36 = frozen36 != nullptr && frozen36[0]=='1' && frozen36[1]=='\\0';
            if (ShaderRecompiler::IR::t_frozen_probe36) {
                std::printf("frozen36: diagnostic active; game results unchanged; sample stride=4096\\n");
                std::fflush(stdout);
            }''')

        p=Path("tests/ResourceMaterializationTests.cpp")
        p.write_text('#include "graphics/shader/recompiler/ir/passes/FrozenResourceInputs36.h"\n#include <atomic>\n#include <thread>\n'+p.read_text(encoding="utf-8"),encoding="utf-8")
        replace(str(p),'int main() {',Path("patches/frozen_test36.txt").read_text(encoding="utf-8")+'\nint main() {\n  TestFrozenInputs36();')

        print("Diagnostic 36 installed; game results remain on the original path",flush=True)
        '@ | & $env:KYTY_PYTHON -
        if ($LASTEXITCODE -ne 0) { throw "Diagnostic 36 adaptation failed" }
        git diff --check
        if ($LASTEXITCODE -ne 0) { throw "Invalid source diff" }

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup Clang
      uses: egor-tensin/setup-clang@v1
      with:
        version: 18
        platform: x64
        cygwin: 0

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v5

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.3
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: qt5compat
        cache: true

    - name: Build and test using pinned working workflow
      run: |
        $ErrorActionPreference = "Stop"
        & $env:KYTY_PYTHON -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
        if ($LASTEXITCODE -ne 0) { throw "Pinned Python YAML verification failed" }
        @'
        from pathlib import Path
        import subprocess
        import os
        import yaml

        steps = yaml.safe_load(Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml").read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
        started = False
        finished = False

        for index, step in enumerate(steps):
            if step.get("name") == "Package launchers and symbols":
                finished = True
                break
            if step.get("name") == "Install glslang":
                started = True
            if not started:
                continue
            if "uses" in step or "run" not in step:
                raise RuntimeError("Unexpected build step")

            if step["name"] == "Configure CMake":
                flags = os.environ["KYTY_FLAGS_36"]
                args = ["cmake", "-S", ".", "-B", "_Build/windows", "-G", "Ninja",
                        "-DCMAKE_BUILD_TYPE=Release", "-DCMAKE_C_COMPILER=clang-cl",
                        "-DCMAKE_CXX_COMPILER=clang-cl",
                        "-DCMAKE_PREFIX_PATH=" + os.environ["QT_ROOT_DIR"],
                        "-DCMAKE_C_FLAGS_INIT=" + flags, "-DCMAKE_CXX_FLAGS_INIT=" + flags,
                        "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"]

                print("Configuring profile:", os.environ["KYTY_PROFILE_36"], flags, flush=True)
                subprocess.run(args, check=True)

                cache = Path("_Build/windows/CMakeCache.txt").read_text(encoding="utf-8")
                cpp_flags = next((line.split("=", 1)[1] for line in cache.splitlines()
                                  if line.startswith("CMAKE_CXX_FLAGS:STRING=")), None)

                if cpp_flags is None or "/ehsc" not in cpp_flags.lower():
                    raise RuntimeError("CMake lost /EHsc: C++ exceptions must remain enabled")
                if not all(option in cpp_flags for option in flags.split()):
                    raise RuntimeError("Selected CPU flags are missing from CMAKE_CXX_FLAGS")

                print("Verified C++ flags:", cpp_flags, flush=True)
                continue

            script = Path(f"_build36_{index}.ps1")
            script.write_text('$ErrorActionPreference = "Stop"\n' + step["run"], encoding="utf-8")
            print("Running:", step["name"], flush=True)

            path_file = Path(os.environ["GITHUB_PATH"])
            entries = path_file.read_text(encoding="utf-8-sig").splitlines() if path_file.exists() else []
            os.environ["PATH"] = os.pathsep.join(entries + [os.environ["PATH"]])

            subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)

        if not started or not finished:
            raise RuntimeError("Build boundaries missing")
        '@ | & $env:KYTY_PYTHON -
        if ($LASTEXITCODE -ne 0) { throw "Build or tests failed" }

    - name: Package launchers and symbols
      run: |
        $ErrorActionPreference = "Stop"
        $install = "_Build/windows/install"
        if (-not (Test-Path "$install/launcher.exe")) { throw "launcher.exe missing" }

        foreach ($mode in @(0, 1)) {
            $name = if ($mode -eq 1) { "Diagnostico-36.cmd" } else { "Comparacion-36.cmd" }
            @(
                '@echo off',
                'setlocal',
                'cd /d "%~dp0"',
                "set KYTY_FROZEN_DIAGNOSTIC_36=$mode",
                'set KYTY_DESCRIPTOR_MEMO_35=0',
                'set KYTY_DESCRIPTOR_STATS_35=0',
                'set KYTY_DESCRIPTOR_RECIPES_34=0',
                'set KYTY_TRACKING_PAUSE=',
                'set KYTY_BDA_SLICE_FILTER=',
                'set KYTY_TRACKING_DIAGNOSTICS=',
                'set KYTY_ADDRESS_SPACE_DIAGNOSTICS=',
                'set KYTY_TRACKING_BLOCKING_WAIT=1',
                'set KYTY_SHARED_SAMPLER_SNAPSHOTS=1',
                'set KYTY_DIRECT_COLOR_METADATA=1',
                'set KYTY_RECORD_THREAD=0',
                'set KYTY_IMAGE_SPECIALIZATION_CACHE=',
                'set KYTY_DEBUG_NO_PIXEL_TARGETS=0',
                'set KYTY_DEBUG_SHADER_CPU=0',
                'set KYTY_RESOURCE_BLOCKS_32=0',
                'set KYTY_HOST_PRIORITY_26=0',
                'set KYTY_REFRESH_DIAGNOSTIC_27=0',
                'set KYTY_SRT_ALIASES_32=0',
                'set KYTY_DIRECT_FLAT_31=0',
                'set KYTY_DIRECT_INPUTS_29=0',
                'set KYTY_ACTIVE_MASK_VIEW_28=0',
                'set KYTY_DEBUG_QUEUES=',
                'set KYTY_SRT_STATS=',
                'set KYTY_DEBUG_SRT_RUNS=',
                'set KYTY_VERIFY_SRT=',
                'set KYTY_VERIFY_SPEC=',
                'set KYTY_VERIFY_SPEC_READS=',
                'set KYTY_SPECULATE_DRAWS=0',
                'set KYTY_LIGHT_DRAIN_STATS=1',
                'set KYTY_DEBUG_SAMPLE_GPU=',
                'set KYTY_DEBUG_DUMP_THREADS=',
                'set KYTY_DEBUG_DRAW_PHASES=',
                'set KYTY_DEBUG_DRAW_STATS=',
                'set KYTY_DEBUG_SPEC_STATS=',
                'set KYTY_DEBUG_STREAM_STATS=',
                'set KYTY_DEBUG_UPLOADS=',
                'set KYTY_GPU_ZONES=',
                '"%~dp0launcher.exe" %*'
            ) | Set-Content "$install/$name" -Encoding ascii
        }

        $maps = Get-ChildItem "_Build/windows" -Filter "kyty_emulator_*.map" -File
        if (-not $maps) { throw "Emulator map missing" }
        foreach ($map in $maps) { Copy-Item $map.FullName $install -Force }

        $pdb = "_Build/windows/kyty_emulator.pdb"
        if (-not (Test-Path $pdb)) { throw "Emulator PDB missing" }
        Copy-Item $pdb $install -Force

        @(
            "AMD base: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9",
            "Diagnostico-36.cmd: samples frozen inputs; diagnostic results are never adopted.",
            "Comparacion-36.cmd: same executable, diagnostic OFF.",
            "This is a measurement build, not a parallel rendering or FPS improvement build.",
            "AMD CPU patch OFF; shader validation OFF; red-zone protection ON.",
            "Copy your working _Patches and select THIS interpreter.",
            "Warm up, then remain in the fixed heavy view for 60 seconds.",
            "Copy console output including frozen36 lines.",
            "Close emulator and launcher completely before changing mode."
        ) | Set-Content "$install/DIAGNOSTICO-36.txt" -Encoding ascii

    - name: Create Windows ZIP
      run: |
        $ErrorActionPreference = "Stop"
        $zip = "KytyPS5-Diagnostico-36.zip"
        Compress-Archive -Path "_Build/windows/install/*" -DestinationPath $zip -Force -ErrorAction Stop
        if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
            throw "Packaging failed: missing or empty ZIP"
        }

    - name: Upload KytyPS5
