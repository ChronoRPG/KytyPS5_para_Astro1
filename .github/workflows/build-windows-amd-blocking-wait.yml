name: Windows AMD - Prueba 23 - Lecturas de recursos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout pinned working diagnostic 20
        uses: actions/checkout@v4
        with:
          ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
          path: _patch_source
          sparse-checkout: |
            patches
            .github/workflows
          fetch-depth: 1
          submodules: false

      - name: Reproduce working AMD source and retained optimizations
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) {
            throw "YAML parser installation failed"
          }

          @'
          from pathlib import Path
          import subprocess
          import yaml

          baseline = Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml")
          steps = yaml.safe_load(baseline.read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
          started = False
          finished = False

          for index, step in enumerate(steps):
              if step.get("name") == "Setup MSVC environment":
                  finished = True
                  break
              if step.get("name") == "Verify AMD base":
                  started = True
              if not started:
                  continue
              if "uses" in step or "run" not in step:
                  raise RuntimeError("Unexpected baseline preparation step")

              script = Path(f"_prepare23_{index}.ps1")
              script.write_text(
                  '$ErrorActionPreference = "Stop"\n' + step["run"],
                  encoding="utf-8"
              )
              print("Preparing:", step["name"], flush=True)
              subprocess.run(
                  ["pwsh", "-NoProfile", "-File", str(script.resolve())],
                  check=True
              )

          if not started or not finished:
              raise RuntimeError("Baseline preparation boundaries missing")
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
            throw "Baseline preparation failed"
          }

      - name: Add optional 32 block resource cache
        run: |
          $ErrorActionPreference = "Stop"

          @'
          from pathlib import Path

          p = Path("src/graphics/shader/recompiler/ir/passes/ResourceMaterialization.cpp")
          s = p.read_text(encoding="utf-8")

          old = "class OrdinaryBlockCache {"
          if s.count(old) != 1:
              raise RuntimeError("Unexpected cache source")
          s = s.replace(old, "template <uint32_t Capacity = 8>\n" + old)

          a = s.index("template <uint32_t Capacity = 8>\nclass OrdinaryBlockCache {")
          b = s.index("\nSrtRuntime ObservedRuntime", a)
          section = s[a:b]
          old = "\tstatic constexpr uint32_t Capacity   = 8;\n"
          if section.count(old) != 1:
              raise RuntimeError("Capacity missing")
          s = s[:a] + section.replace(old, "") + s[b:]

          a = s.index("\t\tOrdinaryBlockCache ordinary(clean_source);")
          b = s.index("\n\t}", a)
          body = s[a:b]
          if body.count("result = Materialize(") != 1:
              raise RuntimeError("Refresh body changed")

          body = body.replace(
              "OrdinaryBlockCache ordinary",
              "OrdinaryBlockCache<Capacity> ordinary"
          )
          body = body.replace("result = Materialize(", "return Materialize(")

          new = "\t\tconst auto execute = [&]<uint32_t Capacity>() {\n"
          new += "\n".join("\t" + line for line in body.splitlines())
          new += "\n\t\t};\n"
          new += """        static const bool larger_blocks = [] {
                      const char* value = std::getenv("KYTY_RESOURCE_BLOCKS_32");
                      return value && std::strcmp(value, "1") == 0;
                  }();
                  const bool use_larger = larger_blocks && !capture_reads &&
                      runtime.read_memory != nullptr && runtime.read_memory_block != nullptr;
                  result = use_larger ? execute.template operator()<32>()
                                      : execute.template operator()<8>();"""

          s = s[:a] + new + s[b:]
          p.write_text(s, encoding="utf-8", newline="\n")
          print("Prueba 23: optional 32-block cache, fresh for every refresh")

          p = Path("tests/ResourceMaterializationTests.cpp")
          s = p.read_text(encoding="utf-8")
          old = "int main() {"
          if s.count(old) != 1:
              raise RuntimeError("Unexpected test main")

          new = r"""void TestOrdinaryBlocksKeepFreshReads() {
            using namespace Libs::Graphics::ShaderRecompiler::IR;
            struct Memory {
              TableMemory table;
              bool reject_block = false;
              uint32_t block_reads = 0;
              static bool Exact(void* data, uint64_t address, std::span<uint32_t> values) {
                return TableMemory::Read(&static_cast<Memory*>(data)->table, address, values);
              }
              static bool Whole(void* data, uint64_t address, std::span<uint32_t> values) {
                auto& self = *static_cast<Memory*>(data);
                self.block_reads++;
                return !self.reject_block && Exact(data, address, values);
              }
            } memory;
            const auto plan = SrtPlan(TableMemory::Base);
            const SrtRuntime runtime {
              .read_memory = Memory::Exact,
              .userdata = &memory,
              .read_memory_block = Memory::Whole,
            };
            ResourceSnapshot snapshot;
            ResourceSpecialization specialization;
            const auto refresh = [&] {
              Check(MaterializeResources(plan, runtime, snapshot, specialization),
                    "ordinary block refresh failed");
              Check(snapshot.flattened_srt[0] == memory.table.words[0],
                    "ordinary block cache reused data from an earlier refresh");
            };
            memory.table.words[0] = 17;
            refresh();
            Check(memory.block_reads != 0, "ordinary block reader was bypassed");
            memory.table.words[0] = 29;
            refresh();
            memory.reject_block = true;
            memory.table.words[0] = 41;
            refresh();
          }

          int main() {
            TestOrdinaryBlocksKeepFreshReads();"""

          s = s.replace(old, new)
          p.write_text(s, encoding="utf-8", newline="\n")
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
            throw "Resource block adaptation failed"
          }

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid source diff"
          }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Install glslang
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            "User-Agent" = "GitHub-Actions-KytyPS5"
            "Accept" = "application/vnd.github+json"
          }

          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot" -Headers $headers
          $asset = $release.assets | Where-Object {
            $_.name -match "(?i)windows" -and $_.name -match "(?i)(x64|x86_64|amd64)" -and $_.name -match "(?i)\.zip$"
          } | Select-Object -First 1

          if (-not $asset) {
            $asset = $release.assets | Where-Object {
              $_.name -match "(?i)windows" -and $_.name -match "(?i)\.zip$"
            } | Select-Object -First 1
          }

          if (-not $asset) {
            throw "No Windows glslang ZIP found"
          }

          $zip = "$env:RUNNER_TEMP/glslang.zip"
          $extract = "$env:RUNNER_TEMP/glslang"

          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $validator = Get-ChildItem $extract -Filter "glslangValidator.exe" -Recurse | Select-Object -First 1
          if (-not $validator) {
            $validator = Get-ChildItem $extract -Filter "glslang.exe" -Recurse | Select-Object -First 1
          }

          if (-not $validator) {
            throw "glslang executable missing"
          }

          if ($validator.Name -eq "glslang.exe") {
            Copy-Item $validator.FullName (Join-Path $validator.Directory.FullName "glslangValidator.exe") -Force
          }

          Add-Content $env:GITHUB_PATH $validator.Directory.FullName

      - name: Verify glslang
        run: |
          glslangValidator --version
          if ($LASTEXITCODE -ne 0) {
            throw "glslang verification failed"
          }

      - name: Configure CMake
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed"
          }

      - name: Build KytyPS5
        run: |
          cmake `
            --build _Build/windows `
            --target launcher shader_vertex_metadata_tests memory_tracker_tests resource_materialization_tests shader_cfg_tests virtual_memory_allocation_tests `
            --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Test memory and shader paths
        run: |
          $env:KYTY_TRACKING_BLOCKING_WAIT = "1"
          $env:KYTY_SHARED_SAMPLER_SNAPSHOTS = "1"

          foreach ($blocks in @(0, 1)) {
            $env:KYTY_RESOURCE_BLOCKS_32 = "$blocks"

            foreach ($mode in @(0, 1)) {
              $env:KYTY_DIRECT_COLOR_METADATA = "$mode"

              ctest --test-dir _Build/windows -R '^(shader_vertex_metadata|memory_tracker|resource_materialization|shader_cfg|virtual_memory_allocation)$' --output-on-failure --no-tests=error

              if ($LASTEXITCODE -ne 0) {
                throw "Tests failed: blocks=$blocks metadata=$mode"
              }
            }
          }

          Remove-Item Env:KYTY_RESOURCE_BLOCKS_32
          Remove-Item Env:KYTY_DIRECT_COLOR_METADATA
          Remove-Item Env:KYTY_SHARED_SAMPLER_SNAPSHOTS
          Remove-Item Env:KYTY_TRACKING_BLOCKING_WAIT

      - name: Install KytyPS5
        run: |
          cmake `
            --install _Build/windows `
            --prefix _Build/windows/install

          if ($LASTEXITCODE -ne 0) {
            throw "Install failed"
          }

      - name: Package launchers and symbols
        run: |
          $ErrorActionPreference = "Stop"
          $install = "_Build/windows/install"

          if (-not (Test-Path "$install/launcher.exe")) {
            throw "launcher.exe missing"
          }

          foreach ($mode in @(0, 1)) {
            $name = if ($mode -eq 1) { "Prueba-23.cmd" } else { "Comparacion-14.cmd" }

            @(
              '@echo off',
              'setlocal',
              'cd /d "%~dp0"',
              'set KYTY_TRACKING_PAUSE=',
              'set KYTY_BDA_SLICE_FILTER=',
              'set KYTY_TRACKING_DIAGNOSTICS=',
              'set KYTY_ADDRESS_SPACE_DIAGNOSTICS=',
              'set KYTY_TRACKING_BLOCKING_WAIT=1',
              'set KYTY_SHARED_SAMPLER_SNAPSHOTS=1',
              'set KYTY_DIRECT_COLOR_METADATA=1',
              'set KYTY_RECORD_THREAD=0',
              'set KYTY_IMAGE_SPECIALIZATION_CACHE=',
              'set KYTY_DEBUG_NO_PIXEL_TARGETS=0',
              'set KYTY_DEBUG_SHADER_CPU=0',
              "set KYTY_RESOURCE_BLOCKS_32=$mode",
              'set KYTY_DEBUG_QUEUES=',
              'set KYTY_SRT_STATS=',
              'set KYTY_DEBUG_SRT_RUNS=',
              'set KYTY_VERIFY_SRT=',
              'set KYTY_VERIFY_SPEC=',
              'set KYTY_VERIFY_SPEC_READS=',
              'set KYTY_SPECULATE_DRAWS=0',
              'set KYTY_LIGHT_DRAIN_STATS=1',
              'set KYTY_DEBUG_SAMPLE_GPU=',
              'set KYTY_DEBUG_DUMP_THREADS=',
              'set KYTY_DEBUG_DRAW_PHASES=',
              'set KYTY_DEBUG_DRAW_STATS=',
              'set KYTY_DEBUG_SPEC_STATS=',
              'set KYTY_DEBUG_STREAM_STATS=',
              'set KYTY_DEBUG_UPLOADS=',
              'set KYTY_GPU_ZONES=',
              '"%~dp0launcher.exe" %*'
            ) | Set-Content "$install/$name" -Encoding ascii
          }

          $maps = Get-ChildItem "_Build/windows" -Filter "kyty_emulator_*.map" -File
          if (-not $maps) {
            throw "Emulator map missing"
          }

          foreach ($map in $maps) {
            Copy-Item $map.FullName $install -Force
          }

          $pdb = "_Build/windows/kyty_emulator.pdb"
          if (-not (Test-Path $pdb)) {
            throw "Emulator PDB missing"
          }
          Copy-Item $pdb $install -Force

          @(
            "Base AMD: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9",
            "Comparacion-14.cmd: original 8-block cache.",
            "Prueba-23.cmd: 32-block cache.",
            "Diagnostic counters OFF in both modes.",
            "AMD CPU patch OFF; shader validation OFF; red-zone protection ON.",
            "Copy your working _Patches and select THIS interpreter.",
            "Close emulator and launcher before changing mode.",
            "Compare the same heavy view for 60 seconds in each mode."
          ) | Set-Content "$install/PRUEBA-23.txt" -Encoding ascii

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath "KytyPS5-Windows-AMD-Prueba-23-Recursos.zip" `
            -Force -ErrorAction Stop

          $zip = "KytyPS5-Windows-AMD-Prueba-23-Recursos.zip"
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
            throw "Packaging failed: missing or empty ZIP"
          }

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-AMD-Prueba-23-Recursos
          path: KytyPS5-Windows-AMD-Prueba-23-Recursos.zip
          if-no-files-found: error
          retention-days: 7
