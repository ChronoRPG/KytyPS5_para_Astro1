name: Windows AMD - Diagnostico 48 - Reutilizacion de texturas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - Diagnostico 48
    runs-on: windows-2022
    env:
      KYTY_FLAGS_48: /clang:-ffp-contract=off
      KYTY_PROFILE_48: Generica
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout pinned working diagnostic 20
        uses: actions/checkout@v4
        with:
          ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
          path: _patch_source
          sparse-checkout: |-
            patches
            .github/workflows
          fetch-depth: 1
          submodules: false

      - name: Setup fixed Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin Python executable and install YAML parser
        run: |
          $ErrorActionPreference = "Stop"
          $pythonExe = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          if (-not $pythonExe) { throw "Python executable missing" }
          "KYTY_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $pythonExe -m pip install PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
          & $pythonExe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Python YAML verification failed" }

      - name: Reproduce working AMD source and retained optimizations
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON -m pip install PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
          @'
          from pathlib import Path
          import subprocess
          import yaml
          baseline = Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml")
          steps = yaml.safe_load(baseline.read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
          started = False
          finished = False
          for index, step in enumerate(steps):
              if step.get("name") == "Setup MSVC environment":
                  finished = True
                  break
              if step.get("name") == "Verify AMD base":
                  started = True
              if not started:
                  continue
              if "uses" in step or "run" not in step:
                  raise RuntimeError("Unexpected baseline preparation step")
              script = Path(f"_prepare48_{index}.ps1")
              script.write_text('$ErrorActionPreference = "Stop"\n' + step["run"], encoding="utf-8")
              print("Preparing:", step["name"], flush=True)
              subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
          if not started or not finished:
              raise RuntimeError("Baseline preparation boundaries missing")
          '@ | & $env:KYTY_PYTHON -
          if ($LASTEXITCODE -ne 0) { throw "Baseline preparation failed" }

      - name: Add texture reuse counters
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          def replace(path,old,new):
           p=Path(path);s=p.read_text(encoding='utf-8')
           if s.count(old)!=1:raise RuntimeError('Unexpected textures48 boundary: '+path)
           p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')

          header=r'''#pragma once
          #include <array>
          #include <chrono>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <cstdint>
          namespace TextureDiagnostic48 {
          inline bool Enabled() {
           static const bool enabled=[]{const char* v=std::getenv("KYTY_TEXTURE_REUSE_48");return v!=nullptr && std::strcmp(v,"1")==0;}();
           return enabled;
          }
          struct Counters {
           std::array<uint64_t,11> prepare {},recheck {};
           uint64_t stages=0,checks=0;
           void Prepare(uint32_t reason){++stages;++prepare[reason];}
           void Recheck(uint32_t reason){++checks;++recheck[reason];}
          };
          inline void Record(bool second,uint32_t reason,bool has_images) {
           if (!has_images) return;
           static thread_local Counters stats;
           static thread_local auto start=std::chrono::steady_clock::now();
           static thread_local uint64_t poll=0;
           if(second) stats.Recheck(reason);else stats.Prepare(reason);
           if ((++poll&1023u)!=0u) return;
           const auto now=std::chrono::steady_clock::now();
           const auto seconds=std::chrono::duration<double>(now-start).count();
           if(seconds<5.0) return;
           constexpr std::array names {"kept","disabled","no-group","program","descriptors","image-set","tick","gc-tick","association","dirty","color-clear"};
           std::printf("texture48: %.2fs stages-with-images=%llu rechecks=%llu\n",seconds,(unsigned long long)stats.stages,(unsigned long long)stats.checks);
           for(uint32_t phase=0;phase<2u;++phase) {
            const auto& counts=phase==0u ? stats.prepare : stats.recheck;
            std::printf("texture48-%s:",phase==0u ? "prepare" : "recheck");
            for(uint32_t i=0;i<counts.size();++i) std::printf(" %s=%llu",names[i],(unsigned long long)counts[i]);
            std::printf("\n");
           }
           std::fflush(stdout);stats={};start=now;
          }
          }
          '''
          Path('src/graphics/host_gpu/renderer/pipeline/textureDiagnostic48.h').write_text(header)
          p='src/graphics/host_gpu/renderer/pipeline/descriptors.cpp'
          f=Path(p)
          f.write_text('#include "graphics/host_gpu/renderer/pipeline/textureDiagnostic48.h"\n'+f.read_text())

          replace(p,'static bool ImageGroupStands(TextureCache& cache, const PreparedBindings& prepared) {','static bool ImageGroupStands(TextureCache& cache, const PreparedBindings& prepared, uint32_t* reason48=nullptr) {')

          replace(p,'\tif (!(prepared.image_group.state == cache.CurrentTargetState())) {\n\t\treturn false;\n\t}',r'''    const auto current48=cache.CurrentTargetState();
              const auto& previous48=prepared.image_group.state;
              if (!(previous48==current48)) {
                  if(reason48!=nullptr) *reason48=previous48.image_set!=current48.image_set ? 5u : previous48.tick!=current48.tick ? 6u : 7u;
                  return false;
              }''')

          replace(p,'\t\tif ((depth ? depth : source.found) != bound || !cache.IsTextureClean(bound) ||\n\t\t    !cache.IsColorClearCurrent(source.found, prepared.images[i].desc,\n\t\t                               source.metadata_base_layer)) {\n\t\t\treturn false;\n\t\t}',r'''        if ((depth ? depth : source.found)!=bound) {
                      if(reason48!=nullptr) *reason48=8u;
                      return false;
                  }
                  if(!cache.IsTextureClean(bound)) {
                      if(reason48!=nullptr) *reason48=9u;
                      return false;
                  }
                  if(!cache.IsColorClearCurrent(source.found,prepared.images[i].desc,source.metadata_base_layer)) {
                      if(reason48!=nullptr) *reason48=10u;
                      return false;
                  }''')

          replace(p,'\tprepared.image_group_kept =\n\t    ImageGroupsEnabled() && group.program == &program &&\n\t    std::ranges::equal(snapshot.images, group.images) && ImageGroupStands(texture_cache, prepared);',r'''    if (!TextureDiagnostic48::Enabled()) {
                  prepared.image_group_kept=ImageGroupsEnabled() && group.program==&program &&
                      std::ranges::equal(snapshot.images,group.images) && ImageGroupStands(texture_cache,prepared);
              } else {
                  uint32_t reason48=0;
                  if(!ImageGroupsEnabled()) reason48=1;
                  else if(group.program!=&program) reason48=group.program==nullptr ? 2u : 3u;
                  else if(!std::ranges::equal(snapshot.images,group.images)) reason48=4;
                  else ImageGroupStands(texture_cache,prepared,&reason48);
                  prepared.image_group_kept=reason48==0u;
                  TextureDiagnostic48::Record(false,reason48,!program.info.images.empty());
              }''')

          replace(p,'\tif (group_kept && ImageGroupStands(texture_cache, prepared)) {',r'''    uint32_t recheck48=0;
              const bool diagnostic48=TextureDiagnostic48::Enabled();
              const bool stands48=group_kept && ImageGroupStands(texture_cache,prepared,diagnostic48 ? &recheck48 : nullptr);
              if(diagnostic48 && group_kept) TextureDiagnostic48::Record(true,recheck48,!program.info.images.empty());
              if (stands48) {''')

          p='src/graphics/guest_gpu/graphicsRun.cpp'
          f=Path(p)
          f.write_text('#include "graphics/host_gpu/renderer/pipeline/textureDiagnostic48.h"\n'+f.read_text())
          replace(p,'\tg_gpu_thread = true;',r'''    g_gpu_thread = true;
              if(TextureDiagnostic48::Enabled()) {
                  std::printf("texture48: diagnostic active; original checks retained\n");
                  std::fflush(stdout);
              }''')

          for name in [
              'src/graphics/host_gpu/renderer/pipeline/descriptors.cpp',
              'src/graphics/guest_gpu/graphicsRun.cpp',
          ]:
           f=Path(name)
           f.write_text('\n'.join(x.rstrip(' \t') for x in f.read_text().splitlines())+'\n')
          print('Texture reuse diagnostic48 installed')

          '@ | & $env:KYTY_PYTHON -
          if ($LASTEXITCODE -ne 0) { throw "Texture 48 adaptation failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Invalid source diff" }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Build and test using pinned working workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Pinned Python YAML verification failed" }
          @'
          from pathlib import Path
          import subprocess
          import os
          import yaml
          steps = yaml.safe_load(Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml").read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
          started = False
          finished = False
          for index, step in enumerate(steps):
              if step.get("name") == "Package launchers and symbols":
                  finished = True
                  break
              if step.get("name") == "Install glslang":
                  started = True
              if not started:
                  continue
              if "uses" in step or "run" not in step:
                  raise RuntimeError("Unexpected build step")
              if step["name"] == "Configure CMake":
                  flags = os.environ["KYTY_FLAGS_48"]
                  args = ["cmake", "-S", ".", "-B", "_Build/windows", "-G", "Ninja",
                          "-DCMAKE_BUILD_TYPE=Release", "-DCMAKE_C_COMPILER=clang-cl",
                          "-DCMAKE_CXX_COMPILER=clang-cl",
                          "-DCMAKE_PREFIX_PATH=" + os.environ["QT_ROOT_DIR"],
                          "-DCMAKE_C_FLAGS_INIT=" + flags, "-DCMAKE_CXX_FLAGS_INIT=" + flags,
                          "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"]
                  print("Configuring profile:", os.environ["KYTY_PROFILE_48"], flags, flush=True)
                  subprocess.run(args, check=True)
                  cache = Path("_Build/windows/CMakeCache.txt").read_text(encoding="utf-8")
                  cpp_flags = next((line.split("=", 1)[1] for line in cache.splitlines()
                                    if line.startswith("CMAKE_CXX_FLAGS:STRING=")), None)
                  if cpp_flags is None or "/ehsc" not in cpp_flags.lower():
                      raise RuntimeError("CMake lost /EHsc: C++ exceptions must remain enabled")
                  if not all(option in cpp_flags for option in flags.split()):
                      raise RuntimeError("Selected CPU flags are missing from CMAKE_CXX_FLAGS")
                  print("Verified C++ flags:", cpp_flags, flush=True)
                  continue
              script = Path(f"_build48_{index}.ps1")
              source = step["run"]
              if step["name"] == "Install glslang":
                  api_call = '$release = Invoke-RestMethod -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot" -Headers $headers'
                  if source.count(api_call) != 1:
                      raise RuntimeError("Unexpected glslang API call")
                  authenticated = '\n'.join([
                      'if (-not $env:GH_TOKEN) { throw "GitHub Actions token missing" }',
                      '$apiHeaders = $headers.Clone()',
                      '$apiHeaders["Authorization"] = "Bearer $env:GH_TOKEN"',
                      '$apiHeaders["X-GitHub-Api-Version"] = "2022-11-28"',
                      api_call.replace('-Headers $headers', '-Headers $apiHeaders'),
                  ])
                  source = source.replace(api_call, authenticated)
              script.write_text('$ErrorActionPreference = "Stop"\n' + source, encoding="utf-8")
              print("Running:", step["name"], flush=True)
              path_file = Path(os.environ["GITHUB_PATH"])
              entries = path_file.read_text(encoding="utf-8-sig").splitlines() if path_file.exists() else []
              os.environ["PATH"] = os.pathsep.join(entries + [os.environ["PATH"]])
              if step["name"] == "Test memory and shader paths":
                  for mode in ("0", "1"):
                      os.environ["KYTY_TEXTURE_REUSE_48"] = mode
                      subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
              else:
                  subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
          if not started or not finished:
              raise RuntimeError("Build boundaries missing")
          '@ | & $env:KYTY_PYTHON -
          if ($LASTEXITCODE -ne 0) { throw "Build or tests failed" }

      - name: Package launchers and symbols
        run: |
          $ErrorActionPreference = "Stop"
          $install = "_Build/windows/install"
          if (-not (Test-Path "$install/launcher.exe")) { throw "launcher.exe missing" }
          foreach ($mode in @(0, 1)) {
              $name = if ($mode -eq 1) { "Diagnostico-48.cmd" } else { "Comparacion-48.cmd" }
              @(
                  '@echo off',
                  'setlocal',
                  'cd /d "%~dp0"',
                  "set KYTY_TEXTURE_REUSE_48=$mode",
                  'set KYTY_DIRECT_ADDRESSES_47=0',
                  'set KYTY_PHASES_40=',
                  'set KYTY_CLEAN_RUNS_44=0',
                  'set KYTY_IMMEDIATE_CONDITIONS_42=0',
                  'set KYTY_DEBUG_AB=',
                  'set KYTY_REDUNDANT_SOURCES_38=0',
                  'set KYTY_RESOURCE_COSTS_37=0',
                  'set KYTY_FROZEN_DIAGNOSTIC_36=0',
                  'set KYTY_DESCRIPTOR_MEMO_35=0',
                  'set KYTY_DESCRIPTOR_STATS_35=0',
                  'set KYTY_DESCRIPTOR_RECIPES_34=0',
                  'set KYTY_TRACKING_PAUSE=',
                  'set KYTY_BDA_SLICE_FILTER=',
                  'set KYTY_TRACKING_DIAGNOSTICS=',
                  'set KYTY_ADDRESS_SPACE_DIAGNOSTICS=',
                  'set KYTY_TRACKING_BLOCKING_WAIT=1',
                  'set KYTY_SHARED_SAMPLER_SNAPSHOTS=1',
                  'set KYTY_DIRECT_COLOR_METADATA=1',
                  'set KYTY_RECORD_THREAD=0',
                  'set KYTY_IMAGE_SPECIALIZATION_CACHE=',
                  'set KYTY_DEBUG_NO_PIXEL_TARGETS=0',
                  'set KYTY_DEBUG_SHADER_CPU=0',
                  'set KYTY_RESOURCE_BLOCKS_32=0',
                  'set KYTY_HOST_PRIORITY_26=0',
                  'set KYTY_REFRESH_DIAGNOSTIC_27=0',
                  'set KYTY_SRT_ALIASES_32=0',
                  'set KYTY_DIRECT_FLAT_31=0',
                  'set KYTY_DIRECT_INPUTS_29=0',
                  'set KYTY_ACTIVE_MASK_VIEW_28=0',
                  'set KYTY_DEBUG_QUEUES=',
                  'set KYTY_SRT_STATS=',
                  'set KYTY_DEBUG_SRT_RUNS=',
                  'set KYTY_VERIFY_SRT=',
                  'set KYTY_VERIFY_SPEC=',
                  'set KYTY_VERIFY_SPEC_READS=',
                  'set KYTY_SPECULATE_DRAWS=0',
                  'set KYTY_LIGHT_DRAIN_STATS=1',
                  'set KYTY_DEBUG_SAMPLE_GPU=',
                  'set KYTY_DEBUG_DUMP_THREADS=',
                  'set KYTY_DEBUG_DRAW_PHASES=',
                  'set KYTY_DEBUG_DRAW_STATS=',
                  'set KYTY_DEBUG_SPEC_STATS=',
                  'set KYTY_DEBUG_STREAM_STATS=',
                  'set KYTY_DEBUG_UPLOADS=',
                  'set KYTY_GPU_ZONES=',
                  '"%~dp0launcher.exe" %*'
              ) | Set-Content "$install/$name" -Encoding ascii
          }
          $maps = Get-ChildItem "_Build/windows" -Filter "kyty_emulator_*.map" -File
          if (-not $maps) { throw "Emulator map missing" }
          foreach ($map in $maps) { Copy-Item $map.FullName $install -Force }
          $pdb = "_Build/windows/kyty_emulator.pdb"
          if (-not (Test-Path $pdb)) { throw "Emulator PDB missing" }
          Copy-Item $pdb $install -Force
          @(
              "Diagnostico-48.cmd: texture reuse rejection counters ON.",
              "Comparacion-48.cmd: same executable, diagnostic OFF.",
              "Keep _Patches, _PipelineCache and kyty_settings.ini.",
              "AMD CPU patch OFF; shader validation OFF; red-zone ON.",
              "Select THIS interpreter.",
              "Report full diagnostic console including texture48 lines."
          ) | Set-Content "$install/DIAGNOSTICO-48.txt" -Encoding ascii

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "KytyPS5-Diagnostico-48.zip"
          Compress-Archive -Path "_Build/windows/install/*" -DestinationPath $zip -Force -ErrorAction Stop
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
              throw "Packaging failed: missing or empty ZIP"
          }

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Diagnostico-48
          path: KytyPS5-Diagnostico-48.zip
          if-no-files-found: error
          retention-days: 7
