name: Windows AMD - Diagnostico 22 - Coste CPU por shader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout pinned working diagnostic 20
        uses: actions/checkout@v4
        with:
          ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
          path: _patch_source
          sparse-checkout: |
            patches
            .github/workflows
          fetch-depth: 1
          submodules: false

      - name: Reproduce working AMD source and retained optimizations
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }

          @'
          from pathlib import Path
          import subprocess
          import yaml

          baseline = Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml")
          steps = yaml.safe_load(baseline.read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
          started = False
          finished = False

          for index, step in enumerate(steps):
              if step.get("name") == "Setup MSVC environment":
                  finished = True
                  break
              if step.get("name") == "Verify AMD base":
                  started = True
              if not started:
                  continue
              if "uses" in step or "run" not in step:
                  raise RuntimeError("Unexpected baseline preparation step")

              script = Path(f"_prepare22_{index}.ps1")
              script.write_text(
                  '$ErrorActionPreference = "Stop"\n' + step["run"],
                  encoding="utf-8"
              )
              print("Preparing:", step["name"], flush=True)
              subprocess.run(
                  ["pwsh", "-NoProfile", "-File", str(script.resolve())],
                  check=True
              )

          if not started or not finished:
              raise RuntimeError("Baseline preparation boundaries missing")
          '@ | python -

          if ($LASTEXITCODE -ne 0) { throw "Baseline preparation failed" }

      - name: Add shader CPU ranking
        run: |
          $ErrorActionPreference = "Stop"

          @'
          from pathlib import Path

          p = Path("src/graphics/host_gpu/renderer/debug.cpp")
          s = p.read_text(encoding="utf-8")

          def replace(old, new):
              global s
              if s.count(old) != 1:
                  raise RuntimeError("Unexpected diagnostic source: " + repr(old))
              s = s.replace(old, new)

          replace("\t// DRAW_INDEX_AUTO draws, also on their own (see Begin).", r"""
              struct ShaderCpuRow {
                  uint64_t draws = 0;
                  uint64_t ticks = 0;
                  std::array<uint64_t, Count> phases {};
                  std::array<uint64_t, ProbeCount> probes {};
              };
              static const bool rank_enabled = [] {
                  const char* v = std::getenv("KYTY_DEBUG_SHADER_CPU");
                  return v && std::strcmp(v, "1") == 0;
              }();
              static std::unordered_map<uint64_t, ShaderCpuRow> shader_cpu;
              if (rank_enabled) {
                  auto& row = shader_cpu[pixel_hash];
                  row.draws++;
                  row.ticks += sum;
                  for (uint32_t i = 0; i < Count; i++) row.phases[i] += current[i];
                  for (uint32_t i = 0; i < ProbeCount; i++) row.probes[i] += probes[i];
              }
              // DRAW_INDEX_AUTO draws, also on their own (see Begin).""")

          replace("\tconst auto   gpu_ns  = g_gpu_busy_ns.load(std::memory_order_relaxed);", r"""
              if (rank_enabled) {
                  std::vector<std::pair<uint64_t, ShaderCpuRow>> ranked(shader_cpu.begin(), shader_cpu.end());
                  std::sort(ranked.begin(), ranked.end(), [](const auto& a, const auto& b) {
                      return a.second.ticks > b.second.ticks;
                  });
                  uint64_t total_ticks = 0;
                  for (const auto& entry: ranked) total_ticks += entry.second.ticks;
                  std::printf("shader-cpu: %.1fs groups=%zu total-ms/s=%.2f unit=CPU-preparation\n",
                              seconds, ranked.size(), total_ticks * to_us / 1000.0 / seconds);
                  for (size_t n = 0; n < ranked.size() && n < 16; n++) {
                      const auto& entry = ranked[n];
                      const auto& row = entry.second;
                      std::printf("shader-cpu ps=%016llx draws/s=%.0f us/draw=%.2f ms/s=%.2f share=%.1f%%",
                                  static_cast<unsigned long long>(entry.first), row.draws / seconds,
                                  row.draws ? row.ticks * to_us / row.draws : 0.0,
                                  row.ticks * to_us / 1000.0 / seconds,
                                  total_ticks ? 100.0 * row.ticks / total_ticks : 0.0);
                      for (uint32_t i = 0; i < Count; i++)
                          std::printf(" %s=%.2f", Names[i], row.phases[i] * to_us / row.draws);
                      std::printf(" | probes:");
                      for (uint32_t i = 0; i < ProbeCount; i++)
                          std::printf(" %s=%.2f", ProbeNames[i], row.probes[i] * to_us / row.draws);
                      std::printf("\n");
                  }
                  shader_cpu.clear();
              }
              const auto   gpu_ns  = g_gpu_busy_ns.load(std::memory_order_relaxed);""")

          p.write_text(s, encoding="utf-8", newline="\n")
          print("Diagnostic 22: top 16 shader groups by CPU preparation time")
          '@ | python -

          if ($LASTEXITCODE -ne 0) { throw "Shader CPU instrumentation failed" }

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Invalid source diff" }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Install glslang
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            "User-Agent" = "GitHub-Actions-KytyPS5"
            "Accept" = "application/vnd.github+json"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot" -Headers $headers
          $asset = $release.assets | Where-Object {
            $_.name -match "(?i)windows" -and $_.name -match "(?i)(x64|x86_64|amd64)" -and $_.name -match "(?i)\.zip$"
          } | Select-Object -First 1

          if (-not $asset) {
            $asset = $release.assets | Where-Object {
              $_.name -match "(?i)windows" -and $_.name -match "(?i)\.zip$"
            } | Select-Object -First 1
          }
          if (-not $asset) { throw "No Windows glslang ZIP found" }

          $zip = "$env:RUNNER_TEMP/glslang.zip"
          $extract = "$env:RUNNER_TEMP/glslang"
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $validator = Get-ChildItem $extract -Filter "glslangValidator.exe" -Recurse | Select-Object -First 1
          if (-not $validator) {
            $validator = Get-ChildItem $extract -Filter "glslang.exe" -Recurse | Select-Object -First 1
          }
          if (-not $validator) { throw "glslang executable missing" }

          if ($validator.Name -eq "glslang.exe") {
            Copy-Item $validator.FullName (Join-Path $validator.Directory.FullName "glslangValidator.exe") -Force
          }
          Add-Content $env:GITHUB_PATH $validator.Directory.FullName

      - name: Verify glslang
        run: |
          glslangValidator --version
          if ($LASTEXITCODE -ne 0) { throw "glslang verification failed" }

      - name: Configure CMake
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build KytyPS5
        run: |
          cmake `
            --build _Build/windows `
            --target launcher shader_vertex_metadata_tests memory_tracker_tests resource_materialization_tests shader_cfg_tests virtual_memory_allocation_tests `
            --parallel

          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Test memory and shader paths
        run: |
          $env:KYTY_TRACKING_BLOCKING_WAIT = "1"

          foreach ($mode in @(0, 1)) {
            $env:KYTY_DIRECT_COLOR_METADATA = "$mode"
            $env:KYTY_SHARED_SAMPLER_SNAPSHOTS = "1"

            ctest --test-dir _Build/windows -R '^(shader_vertex_metadata|memory_tracker|resource_materialization|shader_cfg|virtual_memory_allocation)$' --output-on-failure --no-tests=error

            if ($LASTEXITCODE -ne 0) {
              throw "Memory or shader tests failed in mode $mode"
            }
          }

          Remove-Item Env:KYTY_DIRECT_COLOR_METADATA
          Remove-Item Env:KYTY_SHARED_SAMPLER_SNAPSHOTS
          Remove-Item Env:KYTY_TRACKING_BLOCKING_WAIT

      - name: Install KytyPS5
        run: |
          cmake `
            --install _Build/windows `
            --prefix _Build/windows/install

          if ($LASTEXITCODE -ne 0) { throw "Install failed" }

      - name: Package launchers and symbols
        run: |
          $ErrorActionPreference = "Stop"
          $install = "_Build/windows/install"

          if (-not (Test-Path "$install/launcher.exe")) {
            throw "launcher.exe missing"
          }

          foreach ($mode in @(0, 1)) {
            $name = if ($mode -eq 1) { "Diagnostico-22.cmd" } else { "Comparacion-14.cmd" }

            @(
              '@echo off',
              'setlocal',
              'cd /d "%~dp0"',
              'set KYTY_TRACKING_PAUSE=',
              'set KYTY_BDA_SLICE_FILTER=',
              'set KYTY_TRACKING_DIAGNOSTICS=',
              'set KYTY_ADDRESS_SPACE_DIAGNOSTICS=',
              'set KYTY_TRACKING_BLOCKING_WAIT=1',
              'set KYTY_SHARED_SAMPLER_SNAPSHOTS=1',
              'set KYTY_DIRECT_COLOR_METADATA=1',
              'set KYTY_RECORD_THREAD=0',
              'set KYTY_IMAGE_SPECIALIZATION_CACHE=',
              'set KYTY_DEBUG_NO_PIXEL_TARGETS=0',
              "set KYTY_DEBUG_SHADER_CPU=$mode",
              'set KYTY_DEBUG_QUEUES=',
              'set KYTY_SRT_STATS=',
              'set KYTY_DEBUG_SRT_RUNS=',
              'set KYTY_VERIFY_SRT=',
              'set KYTY_VERIFY_SPEC=',
              'set KYTY_VERIFY_SPEC_READS=',
              'set KYTY_SPECULATE_DRAWS=0',
              'set KYTY_LIGHT_DRAIN_STATS=1',
              'set KYTY_DEBUG_SAMPLE_GPU=',
              'set KYTY_DEBUG_DUMP_THREADS=',
              "set KYTY_DEBUG_DRAW_PHASES=$(if ($mode -eq 1) { 'all' } else { '' })",
              'set KYTY_DEBUG_DRAW_STATS=',
              'set KYTY_DEBUG_SPEC_STATS=',
              'set KYTY_DEBUG_STREAM_STATS=',
              'set KYTY_DEBUG_UPLOADS=',
              'set KYTY_GPU_ZONES=',
              '"%~dp0launcher.exe" %*'
            ) | Set-Content "$install/$name" -Encoding ascii
          }

          $maps = Get-ChildItem "_Build/windows" -Filter "kyty_emulator_*.map" -File
          if (-not $maps) { throw "Emulator map missing" }

          foreach ($map in $maps) {
            Copy-Item $map.FullName $install -Force
          }

          $pdb = "_Build/windows/kyty_emulator.pdb"
          if (-not (Test-Path $pdb)) { throw "Emulator PDB missing" }
          Copy-Item $pdb $install -Force

          @(
            "Base AMD: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9",
            "Comparacion-14.cmd: diagnostic counters OFF.",
            "Diagnostico-22.cmd: shader CPU ranking ON.",
            "AMD CPU patch OFF; shader validation OFF; red-zone protection ON.",
            "Copy your working _Patches and select THIS interpreter.",
            "Close emulator and launcher before changing mode.",
            "Heavy view 60 seconds; light view 60 seconds."
          ) | Set-Content "$install/DIAGNOSTICO-22.txt" -Encoding ascii

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath "KytyPS5-Windows-AMD-Diagnostico-22-CPU.zip" `
            -Force -ErrorAction Stop

          $zip = "KytyPS5-Windows-AMD-Diagnostico-22-CPU.zip"
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
            throw "Packaging failed: missing or empty ZIP"
          }

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-AMD-Diagnostico-22-CPU
          path: KytyPS5-Windows-AMD-Diagnostico-22-CPU.zip
          if-no-files-found: error
          retention-days: 7
