name: Windows AMD - Diagnostico 37 - Coste por shader

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - Diagnostico 37
    runs-on: windows-2022

    env:
      KYTY_FLAGS_37: /clang:-ffp-contract=off
      KYTY_PROFILE_37: Generica

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout fixed AMD base
      uses: actions/checkout@v4
      with:
        ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
        submodules: recursive
        fetch-depth: 1

    - name: Checkout pinned working diagnostic 20
      uses: actions/checkout@v4
      with:
        ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
        path: _patch_source
        sparse-checkout: |
          patches
          .github/workflows
        fetch-depth: 1
        submodules: false

    - name: Setup fixed Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Pin Python executable and install YAML parser
      run: |
        $ErrorActionPreference = "Stop"
        $pythonExe = (Get-Command python -CommandType Application | Select-Object -First 1).Source
        if (-not $pythonExe) { throw "Python executable missing" }
        "KYTY_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        & $pythonExe -m pip install PyYAML==6.0.2
        if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
        & $pythonExe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
        if ($LASTEXITCODE -ne 0) { throw "Python YAML verification failed" }

    - name: Reproduce working AMD source and retained optimizations
      run: |
        $ErrorActionPreference = "Stop"
        & $env:KYTY_PYTHON -m pip install PyYAML==6.0.2
        if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
        @'
        from pathlib import Path
        import subprocess
        import yaml

        baseline = Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml")
        steps = yaml.safe_load(baseline.read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
        started = False
        finished = False

        for index, step in enumerate(steps):
            if step.get("name") == "Setup MSVC environment":
                finished = True
                break
            if step.get("name") == "Verify AMD base":
                started = True
            if not started:
                continue
            if "uses" in step or "run" not in step:
                raise RuntimeError("Unexpected baseline preparation step")

            script = Path(f"_prepare37_{index}.ps1")
            script.write_text('$ErrorActionPreference = "Stop"\n' + step["run"], encoding="utf-8")
            print("Preparing:", step["name"], flush=True)
            subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)

        if not started or not finished:
            raise RuntimeError("Baseline preparation boundaries missing")
        '@ | & $env:KYTY_PYTHON -
        if ($LASTEXITCODE -ne 0) { throw "Baseline preparation failed" }

    - name: Add resource timing by shader
      run: |
        $ErrorActionPreference = "Stop"
        @'
        from pathlib import Path

        def replace(path,old,new):
            p=Path(path)
            s=p.read_text(encoding='utf-8')
            if s.count(old)!=1:
                raise RuntimeError('Unexpected diagnostic 37 boundary: '+path)
            p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')

        header='src/graphics/shader/recompiler/ir/passes/ResourceCosts37.h'
        Path(header).write_text('#pragma once\nnamespace Libs::Graphics::ShaderRecompiler::IR {\ninline thread_local bool t_resource_costs37=false;\n}\n',encoding='utf-8')

        p=Path('src/graphics/shader/recompiler/ir/passes/ResourceMaterialization.cpp')
        p.write_text('#include "graphics/shader/recompiler/ir/passes/ResourceCosts37.h"\n#include <chrono>\n#include <map>\n#include <tuple>\n#include <string>\n'+p.read_text(encoding='utf-8'),encoding='utf-8')

        helper=r'''
        namespace {
        const char* ResourceReason37(const ResourcePlan& p) {
            if (!p.compiled || !p.srt_plan_complete || !p.resource_tracking_complete) return "incomplete";
            if (p.has_address_writes) return "address-writes";
            if (p.uniform_fill.fill.words!=0u) return "uniform-fill";
            if (std::ranges::any_of(p.clean_flat_slots,[](auto x){return x!=0u;})) return "clean-SRT";
            if (std::ranges::any_of(p.info.buffers,&BufferResource::written)) return "buffer-writes";
            if (std::ranges::any_of(p.info.images,&ImageResource::written)) return "image-writes";
            if (std::ranges::any_of(p.descriptor_sources,[](const auto& x){return x.indirect_image.has_value();})) return "indirect-images";

            for (const auto& n:p.compiled->nodes) {
                if (n.op==ResourceNode::Op::Select) return "select";
                if (n.op==ResourceNode::Op::ReadFirstLane) return "read-first-lane";
                if ((n.flags&ResourceNode::CleanSlot)!=0u) return "clean-node";
            }

            for (size_t i=0;i<p.compiled->conditions.size();++i) {
                if (p.compiled->conditions[i]!=ResourceNode::NoNode &&
                    (i>=p.compiled->direct_conditions.size() || p.compiled->direct_conditions[i]==0u))
                    return "strict-condition";
            }

            if (!p.compiled->memoizable)
                return p.requires_specialization_memory ? "strict-memory" : "other-nonmemo";
            return "capturable36";
        }

        struct ResourceRow37 {
            uint64_t calls=0,hits=0,failed=0;
            double us=0;
            const char* reason=nullptr;
        };

        void RecordResourceCost37(const ResourcePlan& p,double us,bool result,bool hit) {
            using Key=std::tuple<uint64_t,uint32_t,std::string>;
            static std::map<Key,ResourceRow37> rows;
            static uint64_t samples=0;
            static double total_us=0;
            static auto start=std::chrono::steady_clock::now();

            ++samples;
            total_us+=us;
            const auto* reason=ResourceReason37(p);
            const Key key {p.shader_hash,static_cast<uint32_t>(p.stage),reason};

            if (rows.size()<8192u || rows.contains(key)) {
                auto& r=rows[key];
                if (r.reason==nullptr) r.reason=reason;
                ++r.calls;
                r.us+=us;
                r.hits+=hit ? 1u : 0u;
                r.failed+=result ? 0u : 1u;
            }

            if (samples%256u!=0u) return;
            const auto now=std::chrono::steady_clock::now();
            std::vector<std::pair<Key,ResourceRow37>> sorted(rows.begin(),rows.end());
            std::ranges::sort(sorted,[](const auto& a,const auto& b){return a.second.us>b.second.us;});

            std::printf("resource37: interval-s=%.2f samples=%llu avg-us=%.3f groups=%zu; ranked by sampled CPU time\n",
                std::chrono::duration<double>(now-start).count(),
                static_cast<unsigned long long>(samples),total_us/samples,rows.size());

            for (size_t i=0;i<std::min<size_t>(12u,sorted.size());++i) {
                const auto& [k,r]=sorted[i];
                std::printf("resource37-row: shader=%016llx stage=%u reason=%s calls=%llu hits=%llu failed=%llu avg-us=%.3f sample-share=%.2f%%\n",
                    static_cast<unsigned long long>(std::get<0>(k)),std::get<1>(k),r.reason,
                    static_cast<unsigned long long>(r.calls),
                    static_cast<unsigned long long>(r.hits),
                    static_cast<unsigned long long>(r.failed),
                    r.us/r.calls,total_us>0 ? 100.0*r.us/total_us : 0.0);
            }

            std::fflush(stdout);
            rows.clear();
            samples=0;
            total_us=0;
            start=std::chrono::steady_clock::now();
        }
        }
        '''

        boundary='bool MaterializeResources(const ResourcePlan& program, const SrtRuntime& runtime,'
        replace(str(p),boundary,helper+'\n'+boundary)

        replace(str(p),
            '\tconst bool result = MaterializeCompiled(program, runtime, snapshot, specialization, memo);',
            r'''    thread_local uint64_t calls37=0;
            thread_local uint32_t slot37=1543u;
            bool sample37=false;
            if (t_resource_costs37) {
                ++calls37;
                if ((calls37&4095u)==0u) slot37=(slot37+1543u)&4095u;
                sample37=(calls37&4095u)==slot37;
            }
            const auto begin37=sample37 ? std::chrono::steady_clock::now() : std::chrono::steady_clock::time_point {};
            const bool result = MaterializeCompiled(program, runtime, snapshot, specialization, memo);
            if (sample37) {
                const auto us=std::chrono::duration<double,std::micro>(std::chrono::steady_clock::now()-begin37).count();
                RecordResourceCost37(program,us,result,memo!=nullptr && memo->reused);
            }''')

        p=Path('src/graphics/guest_gpu/graphicsRun.cpp')
        p.write_text('#include "graphics/shader/recompiler/ir/passes/ResourceCosts37.h"\n'+p.read_text(encoding='utf-8'),encoding='utf-8')

        replace(str(p),'\tg_gpu_thread = true;',r'''    g_gpu_thread = true;
            const char* costs37=std::getenv("KYTY_RESOURCE_COSTS_37");
            ShaderRecompiler::IR::t_resource_costs37=costs37!=nullptr && costs37[0]=='1' && costs37[1]=='\0';
            if (ShaderRecompiler::IR::t_resource_costs37) {
                std::printf("resource37: diagnostic active; original execution; one sample per 4096 calls\n");
                std::printf("resource37: stage legend: Unknown=0 Vertex=1 Pixel=2 Fetch=3 Compute=4 Mesh=5 Local=6 TessControl=7 TessEval=8\n");
                std::fflush(stdout);
            }''')

        print('Diagnostic 37 installed: timing original calls only',flush=True)
        '@ | & $env:KYTY_PYTHON -
        if ($LASTEXITCODE -ne 0) { throw "Diagnostic 37 adaptation failed" }
        git diff --check
        if ($LASTEXITCODE -ne 0) { throw "Invalid source diff" }

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup Clang
      uses: egor-tensin/setup-clang@v1
      with:
        version: 18
        platform: x64
        cygwin: 0

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v5

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.3
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: qt5compat
        cache: true

    - name: Build and test using pinned working workflow
      run: |
        $ErrorActionPreference = "Stop"
        & $env:KYTY_PYTHON -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
        if ($LASTEXITCODE -ne 0) { throw "Pinned Python YAML verification failed" }
        @'
        from pathlib import Path
        import subprocess
        import os
        import yaml

        steps = yaml.safe_load(Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml").read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
        started = False
        finished = False

        for index, step in enumerate(steps):
            if step.get("name") == "Package launchers and symbols":
                finished = True
                break
            if step.get("name") == "Install glslang":
                started = True
            if not started:
                continue
            if "uses" in step or "run" not in step:
                raise RuntimeError("Unexpected build step")

            if step["name"] == "Configure CMake":
                flags = os.environ["KYTY_FLAGS_37"]
                args = ["cmake", "-S", ".", "-B", "_Build/windows", "-G", "Ninja",
                        "-DCMAKE_BUILD_TYPE=Release",
                        "-DCMAKE_C_COMPILER=clang-cl",
                        "-DCMAKE_CXX_COMPILER=clang-cl",
                        "-DCMAKE_PREFIX_PATH=" + os.environ["QT_ROOT_DIR"],
                        "-DCMAKE_C_FLAGS_INIT=" + flags,
                        "-DCMAKE_CXX_FLAGS_INIT=" + flags,
                        "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"]

                print("Configuring profile:", os.environ["KYTY_PROFILE_37"], flags, flush=True)
                subprocess.run(args, check=True)

                cache = Path("_Build/windows/CMakeCache.txt").read_text(encoding="utf-8")
                cpp_flags = next((line.split("=", 1)[1] for line in cache.splitlines()
                                  if line.startswith("CMAKE_CXX_FLAGS:STRING=")), None)

                if cpp_flags is None or "/ehsc" not in cpp_flags.lower():
                    raise RuntimeError("CMake lost /EHsc: C++ exceptions must remain enabled")
                if not all(option in cpp_flags for option in flags.split()):
                    raise RuntimeError("Selected CPU flags are missing from CMAKE_CXX_FLAGS")

                print("Verified C++ flags:", cpp_flags, flush=True)
                continue

            script = Path(f"_build37_{index}.ps1")
            script.write_text('$ErrorActionPreference = "Stop"\n' + step["run"], encoding="utf-8")
            print("Running:", step["name"], flush=True)

            path_file = Path(os.environ["GITHUB_PATH"])
            entries = path_file.read_text(encoding="utf-8-sig").splitlines() if path_file.exists() else []
            os.environ["PATH"] = os.pathsep.join(entries + [os.environ["PATH"]])

            subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)

        if not started or not finished:
            raise RuntimeError("Build boundaries missing")
        '@ | & $env:KYTY_PYTHON -
        if ($LASTEXITCODE -ne 0) { throw "Build or tests failed" }

    - name: Package launchers and symbols
      run: |
        $ErrorActionPreference = "Stop"
        $install = "_Build/windows/install"
        if (-not (Test-Path "$install/launcher.exe")) { throw "launcher.exe missing" }

        foreach ($mode in @(0, 1)) {
            $name = if ($mode -eq 1) { "Diagnostico-37.cmd" } else { "Comparacion-37.cmd" }
            @(
                '@echo off',
                'setlocal',
                'cd /d "%~dp0"',
                "set KYTY_RESOURCE_COSTS_37=$mode",
                'set KYTY_FROZEN_DIAGNOSTIC_36=0',
                'set KYTY_DESCRIPTOR_MEMO_35=0',
                'set KYTY_DESCRIPTOR_STATS_35=0',
                'set KYTY_DESCRIPTOR_RECIPES_34=0',
                'set KYTY_TRACKING_PAUSE=',
                'set KYTY_BDA_SLICE_FILTER=',
                'set KYTY_TRACKING_DIAGNOSTICS=',
                'set KYTY_ADDRESS_SPACE_DIAGNOSTICS=',
                'set KYTY_TRACKING_BLOCKING_WAIT=1',
                'set KYTY_SHARED_SAMPLER_SNAPSHOTS=1',
                'set KYTY_DIRECT_COLOR_METADATA=1',
                'set KYTY_RECORD_THREAD=0',
                'set KYTY_IMAGE_SPECIALIZATION_CACHE=',
                'set KYTY_DEBUG_NO_PIXEL_TARGETS=0',
                'set KYTY_DEBUG_SHADER_CPU=0',
                'set KYTY_RESOURCE_BLOCKS_32=0',
                'set KYTY_HOST_PRIORITY_26=0',
                'set KYTY_REFRESH_DIAGNOSTIC_27=0',
                'set KYTY_SRT_ALIASES_32=0',
                'set KYTY_DIRECT_FLAT_31=0',
                'set KYTY_DIRECT_INPUTS_29=0',
                'set KYTY_ACTIVE_MASK_VIEW_28=0',
                'set KYTY_DEBUG_QUEUES=',
                'set KYTY_SRT_STATS=',
                'set KYTY_DEBUG_SRT_RUNS=',
                'set KYTY_VERIFY_SRT=',
                'set KYTY_VERIFY_SPEC=',
                'set KYTY_VERIFY_SPEC_READS=',
                'set KYTY_SPECULATE_DRAWS=0',
                'set KYTY_LIGHT_DRAIN_STATS=1',
                'set KYTY_DEBUG_SAMPLE_GPU=',
                'set KYTY_DEBUG_DUMP_THREADS=',
                'set KYTY_DEBUG_DRAW_PHASES=',
                'set KYTY_DEBUG_DRAW_STATS=',
                'set KYTY_DEBUG_SPEC_STATS=',
                'set KYTY_DEBUG_STREAM_STATS=',
                'set KYTY_DEBUG_UPLOADS=',
                'set KYTY_GPU_ZONES=',
                '"%~dp0launcher.exe" %*'
            ) | Set-Content "$install/$name" -Encoding ascii
        }

        $maps = Get-ChildItem "_Build/windows" -Filter "kyty_emulator_*.map" -File
        if (-not $maps) { throw "Emulator map missing" }
        foreach ($map in $maps) { Copy-Item $map.FullName $install -Force }

        $pdb = "_Build/windows/kyty_emulator.pdb"
        if (-not (Test-Path $pdb)) { throw "Emulator PDB missing" }
        Copy-Item $pdb $install -Force

        @(
            "AMD base: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9",
            "Diagnostico-37.cmd: samples the original resource preparation by shader.",
            "Comparacion-37.cmd: same executable, diagnostic OFF.",
            "Reports timing only; no extra resource evaluation or memory capture.",
            "AMD CPU patch OFF; shader validation OFF; red-zone protection ON.",
            "Copy your working _Patches and select THIS interpreter.",
            "Warm up, then remain in the fixed heavy view for 60 seconds.",
            "Copy console output including resource37 lines.",
            "Close emulator and launcher completely before changing mode."
        ) | Set-Content "$install/DIAGNOSTICO-37.txt" -Encoding ascii

    - name: Create Windows ZIP
      run: |
        $ErrorActionPreference = "Stop"
        $zip = "KytyPS5-Diagnostico-37.zip"
        Compress-Archive -Path "_Build/windows/install/*" -DestinationPath $zip -Force -ErrorAction Stop
        if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
            throw "Packaging failed: missing or empty ZIP"
        }

    - name: Upload KytyPS5
      uses: actions/upload-artifact@v4
      with:
        name: KytyPS5-Diagnostico-37
        path: KytyPS5-Diagnostico-37.zip
        if-no-files-found: error
        retention-days: 7
