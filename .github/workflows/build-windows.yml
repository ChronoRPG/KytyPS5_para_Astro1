name: Build KytyPS5 Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KytyPS5 - Windows x64
    runs-on: windows-2022

    steps:

      # =========================================================
      # 1. Obtener EXACTAMENTE el commit solicitado
      # =========================================================
      - name: Checkout commit 4068f4a
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 0

      # =========================================================
      # 2. MSVC environment
      # =========================================================
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # =========================================================
      # 3. Clang
      # =========================================================
      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      # =========================================================
      # 4. Ninja
      # =========================================================
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # =========================================================
      # 5. Qt
      # =========================================================
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      # =========================================================
      # 6. Instalar glslangValidator
      # =========================================================
      - name: Install glslang
        shell: pwsh
        run: |
          $version = "15.4.0"
          $url = "https://github.com/KhronosGroup/glslang/releases/download/$version/glslang-main-windows-x64-Release.zip"

          Write-Host "Downloading glslang..."
          Invoke-WebRequest `
            -Uri $url `
            -OutFile "$env:RUNNER_TEMP\glslang.zip"

          Write-Host "Extracting glslang..."
          Expand-Archive `
            -Path "$env:RUNNER_TEMP\glslang.zip" `
            -DestinationPath "$env:RUNNER_TEMP\glslang" `
            -Force

          $validator = Get-ChildItem `
            -Path "$env:RUNNER_TEMP\glslang" `
            -Filter "glslangValidator.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $validator) {
            Write-Error "No se encontró glslangValidator.exe"
            exit 1
          }

          $glslangBin = $validator.Directory.FullName

          Write-Host "glslangValidator encontrado:"
          Write-Host $validator.FullName

          Write-Host "Añadiendo al PATH:"
          Write-Host $glslangBin

          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $glslangBin

      # =========================================================
      # 7. Verificar glslang
      # =========================================================
      - name: Check glslangValidator
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "GLSLANG VALIDATOR"
          Write-Host "======================================"

          Get-Command glslangValidator

          glslangValidator --version

      # =========================================================
      # 8. Verificar herramientas
      # =========================================================
      - name: Check build environment
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "CMAKE"
          Write-Host "======================================"
          cmake --version

          Write-Host ""
          Write-Host "======================================"
          Write-Host "NINJA"
          Write-Host "======================================"
          ninja --version

          Write-Host ""
          Write-Host "======================================"
          Write-Host "CLANG-CL"
          Write-Host "======================================"
          clang-cl --version

          Write-Host ""
          Write-Host "======================================"
          Write-Host "QT"
          Write-Host "======================================"
          qmake --version

      # =========================================================
      # 9. Verificar commit
      # =========================================================
      - name: Verify source commit
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD

          Write-Host "Current commit:"
          Write-Host $commit

          if ($commit -ne "4068f4ac886dcd25acc52b6e3fa3e3800dc576a9") {
            Write-Error "ERROR: No estamos en el commit solicitado."
            exit 1
          }

          Write-Host "Commit correcto."

      # =========================================================
      # 10. Mostrar submódulos
      # =========================================================
      - name: Verify submodules
        shell: pwsh
        run: |
          git submodule status

      # =========================================================
      # 11. Configurar CMake
      # =========================================================
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      # =========================================================
      # 12. Compilar
      # =========================================================
      - name: Build KytyPS5
        shell: pwsh
        run: |
          cmake `
            --build _Build/windows `
            --target launcher `
            --parallel

      # =========================================================
      # 13. Instalar
      # =========================================================
      - name: Install KytyPS5
        shell: pwsh
        run: |
          cmake `
            --install _Build/windows `
            --prefix _Build/windows/install

      # =========================================================
      # 14. Buscar EXE
      # =========================================================
      - name: Find generated EXE files
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "GENERATED EXECUTABLES"
          Write-Host "======================================"

          Get-ChildItem `
            -Path "_Build/windows/install" `
            -Filter "*.exe" `
            -Recurse |
            Select-Object FullName, Length

      # =========================================================
      # 15. Crear ZIP
      # =========================================================
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath "KytyPS5-Windows-4068f4a.zip" `
            -Force

      # =========================================================
      # 16. Subir Artifact
      # =========================================================
      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-4068f4a
          path: KytyPS5-Windows-4068f4a.zip
          if-no-files-found: error
          retention-days: 7

