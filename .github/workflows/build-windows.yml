name: Build KytyPS5 Windows

on:
  workflow_dispatch:

jobs:
  build:
    name: Build KytyPS5 - Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout commit 4068f4a
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 `
            -m qtbase qttools qt5compat qtconcurrent `
            --outputdir C:\Qt

          echo "C:\Qt\6.8.3\msvc2022_64\bin" >> $env:GITHUB_PATH

      - name: Check Qt
        shell: pwsh
        run: |
          qmake --version

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl

      - name: Build KytyPS5
        shell: pwsh
        run: |
          cmake --build _Build/windows `
            --target launcher `
            --parallel

      - name: Install KytyPS5
        shell: pwsh
        run: |
          cmake --install _Build/windows `
            --prefix _Build/windows/install

      - name: Show generated files
        shell: pwsh
        run: |
          Get-ChildItem _Build/windows/install -Recurse

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath "KytyPS5-Windows-4068f4a.zip" `
            -Force

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-4068f4a
          path: KytyPS5-Windows-4068f4a.zip
          if-no-files-found: error
