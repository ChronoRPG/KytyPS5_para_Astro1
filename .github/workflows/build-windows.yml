name: Build KytyPS5 Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KytyPS5 - Windows x64
    runs-on: windows-2022

    steps:

      # =========================================================
      # 1. Obtener exactamente el commit solicitado
      # =========================================================
      - name: Checkout commit 4068f4a
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 0

      # =========================================================
      # 2. Visual Studio / MSVC environment
      # =========================================================
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # =========================================================
      # 3. Instalar Clang
      # =========================================================
      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      # =========================================================
      # 4. Ninja
      # =========================================================
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # =========================================================
      # 5. Qt 6 MSVC 2022
      # =========================================================
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      # =========================================================
      # 6. Comprobar herramientas
      # =========================================================
      - name: Check build environment
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "CMAKE"
          Write-Host "======================================"
          cmake --version

          Write-Host ""
          Write-Host "======================================"
          Write-Host "NINJA"
          Write-Host "======================================"
          ninja --version

          Write-Host ""
          Write-Host "======================================"
          Write-Host "CLANG"
          Write-Host "======================================"
          clang --version

          Write-Host ""
          Write-Host "======================================"
          Write-Host "CLANG-CL"
          Write-Host "======================================"
          clang-cl --version

          Write-Host ""
          Write-Host "======================================"
          Write-Host "QT"
          Write-Host "======================================"
          qmake --version

          Write-Host ""
          Write-Host "======================================"
          Write-Host "QT ROOT"
          Write-Host "======================================"
          Write-Host $env:QT_ROOT_DIR

      # =========================================================
      # 7. Verificar que estamos en el commit correcto
      # =========================================================
      - name: Verify source commit
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "CURRENT COMMIT"
          Write-Host "======================================"

          $commit = git rev-parse HEAD

          Write-Host $commit

          if ($commit -ne "4068f4ac886dcd25acc52b6e3fa3e3800dc576a9") {
            Write-Error "ERROR: No estamos en el commit solicitado."
            exit 1
          }

          Write-Host ""
          Write-Host "Commit correcto."

      # =========================================================
      # 8. Mostrar submódulos
      # =========================================================
      - name: Verify submodules
        shell: pwsh
        run: |
          git submodule status

      # =========================================================
      # 9. Configurar CMake usando CLANG-CL
      # =========================================================
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      # =========================================================
      # 10. Compilar launcher
      # =========================================================
      - name: Build KytyPS5
        shell: pwsh
        run: |
          cmake `
            --build _Build/windows `
            --target launcher `
            --parallel

      # =========================================================
      # 11. Instalar aplicación
      # =========================================================
      - name: Install KytyPS5
        shell: pwsh
        run: |
          cmake `
            --install _Build/windows `
            --prefix _Build/windows/install

      # =========================================================
      # 12. Mostrar EXE generados
      # =========================================================
      - name: Find generated EXE files
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "GENERATED EXECUTABLES"
          Write-Host "======================================"

          Get-ChildItem `
            -Path "_Build/windows/install" `
            -Filter "*.exe" `
            -Recurse |
            Select-Object FullName, Length

      # =========================================================
      # 13. Mostrar contenido de instalación
      # =========================================================
      - name: Show installation tree
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "INSTALLATION TREE"
          Write-Host "======================================"

          Get-ChildItem `
            -Path "_Build/windows/install" `
            -Recurse

      # =========================================================
      # 14. Crear ZIP
      # =========================================================
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path "_Build/windows/install")) {
            Write-Error "No existe la carpeta de instalación."
            exit 1
          }

          Compress-Archive `
            -Path "_Build/windows/install/*" `
            -DestinationPath "KytyPS5-Windows-4068f4a.zip" `
            -Force

          Write-Host ""
          Write-Host "ZIP creado correctamente:"
          Write-Host "KytyPS5-Windows-4068f4a.zip"

      # =========================================================
      # 15. Subir ZIP como Artifact
      # =========================================================
      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-4068f4a
          path: KytyPS5-Windows-4068f4a.zip
          if-no-files-found: error
          retention-days: 7
