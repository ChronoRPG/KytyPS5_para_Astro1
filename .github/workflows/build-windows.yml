name: Build KytyPS5 Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KytyPS5 - Windows x64
    runs-on: windows-2022

    steps:
      # ---------------------------------------------------------
      # 1. Descargar EXACTAMENTE el commit solicitado
      # ---------------------------------------------------------
      - name: Checkout commit 4068f4a
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. MSVC
      # ---------------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------------------------------------------------------
      # 3. Ninja
      # ---------------------------------------------------------
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # ---------------------------------------------------------
      # 4. Qt 6
      # ---------------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      # ---------------------------------------------------------
      # 5. Comprobar herramientas
      # ---------------------------------------------------------
      - name: Check build environment
        shell: pwsh
        run: |
          Write-Host "===== CMAKE ====="
          cmake --version

          Write-Host ""
          Write-Host "===== NINJA ====="
          ninja --version

          Write-Host ""
          Write-Host "===== COMPILER ====="
          cl

          Write-Host ""
          Write-Host "===== QT ====="
          qmake --version

          Write-Host ""
          Write-Host "===== QT ROOT ====="
          Write-Host $env:QT_ROOT_DIR

      # ---------------------------------------------------------
      # 6. Mostrar información del repositorio
      # ---------------------------------------------------------
      - name: Show source information
        shell: pwsh
        run: |
          Write-Host "===== COMMIT ====="
          git rev-parse HEAD

          Write-Host ""
          Write-Host "===== SUBMODULES ====="
          git submodule status

      # ---------------------------------------------------------
      # 7. Configurar CMake
      # ---------------------------------------------------------
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B _Build/windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      # ---------------------------------------------------------
      # 8. Compilar
      # ---------------------------------------------------------
      - name: Build KytyPS5
        shell: pwsh
        run: |
          cmake `
            --build _Build/windows `
            --parallel

      # ---------------------------------------------------------
      # 9. Instalar los archivos compilados
      # ---------------------------------------------------------
      - name: Install KytyPS5
        shell: pwsh
        run: |
          cmake `
            --install _Build/windows `
            --prefix _Build/windows/install

      # ---------------------------------------------------------
      # 10. Buscar EXE/DLL generados
      # ---------------------------------------------------------
      - name: Find generated binaries
        shell: pwsh
        run: |
          Write-Host "===== EXE FILES ====="
          Get-ChildItem `
            -Path _Build/windows `
            -Filter *.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "===== DLL FILES ====="
          Get-ChildItem `
            -Path _Build/windows/install `
            -Filter *.dll `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length

      # ---------------------------------------------------------
      # 11. Crear ZIP
      # ---------------------------------------------------------
      - name: Create Windows package
        shell: pwsh
        run: |
          if (Test-Path "_Build/windows/install") {
            Compress-Archive `
              -Path "_Build/windows/install/*" `
              -DestinationPath "KytyPS5-Windows-4068f4a.zip" `
              -Force
          }
          else {
            Write-Error "No se encontró la carpeta de instalación."
          }

      # ---------------------------------------------------------
      # 12. Subir ZIP a GitHub Actions
      # ---------------------------------------------------------
      - name: Upload KytyPS5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-4068f4a
          path: KytyPS5-Windows-4068f4a.zip
          if-no-files-found: error
          retention-days: 7

