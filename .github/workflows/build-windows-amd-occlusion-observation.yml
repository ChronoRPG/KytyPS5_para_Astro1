name: Windows AMD - Diagnostico 51 - Consultas de oclusion
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Checkout fixed AMD base
      uses: actions/checkout@v4
      with:
        ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
        submodules: recursive
        fetch-depth: 1
    - name: Checkout pinned working diagnostic 20
      uses: actions/checkout@v4
      with:
        ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
        path: _patch_source
        sparse-checkout: |-
          patches
          .github/workflows
        fetch-depth: 1
        submodules: false
    - name: Setup fixed Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Pin Python executable and install YAML parser
      run: |
        $ErrorActionPreference = "Stop"
        $pythonExe = (Get-Command python -CommandType Application | Select-Object -First 1).Source
        if (-not $pythonExe) { throw "Python executable missing" }
        "KYTY_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        & $pythonExe -m pip install PyYAML==6.0.2
        if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
        & $pythonExe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
        if ($LASTEXITCODE -ne 0) { throw "Python YAML verification failed" }
    - name: Reproduce working AMD source and retained optimizations
      run: |
        $ErrorActionPreference = "Stop"
        & $env:KYTY_PYTHON -m pip install PyYAML==6.0.2
        if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
        @'
        from pathlib import Path
        import subprocess
        import yaml
        baseline = Path("_patch_source/.github/workflows/build-windows-amd-blocking-wait.yml")
        steps = yaml.safe_load(baseline.read_text(encoding="utf-8"))["jobs"]["build"]["steps"]
        started = False
        finished = False
        for index, step in enumerate(steps):
            if step.get("name") == "Setup MSVC environment":
                finished = True
                break
            if step.get("name") == "Verify AMD base":
                started = True
            if not started:
                continue
            if "uses" in step or "run" not in step:
                raise RuntimeError("Unexpected baseline preparation step")
            script = Path(f"_prepare51_{index}.ps1")
            script.write_text('$ErrorActionPreference = "Stop"\n' + step["run"], encoding="utf-8")
            print("Preparing:", step["name"], flush=True)
            subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
        if not started or not finished:
            raise RuntimeError("Baseline preparation boundaries missing")
        '@ | & $env:KYTY_PYTHON -
        if ($LASTEXITCODE -ne 0) { throw "Baseline preparation failed" }
    - name: Install optional occlusion observation
      run: |
        $ErrorActionPreference = "Stop"
        @'
        from pathlib import Path
        import subprocess
        import sys
        files = {}
        files['patches/adapt_occlusion_register51.py'] = r"""# Development foundation only: preserve guest query control, without changing renderer behavior.
        from pathlib import Path

        def replace(path,old,new):
         p=Path(path);s=p.read_text()
         if s.count(old)!=1:raise RuntimeError('Unexpected occlusion state boundary: '+path)
         p.write_text(s.replace(old,new),newline='\n')
        p='src/graphics/guest_gpu/hardwareContext.h'
        replace(p,'\tDepthRenderOverride m_depth_render_override;',
                  '\tDepthRenderOverride m_depth_render_override;\n\tuint32_t m_depth_count_control = 0;')
        replace(p,'\t[[nodiscard]] const DepthRenderOverride& GetDepthRenderOverride() const {',
        '''    // Preserve every guest bit; decoding and host query behavior are separate work.
            [[nodiscard]] uint32_t GetDepthCountControl() const { return m_depth_count_control; }
            void SetDepthCountControl(uint32_t value) { m_depth_count_control = value; }
        \t[[nodiscard]] const DepthRenderOverride& GetDepthRenderOverride() const {''')
        p='src/graphics/guest_gpu/command_processor/pm4Handlers.cpp'
        replace(p,'\tif (cmd_offset == Pm4::DB_RENDER_OVERRIDE) {',
        '''    if (cmd_offset == Pm4::DB_COUNT_CONTROL) {
                cp.GetCtx().SetDepthCountControl(value);
                return;
            }
        \tif (cmd_offset == Pm4::DB_RENDER_OVERRIDE) {''')
        print('Guest DB_COUNT_CONTROL preserved; host queries unchanged')
        """
        files['patches/adapt_occlusion_scopes51.py'] = r"""from pathlib import Path

        def replace(path, old, new):
            p = Path(path)
            s = p.read_text()
            if s.count(old) != 1:
                raise RuntimeError('Unexpected occlusion scope boundary: ' + path)
            p.write_text(s.replace(old, new), newline='\n')

        p = 'src/graphics/host_gpu/renderer/render.h'
        replace(p, 'class CommandBuffer {\npublic:', '''class CommandBuffer {
        public:
            // Optional experimental hooks; owner must outlive the command buffer.
            // prepare runs outside rendering; begin/end run inside the same scope.
            // A failed prepare means incomplete counting, never a valid zero result.
            struct OcclusionScopeHooks {
                void* context = nullptr;
                bool (*prepare)(void*, vk::CommandBuffer) = nullptr;
                void (*begin)(void*, vk::CommandBuffer) = nullptr;
                void (*end)(void*, vk::CommandBuffer) = nullptr;
                // Owner-thread, nonblocking completion/publication pump; no new recording.
                void (*poll)(void*) = nullptr;
            };
            void SetOcclusionScopeHooks(const OcclusionScopeHooks* hooks) {
                EXIT_IF(m_rendering || m_occlusion_query_active || m_occlusion_polling);
                EXIT_IF(hooks != nullptr && (!hooks->prepare || !hooks->begin || !hooks->end));
                m_occlusion_scope_hooks = hooks;
            }
            void PollOcclusionResults() const {
                if (m_occlusion_scope_hooks == nullptr || m_occlusion_scope_hooks->poll == nullptr) {
                    return;
                }
                EXIT_IF(m_occlusion_polling);
                struct PollScope {
                    bool& active;
                    explicit PollScope(bool& value): active(value) { active = true; }
                    ~PollScope() { active = false; }
                } scope(m_occlusion_polling);
                m_occlusion_scope_hooks->poll(m_occlusion_scope_hooks->context);
            }''')
        replace(p, '\tmutable bool        m_rendering   = false;', '''\tmutable bool        m_rendering   = false;
            const OcclusionScopeHooks* m_occlusion_scope_hooks = nullptr;
            mutable bool m_occlusion_query_active = false;
            mutable bool m_occlusion_polling = false;''')
        p = 'src/graphics/host_gpu/renderer/context.cpp'
        replace(p, '\trendering.renderArea.extent    = {state.width, state.height};',
                '\trendering.renderArea.extent    = vk::Extent2D {state.width, state.height};')
        replace(p, '\tEXIT_IF(m_rendering || m_pending_shader_writes || IsInvalid());',
                '\tEXIT_IF(m_rendering || m_occlusion_query_active || m_pending_shader_writes || IsInvalid());')
        replace(p, '\tEndRendering();\n\n\tstd::array<vk::RenderingAttachmentInfo', '''\tEndRendering();
            const bool count_occlusion = m_occlusion_scope_hooks != nullptr &&
                m_occlusion_scope_hooks->prepare(m_occlusion_scope_hooks->context, Handle());

        \tstd::array<vk::RenderingAttachmentInfo''')
        replace(p, '\tm_rendering    = true;\n}', '''\tm_rendering    = true;
            if (count_occlusion) {
                m_occlusion_scope_hooks->begin(m_occlusion_scope_hooks->context, Handle());
                m_occlusion_query_active = true;
            }
        }''')
        replace(p, '\tif (m_rendering) {\n\t\tHandle().endRendering();', '''\tif (m_rendering) {
                if (m_occlusion_query_active) {
                    m_occlusion_scope_hooks->end(m_occlusion_scope_hooks->context, Handle());
                    m_occlusion_query_active = false;
                }
        \t\tHandle().endRendering();''')
        p = 'src/graphics/guest_gpu/graphicsRun.cpp'
        replace(p, '''void CommandProcessor::BufferInit() {
        \tGetScheduler().Begin(m_ctx, m_ucfg, m_sh_ctx);
        }''', '''void CommandProcessor::BufferInit() {
        \tGetScheduler().Begin(m_ctx, m_ucfg, m_sh_ctx);
            // Runs on the GPU owner thread for each initial or resumed PM4 slice.
            // Optional hook must only collect completed queries; never wait globally.
            GetScheduler().Current().PollOcclusionResults();
        }''')
        print('Optional render-scope and PM4-resume hooks installed; no query backend enabled')
        """
        files['patches/adapt_occlusion_probe51.py'] = r"""from pathlib import Path
        import shutil

        changes = {}
        if 'occlusion_query_precise_enabled' in Path('src/graphics/host_gpu/graphicContext.h').read_text():
            raise RuntimeError('Occlusion probe already adapted; refusing to apply twice')

        def replace(path, old, new):
            p = Path(path)
            s = changes.get(path, p.read_text())
            if s.count(old) != 1:
                raise RuntimeError('Unexpected occlusion probe boundary: ' + path)
            changes[path] = s.replace(old, new)

        p = 'src/graphics/host_gpu/graphicContext.h'
        replace(p, '\tbool                               sample_rate_shading_enabled           = false;',
        '''\tbool                               sample_rate_shading_enabled           = false;
            bool occlusion_query_precise_enabled = false;''')
        p = 'src/graphics/presentation/window/vulkanWindow.cpp'
        replace(p, '\tgraphics.sample_rate_shading_enabled                 = true;',
        '''\tgraphics.sample_rate_shading_enabled                 = true;
            const char* occlusion_probe = std::getenv("KYTY_OCCLUSION_PROBE");
            const bool request_occlusion_probe = occlusion_probe != nullptr &&
                occlusion_probe[0] == '1' && occlusion_probe[1] == '\\0';
            graphics.occlusion_query_precise_enabled = request_occlusion_probe &&
                supported_features2.features.occlusionQueryPrecise == VK_TRUE;
            device_features.occlusionQueryPrecise = graphics.occlusion_query_precise_enabled;
            if (request_occlusion_probe && !graphics.occlusion_query_precise_enabled) {
                std::printf("occlusion51: precise query feature unsupported; observation OFF\\n");
            }''')
        p = 'src/graphics/host_gpu/renderer/commandScheduler.h'
        replace(p, 'class CommandScheduler {', 'class OcclusionProbe;\n\nclass CommandScheduler {')
        replace(p, '\tvoid           EndRendering();', '''\tvoid           EndRendering();
            void ObserveOcclusionDump(uint64_t address, uint32_t control);
            void ObserveOcclusionPredicate(uint32_t op);''')
        replace(p, '\tCommandBuffer                m_command;',
        '''\tCommandBuffer                m_command;
            std::unique_ptr<OcclusionProbe> m_occlusion_probe;''')
        p = 'src/graphics/host_gpu/renderer/commandScheduler.cpp'
        replace(p, '#include <algorithm>', '#include "graphics/host_gpu/renderer/occlusionProbe.h"\n\n#include <algorithm>')
        replace(p, '\tShutdown();\n\tif (GpuZones::g_context == this)', '''\tShutdown();
            // Shutdown submitted and waited for every buffer using the pool.
            if (m_occlusion_probe) {
                m_command.SetOcclusionScopeHooks(nullptr);
                m_occlusion_probe.reset();
            }
        \tif (GpuZones::g_context == this)''')
        replace(p, 'void CommandScheduler::EndRendering() {', '''void CommandScheduler::ObserveOcclusionDump(uint64_t address, uint32_t control) {
            if (m_occlusion_probe) { m_occlusion_probe->Dump(address, control); }
        }

        void CommandScheduler::ObserveOcclusionPredicate(uint32_t op) {
            if (m_occlusion_probe) { m_occlusion_probe->Predicate(op); }
        }

        void CommandScheduler::EndRendering() {''')
        replace(p, '''\tif (CommandRecordingDeferred()) {
        \t\tm_stream = std::make_unique<CommandStream>();
        \t}''', '''\tif (CommandRecordingDeferred()) {
        \t\tm_stream = std::make_unique<CommandStream>();
        \t}
            if (m_graphics.occlusion_query_precise_enabled) {
                if (m_stream != nullptr) {
                    std::printf("occlusion51: requires KYTY_RECORD_THREAD=0; observation OFF\\n");
                } else {
                    try {
                        m_occlusion_probe = std::make_unique<OcclusionProbe>(*this, m_graphics);
                        m_command.SetOcclusionScopeHooks(m_occlusion_probe->Hooks());
                    } catch (const std::exception& error) {
                        std::printf("occlusion51: backend unavailable: %s; observation OFF\\n", error.what());
                        m_occlusion_probe.reset();
                    }
                }
            }''')
        p = 'src/graphics/guest_gpu/graphicsRun.cpp'
        replace(p, '\t\t\tDrainStats::Record(DrainStats::Kind::OcclusionQuery, 1);',
        '''\t\t\tDrainStats::Record(DrainStats::Kind::OcclusionQuery, 1);
                    GetScheduler().ObserveOcclusionDump(event_address, m_ctx.GetDepthCountControl());''')
        replace(p, '''\tuint64_t value = 0;
        \tif (op != 0) {''', '''\tuint64_t value = 0;
            GetScheduler().ObserveOcclusionPredicate(op);
        \tif (op != 0) {''')
        source = Path(__file__).resolve().parent.parent/'experiments/occlusion'
        target = Path('src/graphics/host_gpu/renderer')
        for name in ['OcclusionProbe.h', 'VulkanPool.h', 'Timeline.h', 'Segments.h']:
            if not (source/name).is_file():
                raise RuntimeError('Missing observation backend component: ' + name)
        # Validate all replacement boundaries and components before modifying any source.
        for path, text in changes.items():
            Path(path).write_text(text, newline='\n')
        shutil.copyfile(source/'OcclusionProbe.h', target/'occlusionProbe.h')
        (target/'occlusion').mkdir(exist_ok=True)
        for name in ['VulkanPool.h', 'Timeline.h', 'Segments.h']:
            shutil.copyfile(source/name, target/'occlusion'/name)
        print('Opt-in Vulkan observation installed; synthetic guest results and predication unchanged')
        """
        files['experiments/occlusion/Timeline.h'] = r"""#pragma once
        // Development component, not connected to Vulkan or guest memory yet.
        // Tracks a logical cumulative sample counter; guest per-DB encoding is deliberately separate.
        // Single-owner-thread component: backend callbacks must marshal results to that owner.
        // Forget each snapshot after guest publication; this class does not own guest address lifetime.
        #include <cstdint>
        #include <cstddef>
        #include <deque>
        #include <optional>
        #include <unordered_map>
        #include <vector>
        namespace KytyOcclusionExperiment {
        class Timeline {
        public:
         static constexpr uint64_t Mask=(uint64_t{1}<<63)-1;
         struct Lease {uint32_t slot=0;uint64_t generation=0,serial=0;};
         struct Snapshot {uint64_t address=0,generation=0;};
         explicit Timeline(uint32_t max_slots=4096):m_max_slots(max_slots){}
         std::optional<Lease> Issue(uint64_t submission_tick) {
          if(m_pending.size()>=m_max_slots)return std::nullopt;
          uint32_t index=0;
          for(;index<m_slots.size();++index)if(!m_slots[index].busy)break;
          if(index==m_slots.size()) {
           if(m_slots.size()>=m_max_slots)return std::nullopt;
           m_slots.emplace_back();
          }
          auto& slot=m_slots[index];slot.busy=true;slot.resolved=false;
          slot.submission_tick=submission_tick;slot.serial=++m_serial;++slot.generation;
          m_pending.push_back({slot.serial,{},index,slot.generation});
          return Lease{index,slot.generation,slot.serial};
         }
         bool Resolve(Lease lease,uint64_t samples) {
          if(lease.slot>=m_slots.size())return false;
          auto& slot=m_slots[lease.slot];
          if(!slot.busy || slot.generation!=lease.generation || slot.serial!=lease.serial || slot.resolved)return false;
          bool found=false;
          for(auto& pending:m_pending)if(pending.serial==lease.serial){pending.samples=samples&Mask;found=true;break;}
          if(!found)return false;
          slot.resolved=true;
          Drain();Reclaim();return true;
         }
         Snapshot Capture(uint64_t address) {
          // At most one pending publication per guest address; replacing it invalidates older tokens.
          auto& snapshot=m_snapshots[address];snapshot.generation=++m_publication_generation;
          snapshot.serial=m_serial;snapshot.value.reset();
          if(m_completed_serial>=snapshot.serial)snapshot.value=m_total;
          return {address,snapshot.generation};
         }
         std::optional<uint64_t> Poll(Snapshot token) const {
          const auto it=m_snapshots.find(token.address);
          if(it==m_snapshots.end() || it->second.generation!=token.generation)return std::nullopt;
          return it->second.value;
         }
         bool Forget(Snapshot token) {
          auto it=m_snapshots.find(token.address);
          if(it==m_snapshots.end() || it->second.generation!=token.generation)return false;
          m_snapshots.erase(it);return true;
         }
         void CompletedTick(uint64_t tick) {if(tick>m_completed_tick)m_completed_tick=tick;Reclaim();}
         std::size_t Slots() const {return m_slots.size();}
         std::size_t Pending() const {return m_pending.size();}
        private:
         struct Slot {uint64_t generation=0,serial=0,submission_tick=0;bool busy=false,resolved=false;};
         struct PendingQuery {uint64_t serial;std::optional<uint64_t> samples;uint32_t slot;uint64_t generation;};
         struct Publication {uint64_t generation=0,serial=0;std::optional<uint64_t> value;};
         void Drain() {
          while(!m_pending.empty() && m_pending.front().samples.has_value()) {
           const auto query=m_pending.front();m_pending.pop_front();
           m_total=(m_total+*query.samples)&Mask;m_completed_serial=query.serial;
           for(auto& [address,snapshot]:m_snapshots) {
            (void)address;
            if(!snapshot.value.has_value() && snapshot.serial==m_completed_serial)snapshot.value=m_total;
           }
          }
         }
         void Reclaim() {
          for(auto& slot:m_slots)if(slot.busy && slot.resolved && slot.submission_tick<=m_completed_tick)slot.busy=false;
         }
         uint32_t m_max_slots;
         uint64_t m_serial=0,m_completed_serial=0,m_total=0,m_completed_tick=0,m_publication_generation=0;
         std::vector<Slot> m_slots;
         std::deque<PendingQuery> m_pending;
         std::unordered_map<uint64_t,Publication> m_snapshots;
        };
        }
        """
        files['experiments/occlusion/VulkanPool.h'] = r"""#pragma once
        // Experimental backend. Caller owns slot generations, command-buffer scopes and
        // synchronization. Reset before entering rendering; begin/end in the same scope.
        // Destroy only after all submissions referring to this pool have completed.
        #include <vulkan/vulkan_core.h>
        #include <cstdint>
        #include <stdexcept>
        namespace KytyOcclusionExperiment {
        class VulkanPool {
        public:
         struct Dispatch {
          PFN_vkCreateQueryPool create;
          PFN_vkDestroyQueryPool destroy;
          PFN_vkCmdResetQueryPool reset;
          PFN_vkCmdBeginQuery begin;
          PFN_vkCmdEndQuery end;
          PFN_vkGetQueryPoolResults results;
         };
         enum class Status { Pending, Available, Error };
         struct Result { Status status; uint64_t samples; VkResult error; };
         VulkanPool(VkDevice device, Dispatch dispatch, uint32_t capacity,
                    bool precise_feature_enabled):m_device(device),m_dispatch(dispatch),m_capacity(capacity) {
          if(!capacity || !precise_feature_enabled || !dispatch.create || !dispatch.destroy ||
             !dispatch.reset || !dispatch.begin || !dispatch.end || !dispatch.results)
           throw std::invalid_argument("occlusion backend requires enabled precise queries and valid dispatch");
          VkQueryPoolCreateInfo info{};info.sType=VK_STRUCTURE_TYPE_QUERY_POOL_CREATE_INFO;
          info.queryType=VK_QUERY_TYPE_OCCLUSION;info.queryCount=capacity;
          if(dispatch.create(device,&info,nullptr,&m_pool)!=VK_SUCCESS)
           throw std::runtime_error("occlusion query pool creation failed");
         }
         ~VulkanPool(){m_dispatch.destroy(m_device,m_pool,nullptr);}
         VulkanPool(const VulkanPool&)=delete;
         VulkanPool& operator=(const VulkanPool&)=delete;
         uint32_t Capacity()const{return m_capacity;}
         void Reset(VkCommandBuffer command,uint32_t slot){Check(slot);m_dispatch.reset(command,m_pool,slot,1);}
         void Begin(VkCommandBuffer command,uint32_t slot){Check(slot);m_dispatch.begin(command,m_pool,slot,VK_QUERY_CONTROL_PRECISE_BIT);}
         void End(VkCommandBuffer command,uint32_t slot){Check(slot);m_dispatch.end(command,m_pool,slot);}
         Result Read(uint32_t slot) {
          Check(slot);
          struct {uint64_t samples=0,available=0;} data;
          const auto result=m_dispatch.results(m_device,m_pool,slot,1,sizeof(data),&data,sizeof(data),
              VK_QUERY_RESULT_64_BIT|VK_QUERY_RESULT_WITH_AVAILABILITY_BIT);
          if(result!=VK_SUCCESS && result!=VK_NOT_READY)return {Status::Error,0,result};
          if(result==VK_NOT_READY || !data.available)return {Status::Pending,0,VK_NOT_READY};
          return {Status::Available,data.samples,VK_SUCCESS};
         }
        private:
         void Check(uint32_t slot)const{if(slot>=m_capacity)throw std::out_of_range("occlusion query slot");}
         VkDevice m_device;
         Dispatch m_dispatch;
         uint32_t m_capacity;
         VkQueryPool m_pool=VK_NULL_HANDLE;
        };
        }
        """
        files['experiments/occlusion/Segments.h'] = r"""#pragma once
        // Experimental connection between the Vulkan pool and cumulative timeline.
        // Single owner thread. Caller must close rendering through Finish before submission,
        // event snapshots, control changes, or any implicit render-scope termination.
        #include "Timeline.h"
        #include "VulkanPool.h"
        #include <functional>
        #include <vector>
        namespace KytyOcclusionExperiment {
        class Segments {
        public:
         using Observer=std::function<void(uint64_t)>;
         explicit Segments(VulkanPool& pool,Observer observer={}):m_pool(pool),m_timeline(pool.Capacity()),m_observer(std::move(observer)){}
         // Must be called outside rendering. open_rendering must begin the render scope
         // synchronously and must not throw; it must not submit or change command buffers.
         bool Start(VkCommandBuffer command,uint64_t tick,const std::function<void()>& open_rendering){
          if(!Prepare(command,tick))return false;
          open_rendering();
          Begin(command);return true;
         }
         // Separate prepare/begin for the central CommandBuffer scope hooks.
         bool Prepare(VkCommandBuffer command,uint64_t tick){
          if(m_active || m_prepared)throw std::logic_error("nested occlusion segment");
          if(m_incomplete)return false;
          auto lease=m_timeline.Issue(tick);
          if(!lease){m_incomplete=true;return false;}
          m_pool.Reset(command,lease->slot);m_prepared=Entry{*lease,tick,command};return true;
         }
         void Begin(VkCommandBuffer command){
          if(!m_prepared || m_active || command!=m_prepared->command)
           throw std::logic_error("occlusion begin without matching preparation");
          m_pool.Begin(command,m_prepared->lease.slot);m_active=m_prepared;m_prepared.reset();
         }
         // Called while still inside the same rendering scope, before endRendering.
         void Finish(VkCommandBuffer command){
          if(!m_active)return;
          if(command!=m_active->command)throw std::logic_error("occlusion segment crossed command buffers");
          m_pool.End(command,m_active->lease.slot);
          m_ended.push_back(*m_active);m_active.reset();
         }
         Timeline::Snapshot Capture(uint64_t address){
          if(m_active || m_prepared)throw std::logic_error("snapshot requires closing the active segment");
          if(m_incomplete)throw std::logic_error("incomplete occlusion counting cannot produce snapshots");
          return m_timeline.Capture(address);
         }
         std::optional<uint64_t> Poll(Timeline::Snapshot snapshot)const{return m_timeline.Poll(snapshot);}
         bool Forget(Timeline::Snapshot snapshot){return m_timeline.Forget(snapshot);}
         // Called on the owner thread with a tick known completed by the scheduler.
         // No global wait. Not-ready queries remain queued, even after a tick notification.
         VkResult Collect(uint64_t completed_tick){
          for(auto it=m_ended.begin();it!=m_ended.end();){
           if(it->tick>completed_tick){++it;continue;}
           const auto result=m_pool.Read(it->lease.slot);
           if(result.status==VulkanPool::Status::Error)return result.error;
           if(result.status==VulkanPool::Status::Pending){++it;continue;}
           if(!m_timeline.Resolve(it->lease,result.samples))throw std::logic_error("stale occlusion lease");
           if(m_observer)m_observer(result.samples);
           it=m_ended.erase(it);
          }
          m_timeline.CompletedTick(completed_tick);return VK_SUCCESS;
         }
         bool Active()const{return m_active.has_value();}
         bool CompleteCounting()const{return !m_incomplete;}
         std::size_t Pending()const{return m_timeline.Pending();}
        private:
