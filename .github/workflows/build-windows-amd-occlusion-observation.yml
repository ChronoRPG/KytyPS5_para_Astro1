        files['experiments/occlusion/OcclusionProbe.h'] = r"""#pragma once
        // Observation only: never publishes query results or changes guest predication.
        // Installed only with precise queries enabled and deferred recording disabled.
        #include "graphics/host_gpu/renderer/commandScheduler.h"
        #include "graphics/host_gpu/graphicContext.h"
        #include "occlusion/Segments.h"
        #include <chrono>
        #include <cinttypes>
        #include <cstdio>
        #include <functional>
        #include <unordered_map>
        namespace Libs::Graphics {
        class OcclusionProbe {
        public:
         using Clock=std::chrono::steady_clock;
         using Now=std::function<Clock::time_point()>;
         explicit OcclusionProbe(CommandScheduler& scheduler,GraphicContext& graphics,
                                 Now now=[] {return Clock::now();})
             :m_scheduler(scheduler),m_pool(static_cast<VkDevice>(graphics.device),Dispatch(graphics),4096,
                                           graphics.occlusion_query_precise_enabled),
              m_segments(m_pool,[this](uint64_t samples){++m_resolved_segments;if(samples==0)++m_zero_segments;m_samples+=samples;}),
              m_now(std::move(now)) {
          m_last_report=m_last_poll=m_now();
          m_hooks={this,&PrepareThunk,&BeginThunk,&EndThunk,&PollThunk};
          std::printf("occlusion51: observation only; guest counters unchanged; precise queries ON; natural rendering scopes\n");
         }
         const CommandBuffer::OcclusionScopeHooks* Hooks()const{return &m_hooks;}
         void Dump(uint64_t address,uint32_t control){
          (void)address;
          ++m_dumps;
          if(m_controls.contains(control) || m_controls.size()<64)++m_controls[control];
          // Do not split rendering at a dump: restarting a clear attachment could change
          // its contents. These samples cover natural scopes, NOT exact guest dump intervals.
          Poll();
         }
         void Predicate(uint32_t op){if(op==1)++m_zpass_predicates;else if(op==3)++m_boolean_predicates;}
         void Poll(){
          const auto now=m_now();
          // This diagnostic does not publish guest results: 1 ms batching is sufficient.
          // Avoid reading every pending query again at every render-scope transition.
          if(now-m_last_poll<std::chrono::milliseconds(1))return;
          m_last_poll=now;
          if(!m_error){
           auto& master=m_scheduler.GetMasterSemaphore();master.Refresh();
           const auto result=m_segments.Collect(master.KnownGpuTick());
           if(result!=VK_SUCCESS){m_error=true;std::printf("occlusion51: read error=%d; observation stopped\n",int(result));}
          }
          if(now-m_last_report>=std::chrono::seconds(5))Report();
         }
         void Report(){
          std::printf("occlusion51-stats: dumps=%" PRIu64 " resolved-scopes=%" PRIu64
                      " pending=%zu issued-scopes=%" PRIu64 " zero-sample-scopes=%" PRIu64 " samples=%" PRIu64
                      " predicate-zpass=%" PRIu64 " predicate-bool=%" PRIu64
                      " incomplete=%u error=%u\n",
                      m_dumps,m_resolved_segments,m_segments.Pending(),m_counted_segments,m_zero_segments,m_samples,
                      m_zpass_predicates,m_boolean_predicates,
                      m_segments.CompleteCounting()?0u:1u,m_error?1u:0u);
          for(const auto& [control,count]:m_controls)
           std::printf("occlusion51-control: raw=0x%08" PRIx32 " dumps=%" PRIu64 "\n",control,count);
          std::fflush(stdout);m_last_report=m_now();
         }
         uint64_t ResolvedSegments()const{return m_resolved_segments;}
        private:
         using Pool=KytyOcclusionExperiment::VulkanPool;
         using Segments=KytyOcclusionExperiment::Segments;
         static Pool::Dispatch Dispatch(GraphicContext& graphics){
          return {
           reinterpret_cast<PFN_vkCreateQueryPool>(graphics.device.getProcAddr("vkCreateQueryPool")),
           reinterpret_cast<PFN_vkDestroyQueryPool>(graphics.device.getProcAddr("vkDestroyQueryPool")),
           reinterpret_cast<PFN_vkCmdResetQueryPool>(graphics.device.getProcAddr("vkCmdResetQueryPool")),
           reinterpret_cast<PFN_vkCmdBeginQuery>(graphics.device.getProcAddr("vkCmdBeginQuery")),
           reinterpret_cast<PFN_vkCmdEndQuery>(graphics.device.getProcAddr("vkCmdEndQuery")),
           reinterpret_cast<PFN_vkGetQueryPoolResults>(graphics.device.getProcAddr("vkGetQueryPoolResults"))
          };
         }
         static bool PrepareThunk(void* context,vk::CommandBuffer command){
          auto& self=*static_cast<OcclusionProbe*>(context);self.Poll();
          if(self.m_error)return false;
          const bool prepared=self.m_segments.Prepare(static_cast<VkCommandBuffer>(command),self.m_scheduler.CurrentTick());
          if(prepared)++self.m_counted_segments;
          return prepared;
         }
         static void BeginThunk(void* context,vk::CommandBuffer command){static_cast<OcclusionProbe*>(context)->m_segments.Begin(static_cast<VkCommandBuffer>(command));}
         static void EndThunk(void* context,vk::CommandBuffer command){static_cast<OcclusionProbe*>(context)->m_segments.Finish(static_cast<VkCommandBuffer>(command));}
         static void PollThunk(void* context){static_cast<OcclusionProbe*>(context)->Poll();}
         CommandScheduler& m_scheduler;
         Pool m_pool;
         Segments m_segments;
         CommandBuffer::OcclusionScopeHooks m_hooks;
         std::unordered_map<uint32_t,uint64_t> m_controls;
         uint64_t m_dumps=0,m_resolved_segments=0,m_zero_segments=0,m_counted_segments=0,m_samples=0;
         uint64_t m_zpass_predicates=0,m_boolean_predicates=0;
         bool m_error=false;
         Now m_now;
         Clock::time_point m_last_report{},m_last_poll{};
        };
        }
        """
        files['experiments/occlusion/TimelineTests.cpp'] = r"""#include "Timeline.h"
        #include <cassert>
        #include <cstdio>
        #include <random>
        using KytyOcclusionExperiment::Timeline;
        int main(){
         Timeline t(2);auto zero=t.Capture(0x1000);assert(t.Poll(zero)==0);assert(t.Forget(zero));
         auto a=*t.Issue(10);auto first=t.Capture(0x1000);auto b=*t.Issue(11);auto second=t.Capture(0x2000);
         assert(!t.Poll(first));assert(!t.Poll(second));assert(!t.Issue(12));
         assert(t.Resolve(b,8));assert(!t.Poll(second));assert(!t.Issue(12));
         assert(t.Resolve(a,3));assert(t.Poll(first)==3);assert(t.Poll(second)==11);
         assert(!t.Resolve(a,99));assert(!t.Issue(12)); // Availability alone must not reclaim slots.
         t.CompletedTick(10);auto c=*t.Issue(12);assert(c.slot==a.slot && c.generation!=a.generation);
         assert(!t.Resolve(a,99));auto replacement=t.Capture(0x1000);assert(!t.Poll(first));assert(!t.Poll(replacement));
         assert(t.Resolve(c,0));assert(t.Poll(replacement)==11);assert(!t.Forget(first));assert(t.Forget(replacement));
         // A missing early result must bound the pending queue even when later slots retire.
         Timeline bounded(2);auto gap=*bounded.Issue(1);auto later=*bounded.Issue(2);
         assert(bounded.Resolve(later,5));bounded.CompletedTick(2);assert(!bounded.Issue(3));
         assert(bounded.Resolve(gap,2));assert(bounded.Pending()==0);assert(bounded.Issue(3));
         // Completed count wraps independently of the guest ready bit.
         Timeline wrap;auto w=*wrap.Issue(1);auto ws=wrap.Capture(1);assert(wrap.Resolve(w,Timeline::Mask));assert(wrap.Poll(ws)==Timeline::Mask);
         auto w2=*wrap.Issue(2);auto ws2=wrap.Capture(2);assert(wrap.Resolve(w2,2));assert(wrap.Poll(ws2)==1);
         // Random out-of-order completion must preserve every serial prefix snapshot.
         std::mt19937 random(51);
         for(unsigned round=0;round<200;++round){
          Timeline timeline(64);std::vector<Timeline::Lease> leases;std::vector<Timeline::Snapshot> snapshots;
          std::vector<uint64_t> prefix;
          for(unsigned i=0;i<64;++i){leases.push_back(*timeline.Issue(100+i));snapshots.push_back(timeline.Capture(0x1000+i*8));auto samples=random()%100;prefix.push_back(samples);}
          std::vector<unsigned> order;for(unsigned i=0;i<64;++i)order.push_back(i);
          for(unsigned i=64;i>1;--i)std::swap(order[i-1],order[random()%i]);
          std::vector<bool> ready(64);unsigned complete=0;
          for(auto i:order){assert(timeline.Resolve(leases[i],prefix[i]));ready[i]=true;while(complete<64 && ready[complete])++complete;
           uint64_t sum=0;for(unsigned j=0;j<64;++j){sum=(sum+prefix[j])&Timeline::Mask;auto result=timeline.Poll(snapshots[j]);assert(result.has_value()==(j<complete));if(result)assert(*result==sum);}
          }
          assert(timeline.Pending()==0);assert(!timeline.Issue(200));timeline.CompletedTick(200);assert(timeline.Issue(201));
          assert(timeline.Slots()==64);
         }
         std::puts("Timeline: delayed/out-of-order results, zero counts, wrap, stale tokens, bounded slots and tick retirement passed");
        }
        """
        files['experiments/occlusion/VulkanPoolTests.cpp'] = r"""#include "VulkanPool.h"
