name: Windows AMD - Prueba 60 Plus - Tres cambios

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - Prueba 60 Plus
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    env:
      KYTY_FLAGS_51: /clang:-ffp-contract=off
      KYTY_PROFILE_51: Generica

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout pinned working diagnostic 20
        uses: actions/checkout@v4
        with:
          ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
          path: _patch_source
          sparse-checkout: |
            patches
            .github/workflows
          fetch-depth: 1
          submodules: false

      - name: Read pinned original workflow 60
        uses: actions/checkout@v4
        with:
          ref: 8344367d56e00196db7faf989e32912d7414e2e1
          path: _workflow60
          sparse-checkout: .github/workflows/build-windows-amd-storage-repeat60.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          submodules: false

      - name: Read pinned working diagnostic 51
        uses: actions/checkout@v4
        with:
          ref: 8344367d56e00196db7faf989e32912d7414e2e1
          path: _workflow51
          sparse-checkout: .github/workflows/build-windows-amd-occlusion-observation.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          submodules: false

      - name: Read pinned Jetsku int16.1 clear decoder and tests
        uses: actions/checkout@v4
        with:
          repository: Jetsku/KytyPS5
          ref: f9e19582f0deac0d1226a7ce3faae30a9ab408ab
          path: _donor60
          sparse-checkout: |
            src/graphics/host_gpu/renderer/image/imageInfo.h
            tests/ClearRegisterDecodeTests.cpp
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          submodules: false

      - name: Setup fixed Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin Python executable and install YAML parser
        run: |
          $ErrorActionPreference = "Stop"
          $pythonExe = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          if (-not $pythonExe) { throw "Python executable missing" }
          "KYTY_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $pythonExe -m pip install PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }
          & $pythonExe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Python YAML verification failed" }

      - name: Create runner for pinned workflow 60
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          path = Path("_workflow60/.github/workflows/build-windows-amd-storage-repeat60.yml")
          workflow = yaml.safe_load(path.read_text(encoding="utf-8"))
          name = sys.argv[1]
          steps = [s for s in workflow["jobs"]["build"]["steps"] if s.get("name") == name]
          if len(steps) != 1 or "run" not in steps[0]:
              raise RuntimeError("Missing pinned step: " + name)

          script = Path("_run_saved60.ps1")
          script.write_text(
              '$ErrorActionPreference = "Stop"\n' + steps[0]["run"],
              encoding="utf-8"
          )
          print("Running pinned 60 step:", name, flush=True)
          subprocess.run(["pwsh", "-NoProfile", "-File", str(script.resolve())], check=True)
          '@ | Set-Content "_run_saved60.py" -Encoding utf8

          & $env:KYTY_PYTHON _run_saved60.py "Create runner for existing plain-text workflow"
          if ($LASTEXITCODE -ne 0) { throw "Pinned runner creation failed" }

      - name: Reproduce working AMD source and retained optimizations
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON _run_saved60.py "Reproduce working AMD source and retained optimizations"
          if ($LASTEXITCODE -ne 0) { throw "AMD source preparation failed" }

      - name: Install repeated storage write experiment 60
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON _run_saved60.py "Install repeated storage write experiment 60"
          if ($LASTEXITCODE -ne 0) { throw "Storage repeat adaptation failed" }

      - name: Install memory search and register clear commits
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          changes = {}

          def replace(path, old, new):
              p = Path(path)
              text = changes.get(path, p.read_text(encoding="utf-8"))
              if text.count(old) != 1:
                  raise RuntimeError("Unexpected suite60 boundary: " + path + " / " + old[:70])
              changes[path] = text.replace(old, new)

          def function(source, name):
              start = source.index("[[nodiscard]] inline bool " + name + "(")
              opening = source.index("{", start)
              depth = 1
              pos = opening + 1
              while depth:
                  if source[pos] == "{":
                      depth += 1
                  if source[pos] == "}":
                      depth -= 1
                  pos += 1
              return source[start:pos]

          source = Path(
              "_donor60/src/graphics/host_gpu/renderer/image/imageInfo.h"
          ).read_text(encoding="utf-8")

          helper = "// Register-clear port from Jetsku 00ed2a5a6c58, int16.1.\n"
          helper += function(source, "ClearRegisterWideEnabled") + "\n\n"
          helper += function(source, "DecodePackedColorClear64") + "\n\n"

          p = "src/graphics/host_gpu/renderer/image/imageInfo.h"
          replace(
              p,
              "#include <cstdint>",
              "#include <cstdint>\n#include <cstdlib>\n#include <limits>"
          )
          replace(
              p,
              "\tuint32_t            clear_word           = 0;",
              "\tuint32_t            clear_word           = 0;\n"
              "\tuint32_t clear_word1 = 0;"
          )
          replace(
              p,
              "[[nodiscard]] inline bool DecodePackedStencilClear",
              helper + "[[nodiscard]] inline bool DecodePackedStencilClear"
          )

          p = "src/graphics/host_gpu/renderer/colorRenderTarget.cpp"
          replace(
              p,
              "\t\tdesc.info.metadata.clear_word           = rt.clear_word0.word0;",
              "\t\tdesc.info.metadata.clear_word           = rt.clear_word0.word0;\n"
              "        desc.info.metadata.clear_word1 = ClearRegisterWideEnabled() ? rt.clear_word1.word1 : 0;"
          )

          p = "src/graphics/host_gpu/renderer/cache/textureCache.cpp"
          replace(
              p,
              '#include "graphics/host_gpu/renderer/cache/textureCache.h"',
              '#include "graphics/host_gpu/renderer/cache/textureCache.h"\n'
              '#include "graphics/host_gpu/renderer/image/clear60plusStats.h"'
          )
          replace(
              p,
              "\t\treturn desc.type == TextureCache::BindingType::RenderTarget &&\n"
              "\t\t       metadata.clear_register_valid &&\n"
              "\t\t       DecodePackedColorClear(format, metadata.clear_word, clear);",
              "        if (desc.type != TextureCache::BindingType::RenderTarget ||\n"
              "            !metadata.clear_register_valid) return false;\n"
              "        const bool old_ok = DecodePackedColorClear(format, metadata.clear_word, clear);\n"
              "        if (!ClearRegisterWideEnabled()) return old_ok;\n"
              "        const bool decoded = DecodePackedColorClear64(\n"
              "            format, metadata.clear_word, metadata.clear_word1, clear);\n"
              "        if (decoded && !old_ok)\n"
              "            KytyClear60Plus::extra_decodes.fetch_add(1, std::memory_order_relaxed);\n"
              "        return decoded;"
          )
          replace(
              p,
              "    KytyStorageRepeat60::Banner();",
              "    KytyStorageRepeat60::Banner();\n"
              '    std::printf("clear60plus: wide register clears %s\\n", ClearRegisterWideEnabled() ? "ON" : "OFF");'
          )
          replace(
              p,
              "    KytyStorageRepeat60::Frame();",
              "    KytyStorageRepeat60::Frame();\n"
              "    KytyClear60Plus::Report();"
          )

          p = "src/kernel/memoryAddressSpace.inc"
          old = (
              "\t\tfor (const auto& [base, range_size]: m_free) {\n"
              "\t\t\tconst auto candidate = AlignUp"
          )
          fast = r'''        // Indexed scan port from Jetsku f1a4dffcafd2; opt-in.
                  static const bool fast_search60 = [] {
                      const char* value = std::getenv("KYTY_FAST_FREE_SEARCH_60");
                      const bool on = value && std::strcmp(value, "1") == 0;
                      std::printf("memory60plus: indexed free-range search %s\n", on ? "ON" : "OFF");
                      return on;
                  }();
                  if (fast_search60) {
                      auto it = m_free.upper_bound(search_start);
                      if (it != m_free.begin()) --it;
                      for (; it != m_free.end() && it->first < search_end; ++it) {
                          const auto& [base, range_size] = *it;
                          const auto candidate = AlignUp(std::max(base, search_start), alignment);
                          if (candidate < search_end && size <= search_end - candidate &&
                              GuestFreeRangeContains(base, range_size, candidate, size))
                              return candidate;
                      }
                      return 0;
                  }
          '''
          replace(p, old, fast + old)

          for path, text in changes.items():
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          test = Path("_donor60/tests/ClearRegisterDecodeTests.cpp").read_text(encoding="utf-8")
          needle = "\tTestUnchangedFormats();"
          if test.count(needle) != 1:
              raise RuntimeError("Unexpected donor clear test")
          test = test.replace(
              needle,
              needle + "\n\tImageMetadataInfo a {}, b {};\n"
              "\tb.clear_word1 = 1;\n"
              '\tCheck(!(a == b), "metadata comparison includes the second register word");'
          )
          Path("tests/ClearRegister60PlusTests.cpp").write_text(
              test, encoding="utf-8", newline="\n"
          )

          p = Path("CMakeLists.txt")
          p.write_text(
              p.read_text(encoding="utf-8") +
              "\nadd_executable(clear_register60plus_tests EXCLUDE_FROM_ALL tests/ClearRegister60PlusTests.cpp)\n"
              "target_link_libraries(clear_register60plus_tests common fmt::fmt Vulkan::Headers)\n"
              "target_include_directories(clear_register60plus_tests PRIVATE ${inc_headers})\n"
              "add_test(NAME clear_register60plus COMMAND $<TARGET_FILE:clear_register60plus_tests>)\n",
              encoding="utf-8", newline="\n"
          )

          stats = r"""#pragma once
          #include <atomic>
          #include <cstdint>
          #include <cstdio>
          namespace KytyClear60Plus {
          inline std::atomic_uint64_t extra_decodes {0};
          inline thread_local uint64_t ticks = 0;
          inline void Report() {
              if (++ticks % 300 == 0) {
                  std::printf("clear60plus-stats: extra-register-decodes=%llu\n",
                      static_cast<unsigned long long>(extra_decodes.load(std::memory_order_relaxed)));
                  std::fflush(stdout);
              }
          }
          }
          """
          Path("src/graphics/host_gpu/renderer/image/clear60plusStats.h").write_text(
              stats, encoding="utf-8", newline="\n"
          )
          print("suite60: indexed memory search and register clears installed; PGO unchanged")
          '@ | & $env:KYTY_PYTHON -

          if ($LASTEXITCODE -ne 0) { throw "Suite 60 adaptation failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Invalid source diff" }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
          platform: x64
          cygwin: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Build and test using pinned working workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON _run_saved60.py "Build and test using pinned working workflow"
          if ($LASTEXITCODE -ne 0) { throw "Build or baseline tests failed" }

      - name: Test storage repeat policy OFF and ON
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON _run_saved60.py "Test storage repeat policy OFF and ON"
          if ($LASTEXITCODE -ne 0) { throw "Storage repeat tests failed" }

      - name: Test register clears and memory paths
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build _Build/windows --target clear_register60plus_tests --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Register clear test build failed" }

          $env:KYTY_CLEAR_REGISTER_WIDE = "1"
          ctest --test-dir _Build/windows --output-on-failure --no-tests=error -R "^clear_register60plus$"
          if ($LASTEXITCODE -ne 0) { throw "Register clear tests failed" }

          foreach ($mode in @("0", "1")) {
              $env:KYTY_FAST_FREE_SEARCH_60 = $mode
              $env:KYTY_CLEAR_REGISTER_WIDE = $mode
              $env:KYTY_GUEST_STORAGE_REPEAT = $mode
              ctest --test-dir _Build/windows --output-on-failure --no-tests=error -R "^(memory_tracker|virtual_memory_allocation)$"
              if ($LASTEXITCODE -ne 0) { throw "Memory tests failed in mode $mode" }
          }

          Remove-Item Env:KYTY_FAST_FREE_SEARCH_60 -ErrorAction SilentlyContinue
          Remove-Item Env:KYTY_CLEAR_REGISTER_WIDE -ErrorAction SilentlyContinue
          Remove-Item Env:KYTY_GUEST_STORAGE_REPEAT -ErrorAction SilentlyContinue

      - name: Package launchers and symbols
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON _run_saved60.py "Package launchers and symbols"
          if ($LASTEXITCODE -ne 0) { throw "Launcher packaging failed" }

      - name: Create comparison and combined test launchers
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          install = Path("_Build/windows/install")
          marker = '"%~dp0launcher.exe" %*'

          for mode, old, new in [
              (0, "Comparacion-60.cmd", "Comparacion-60-Plus.cmd"),
              (1, "Prueba-60.cmd", "Prueba-60-Plus.cmd")
          ]:
              path = install/old
              text = path.read_text(encoding="ascii")
              if text.count(marker) != 1:
                  raise RuntimeError("Launcher boundary missing")
              text = text.replace(
                  marker,
                  f"set KYTY_FAST_FREE_SEARCH_60={mode}\n"
                  f"set KYTY_CLEAR_REGISTER_WIDE={mode}\n" + marker
              )
              (install/new).write_text(text, encoding="ascii", newline="\r\n")
              path.unlink()

          (install/"PRUEBA-60.txt").unlink(missing_ok=True)
          (install/"PRUEBA-60-PLUS.txt").write_text(
              "Comparison: original barriers, original memory scan, original register decoding.\n"
              "Test: all three changes ON. Same executable, compiler and build flags.\n"
              "PGO and IPO are not added by this workflow.\n"
              "Keep _Patches, _PipelineCache and kyty_settings.ini. Select THIS interpreter.\n"
              "AMD CPU patch OFF; shader validation OFF; red-zone ON.\n"
              "Warm up, then heavy and light views for 60 seconds each. Send both consoles and FPS.\n"
              "clear60plus counts extra decode decisions, not GPU clear commands.\n"
              "If graphical errors appear, close the test and use the comparison.\n",
              encoding="ascii"
          )
          '@ | & $env:KYTY_PYTHON -

          if ($LASTEXITCODE -ne 0) { throw "Combined launchers failed" }

      - name: Create Windows ZIP
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "KytyPS5-Prueba-60-Plus.zip"
          Compress-Archive -Path "_Build/windows/install/*" -DestinationPath $zip -Force -ErrorAction Stop
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
              throw "Packaging failed"
          }

      - name: Upload KytyPS5
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Prueba-60-Plus
          path: KytyPS5-Prueba-60-Plus.zip
          if-no-files-found: error
          retention-days: 7
