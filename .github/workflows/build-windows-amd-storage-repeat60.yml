name: Windows AMD - Prueba 60 TODO - commits IPO PGO

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows - ${{ matrix.label }}
    runs-on: windows-2022
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Comparacion-Base
            mode: '0'
          - label: Prueba-Todo
            mode: '1'

    defaults:
      run:
        shell: pwsh

    env:
      KYTY_FLAGS_51: /clang:-ffp-contract=off
      KYTY_PROFILE_51: Generica
      ALL_MODE: ${{ matrix.mode }}
      BUILD_LABEL: ${{ matrix.label }}

    steps:
      - name: Checkout fixed AMD base
        uses: actions/checkout@v4
        with:
          ref: 4068f4ac886dcd25acc52b6e3fa3e3800dc576a9
          submodules: recursive
          fetch-depth: 1

      - name: Checkout pinned working diagnostic 20
        uses: actions/checkout@v4
        with:
          ref: 535aa7ef4d19ef96ec97c757f0c728a4f83e83b5
          path: _patch_source
          sparse-checkout: |
            patches
            .github/workflows
          fetch-depth: 1
          submodules: false

      - name: Read pinned working diagnostic 51
        uses: actions/checkout@v4
        with:
          ref: 8344367d56e00196db7faf989e32912d7414e2e1
          path: _workflow51
          sparse-checkout: .github/workflows/build-windows-amd-occlusion-observation.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          submodules: false

      - name: Setup fixed Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin Python executable and install YAML parser
        run: |
          $ErrorActionPreference = "Stop"
          $pythonExe = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          if (-not $pythonExe) { throw "Python executable missing" }

          "KYTY_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & $pythonExe -m pip install PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw "YAML parser installation failed" }

          & $pythonExe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Python YAML verification failed" }

      - name: Checkout pinned experiment 60
        uses: actions/checkout@v4
        with:
          ref: 8344367d56e00196db7faf989e32912d7414e2e1
          path: _workflow60
          sparse-checkout: .github/workflows/build-windows-amd-storage-repeat60.yml
          sparse-checkout-cone-mode: false

      - name: Create runner for existing plain-text workflow
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          source = Path("_workflow60/.github/workflows/build-windows-amd-storage-repeat60.yml")
          workflow = yaml.safe_load(source.read_text(encoding="utf-8"))
          name = sys.argv[1]
          selected = [
              step for step in workflow["jobs"]["build"]["steps"]
              if step.get("name") == name
          ]

          if len(selected) != 1:
              raise RuntimeError("Missing pinned step: " + name)

          script = Path("_execute60.ps1")
          script.write_text(
              '$ErrorActionPreference = "Stop"\n' + selected[0]["run"],
              encoding="utf-8"
          )
          subprocess.run(
              ["pwsh", "-NoProfile", "-File", str(script.resolve())],
              check=True
          )
          '@ | Set-Content _execute60.py -Encoding utf8

          & $env:KYTY_PYTHON _execute60.py "Create runner for existing plain-text workflow"
          if ($LASTEXITCODE -ne 0) { throw "Runner setup failed" }

      - name: Reproduce working AMD source and retained optimizations
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON _run_saved51.py "Reproduce working AMD source and retained optimizations"
          if ($LASTEXITCODE -ne 0) { throw "AMD source preparation failed" }

      - name: Install repeated storage write experiment 60
        run: |
          $ErrorActionPreference = "Stop"
          & $env:KYTY_PYTHON _execute60.py "Install repeated storage write experiment 60"
          if ($LASTEXITCODE -ne 0) { throw "Storage adaptation failed" }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Checkout Jetsku donor and PGO profile
        uses: actions/checkout@v4
        with:
          repository: Jetsku/KytyPS5
          ref: f9e19582f0deac0d1226a7ce3faae30a9ab408ab
          path: _jetsku
          sparse-checkout: |
            src/graphics/host_gpu/renderer/image/imageInfo.h
            tests/ClearRegisterDecodeTests.cpp
            tools/pgo/u59-int9-sg-1.profdata
          sparse-checkout-cone-mode: false

      - name: Install matching LLVM 22.1.3
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-22.1.3-win64.exe"

          Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.3/LLVM-22.1.3-win64.exe" -OutFile $installer

          $process = Start-Process $installer -ArgumentList '/S','/D=C:\LLVM-22.1.3' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installation failed" }

          & C:\LLVM-22.1.3\bin\clang-cl.exe --version
          if ($LASTEXITCODE -ne 0) { throw "LLVM verification failed" }

          "C:\LLVM-22.1.3\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

          cmd /c "mklink /J C:\kyty-src `"$env:GITHUB_WORKSPACE`""
          if ($LASTEXITCODE -ne 0) { throw "Source junction failed" }

          git config --global --add safe.directory C:/kyty-src

      - name: Install combined changes and compiler optimization
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import os
          import subprocess

          def replace(path, old, new):
              p = Path(path)
              source = p.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise RuntimeError(
                      "Unexpected boundary: " + path + " / " + old[:60]
                  )
              p.write_text(
                  source.replace(old, new),
                  encoding="utf-8",
                  newline="\n"
              )

          # Same compiler and source path in both builds.
          workflow = "_workflow51/.github/workflows/build-windows-amd-occlusion-observation.yml"

          replace(
              workflow,
              '"cmake", "-S", ".", "-B", "_Build/windows"',
              '"cmake", "-S", "C:/kyty-src", "-B", "_Build/windows"'
          )
          replace(
              workflow,
              '"-DCMAKE_C_COMPILER=clang-cl"',
              '"-DCMAKE_C_COMPILER=C:/LLVM-22.1.3/bin/clang-cl.exe"'
          )
          replace(
              workflow,
              '"-DCMAKE_CXX_COMPILER=clang-cl"',
              '"-DCMAKE_CXX_COMPILER=C:/LLVM-22.1.3/bin/clang-cl.exe",\n'
              '                        "-DCMAKE_LINKER=C:/LLVM-22.1.3/bin/lld-link.exe",\n'
              '                        "-DCMAKE_AR=C:/LLVM-22.1.3/bin/llvm-lib.exe"'
          )

          if os.environ["ALL_MODE"] == "1":
              # Adapt f1a4dffcafd28a45b8cdf3253947c70e33613aa5.
              replace(
                  "src/kernel/memoryAddressSpace.inc",
                  "\t\tfor (const auto& [base, range_size]: m_free) {\n"
                  "\t\t\tconst auto candidate = AlignUp(std::max(base, search_start), alignment);",
                  "\t\tauto it = m_free.upper_bound(search_start);\n"
                  "\t\tif (it != m_free.begin()) --it;\n"
                  "\t\tfor (; it != m_free.end() && it->first < search_end; ++it) {\n"
                  "\t\t\tconst auto& [base, range_size] = *it;\n"
                  "\t\t\tconst auto candidate = AlignUp(std::max(base, search_start), alignment);"
              )

              # Adapt 00ed2a5a6c58 using pinned donor functions.
              donor = Path(
                  "_jetsku/src/graphics/host_gpu/renderer/image/imageInfo.h"
              ).read_text(encoding="utf-8")

              def function(name):
                  start = donor.index(
                      "[[nodiscard]] inline bool " + name + "("
                  )
                  opening = donor.index("{", start)
                  depth = 1
                  end = opening + 1
                  while depth:
                      depth += (donor[end] == "{") - (donor[end] == "}")
                      end += 1
                  return donor[start:end] + "\n"

              header = "src/graphics/host_gpu/renderer/image/imageInfo.h"

              replace(
                  header,
                  "#include <cstdint>",
                  "#include <cstdint>\n#include <cstdlib>\n#include <limits>"
              )
              replace(
                  header,
                  "\tuint32_t            clear_word           = 0;",
                  "\tuint32_t            clear_word           = 0;\n"
                  "\tuint32_t clear_word1 = 0;"
              )
              replace(
                  header,
                  "[[nodiscard]] inline bool DecodePackedStencilClear(",
                  function("ClearRegisterWideEnabled") + "\n"
                  + function("DecodePackedColorClear64") + "\n"
                  + "[[nodiscard]] inline bool DecodePackedStencilClear("
              )
              replace(
                  "src/graphics/host_gpu/renderer/colorRenderTarget.cpp",
                  "desc.info.metadata.clear_word           = rt.clear_word0.word0;",
                  "desc.info.metadata.clear_word           = rt.clear_word0.word0;\n"
                  "\t\tdesc.info.metadata.clear_word1 = rt.clear_word1.word1;"
              )
              replace(
                  "src/graphics/host_gpu/renderer/cache/textureCache.cpp",
                  "DecodePackedColorClear(format, metadata.clear_word, clear);",
                  "DecodePackedColorClear64(format, metadata.clear_word, metadata.clear_word1, clear);"
              )

              test = Path(
                  "_jetsku/tests/ClearRegisterDecodeTests.cpp"
              ).read_text(encoding="utf-8")
              Path("tests/ClearRegisterAllTests.cpp").write_text(
                  test, encoding="utf-8"
              )

              cmake = r"""
          add_executable(clear_register_all_tests EXCLUDE_FROM_ALL tests/ClearRegisterAllTests.cpp)
          target_link_libraries(clear_register_all_tests common fmt::fmt Vulkan::Headers)
          target_include_directories(clear_register_all_tests PRIVATE ${inc_headers})
          add_test(NAME clear_register_all COMMAND $<TARGET_FILE:clear_register_all_tests>)

          # Match the donor's emulator-target IPO scope.
          set_property(TARGET kyty_emulator PROPERTY INTERPROCEDURAL_OPTIMIZATION_RELEASE TRUE)

          set(imported_profile "C:/kyty-src/tools/pgo/u59-int9-sg-1.profdata")
          if(NOT EXISTS "${imported_profile}")
              message(FATAL_ERROR "Imported PGO profile missing")
          endif()

          foreach(profile_target common kyty_emulator)
              target_compile_options(${profile_target} PRIVATE
                  "-fprofile-instr-use=${imported_profile}"
                  -Wno-profile-instr-unprofiled
                  -Wprofile-instr-missing)
          endforeach()

          message(STATUS "Prueba 60 ALL: IPO ON; imported Jetsku PGO ON")
          """
              p = Path("CMakeLists.txt")
              p.write_text(
                  p.read_text(encoding="utf-8") + cmake,
                  encoding="utf-8",
                  newline="\n"
              )

              profile = Path("tools/pgo/u59-int9-sg-1.profdata")
              profile.parent.mkdir(parents=True, exist_ok=True)
              profile.write_bytes(
                  Path(
                      "_jetsku/tools/pgo/u59-int9-sg-1.profdata"
                  ).read_bytes()
              )
              subprocess.run(
                  [
                      "C:/LLVM-22.1.3/bin/llvm-profdata.exe",
                      "show",
                      str(profile)
                  ],
                  check=True
              )

          print("Build mode:", os.environ["ALL_MODE"], flush=True)
          subprocess.run(["git", "diff", "--check"], check=True)
          '@ | & $env:KYTY_PYTHON -

          if ($LASTEXITCODE -ne 0) { throw "Combined adaptation failed" }

      - name: Build and test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          & $env:KYTY_PYTHON _run_saved51.py "Build and test using pinned working workflow" 2>&1 | Tee-Object build-all.log
          if ($LASTEXITCODE -ne 0) { throw "Build or baseline tests failed" }

          $ninja = Get-Content _Build/windows/build.ninja -Raw
          if ($env:ALL_MODE -eq "1") {
              if (-not $ninja.Contains("-fprofile-instr-use=") -or -not $ninja.Contains("-flto")) {
                  throw "PGO or IPO flags absent"
              }
              if (-not $ninja.Contains('C$:\kyty-src\src\emulator.cpp')) {
                  throw "Unexpected PGO source path"
              }
          }

          $warnings = Select-String build-all.log -Pattern "profile data may be|profile.*out of date|profile.*incomplete|no profile data"
          if ($warnings) {
              "::warning::Imported PGO profile has coverage warnings. Inspect build-all.log; this is not a locally trained profile."
              $warnings | Select-Object -First 20
          }

      - name: Test combined helpers
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build _Build/windows --target storage_repeat60_tests --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Storage test build failed" }

          foreach ($mode in @("0", "1")) {
              $env:KYTY_GUEST_STORAGE_REPEAT = $mode
              ctest --test-dir _Build/windows --output-on-failure --no-tests=error -R "^storage_repeat60$"
              if ($LASTEXITCODE -ne 0) { throw "Storage tests failed" }
          }

          if ($env:ALL_MODE -eq "1") {
              cmake --build _Build/windows --target clear_register_all_tests --parallel 2
              if ($LASTEXITCODE -ne 0) { throw "Clear test build failed" }

              $env:KYTY_CLEAR_REGISTER_WIDE = "1"
              ctest --test-dir _Build/windows --output-on-failure --no-tests=error -R "^clear_register_all$"
              if ($LASTEXITCODE -ne 0) { throw "Clear tests failed" }
          }

      - name: Package launchers
        run: |
          $ErrorActionPreference = "Stop"

          & $env:KYTY_PYTHON _run_saved51.py "Package launchers and symbols"
          if ($LASTEXITCODE -ne 0) { throw "Launcher packaging failed" }

          $install = "_Build/windows/install"
          $source = if ($env:ALL_MODE -eq "1") { "Prueba-60.cmd" } else { "Comparacion-60.cmd" }
          $name = if ($env:ALL_MODE -eq "1") { "Prueba-60-Todo.cmd" } else { "Comparacion-60-Base.cmd" }

          $body = Get-Content "$install/$source" -Raw
          $body = $body.Replace(
              '"%~dp0launcher.exe" %*',
              "set KYTY_CLEAR_REGISTER_WIDE=$env:ALL_MODE`r`n`"%~dp0launcher.exe`" %*"
          )
          $body | Set-Content "$install/$name" -Encoding ascii

          Remove-Item "$install/Prueba-60.cmd", "$install/Comparacion-60.cmd"

          @(
              "Build: $name; combined mode=$env:ALL_MODE.",
              "ALL=storage-repeat60, indexed free-range search, wide register clears, IPO and imported PGO.",
              "BASE=retained AMD source; these three changes OFF; IPO and PGO OFF.",
              "LLVM 22.1.3 in both builds. Imported profile may have partial coverage.",
              "Copy _Patches, _PipelineCache and kyty_settings.ini into each extracted build.",
              "AMD CPU patch OFF; shader validation OFF; red-zone ON.",
              "Select this folder's interpreter. Warm up 1 minute; heavy 60s, light 60s."
          ) | Set-Content "$install/PRUEBA-60-TODO.txt" -Encoding ascii

          $zip = "KytyPS5-60-$env:BUILD_LABEL.zip"
          Compress-Archive "$install/*" $zip -Force
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
              throw "Packaging failed"
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-60-${{ matrix.label }}
          path: KytyPS5-60-${{ matrix.label }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Compiler-log-60-${{ matrix.label }}
          path: build-all.log
          if-no-files-found: ignore
          retention-days: 7
